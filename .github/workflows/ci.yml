name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests and type checks do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        # Fails on a known high or critical advisory in any dependency, Electron included:
        # it is a development dependency but it is the runtime Pulp ships.
        run: npm audit --audit-level=high
      - name: Lint and type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  render-windows:
    # Full render path on Windows: Electron offscreen window, ffmpeg, and the
    # end-to-end suite including the 150% display scaling check.
    runs-on: windows-latest
    # The end-to-end suite renders 4K and 8K on a two-core runner; a healthy run takes about 6.5 minutes
    # (run 40123690231), so this limit is nine times that: a run that reaches it is stuck, not slow, and
    # the reporter's last "▶" line says which test it is inside (docs/platform-notes.md, "Windows CI").
    timeout-minutes: 60
    env:
      # Fail instead of skipping if Electron, ffmpeg or ffprobe is missing.
      PULP_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        # Latest from Chocolatey (9.x at the time of writing), which is what a fresh
        # install gets. The e2e suite also runs locally on ffmpeg 8.0, so both series stay covered.
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Unit and end-to-end tests
        run: npm test
      - name: Report the capture bitmap layout on this platform
        # Runs even when tests fail: the "frames:" line says what toBitmap() returns here.
        if: always()
        run: |
          ffmpeg -version | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/probe" | Out-Null
          npx electron . --render pulp.samples.lower-third-bar --preset png-sequence --out "$env:RUNNER_TEMP/probe/lt" --param "panel=#ffffffd9"
          # Written to a file first: PowerShell pipes are text streams and corrupt binary output.
          ffmpeg -v error -i "$env:RUNNER_TEMP/probe/lt_00090.png" -vf "format=rgba,crop=1:1:120:840" -frames:v 1 -f rawvideo -pix_fmt rgba "$env:RUNNER_TEMP/probe/panel-pixel.rgba"
          Format-Hex "$env:RUNNER_TEMP/probe/panel-pixel.rgba"

  render-macos:
    # Full render path on macOS, the main development platform and the only one with
    # VideoToolbox (HEVC with alpha; that test skips itself where the encoder is missing).
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PULP_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: npm ci
      - name: Unit and end-to-end tests
        run: npm test

  render-linux:
    # Full render path on Linux under a virtual display, so the end-to-end suite runs here
    # rather than skipping for want of one.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PULP_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb dbus dbus-x11
      - run: npm ci
      - name: Fetch the Electron binary
        # Electron 44 downloads its binary the first time it runs, not during npm ci, and the
        # sandbox step below needs the files it brings. The installer script fetches them without
        # launching Electron, which would abort here before its sandbox helper is set up.
        run: node node_modules/electron/install.js
      - name: Let Electron's sandbox run
        # The runner's kernel blocks unprivileged user namespaces, which Chromium's sandbox needs;
        # the setuid helper is the supported alternative.
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Unit and end-to-end tests
        # A session bus, which the runner lacks: without one Electron logs "Failed to connect to the
        # bus" on every launch, and the tests that expect a quiet run read it as an error.
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm test
