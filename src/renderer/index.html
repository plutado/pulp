<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pulp-template:; frame-src pulp-template:; connect-src 'self' ws:">
  <title>Pulp</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <input id="search" type="search" placeholder="Search (try tag:wipe or type:template)" autocomplete="off" spellcheck="false">
        <div class="sidebar-actions">
          <button id="add-folder" type="button">Add folder</button>
          <button id="rescan" type="button">Rescan</button>
        </div>
      </div>
      <ul id="results" class="results" aria-label="Library"></ul>
      <div id="library-summary" class="summary"></div>
    </aside>

    <main class="stage">
      <div class="preview-wrap">
        <div id="preview-frame" class="preview checker">
          <iframe id="preview" title="Template preview" sandbox="allow-scripts allow-same-origin"></iframe>
          <div id="preview-empty" class="preview-empty">Select a template</div>
        </div>
      </div>
      <div class="transport">
        <button id="play" type="button" disabled>Play</button>
        <input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Frame">
        <span id="timecode" class="timecode">--</span>
      </div>
      <div id="details" class="details"></div>
    </main>

    <section class="inspector">
      <div class="params-head">
        <h2>Parameters</h2>
        <div class="params-actions">
          <button id="undo" type="button" disabled title="Undo (Ctrl+Z or Cmd+Z outside a text field)">Undo</button>
          <button id="redo" type="button" disabled title="Redo (Shift+Ctrl+Z, Ctrl+Y or Shift+Cmd+Z)">Redo</button>
          <button id="reset-all" type="button" disabled title="Reset every parameter to the template's defaults">Reset all</button>
        </div>
      </div>
      <form id="params" class="params"></form>
      <h2>Render</h2>
      <label class="field">
        <span>Output preset</span>
        <select id="preset"></select>
      </label>
      <p id="preset-note" class="note"></p>
      <p id="preset-unavailable" class="note" hidden></p>
      <div class="render-options">
        <label class="field">
          <span>Frame rate</span>
          <select id="opt-fps"></select>
        </label>
        <label class="field" id="opt-background-field" hidden>
          <span>Background for flattening</span>
          <input id="opt-background" type="color" value="#000000">
        </label>
        <div class="trim">
          <label class="field">
            <span>In point</span>
            <input id="opt-in" type="text" inputmode="numeric" spellcheck="false" placeholder="00:00:00:00" title="Timecode HH:MM:SS:FF, a frame number, or seconds such as 2.5s">
          </label>
          <label class="field">
            <span>Out point (inclusive)</span>
            <input id="opt-out" type="text" inputmode="numeric" spellcheck="false" placeholder="last frame" title="Timecode HH:MM:SS:FF, a frame number, or seconds such as 2.5s">
          </label>
        </div>
        <p id="options-note" class="note"></p>
      </div>
      <div class="render-actions">
        <button id="render" type="button" class="primary" disabled>Render...</button>
      </div>
      <p id="render-status" class="note" role="status"></p>
      <p id="ffmpeg-status" class="note"></p>
      <div class="queue-head">
        <h2>Queue</h2>
        <button id="clear-finished" type="button" disabled>Clear finished</button>
      </div>
      <ul id="queue" class="queue" aria-label="Render queue" aria-live="polite"></ul>
    </section>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
