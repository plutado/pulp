<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pulp-template: pulp-media: pulp-thumb: pulp-strip:; media-src 'self' pulp-media:; frame-src pulp-template:; connect-src 'self' ws:">
  <title>Pulp</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="region-browse" class="sidebar" aria-label="Browse">
      <div class="sidebar-head">
        <div class="region-head">
          <span class="region-title">Library</span>
          <button id="browse-toggle" type="button" class="region-toggle icon-button" data-icon="caret-left" aria-label="Hide the browse panel" aria-expanded="true"></button>
        </div>
        <div class="sidebar-actions" role="toolbar" aria-label="Library tools">
          <button id="add-folder" type="button" class="icon-button" data-icon="folder-plus" data-icon-size="20" aria-label="Add folder"><span class="label">Add folder</span></button>
          <button id="add-sample-media" type="button" class="icon-button" data-icon="sparkle" data-icon-size="20" aria-label="Add sample media" data-tip="Add sample media… (make original CC0 sounds, music, stills and clips in a folder and add it)"><span class="label">Add sample media…</span></button>
          <button id="rescan" type="button" class="icon-button" data-icon="arrow-clockwise" data-icon-size="20" aria-label="Rescan"><span class="label">Rescan</span></button>
          <button id="import-pack" type="button" class="icon-button" data-icon="download-simple" data-icon-size="20" aria-label="Import pack" data-tip="Import pack… (install templates from a .zip or folder)"><span class="label">Import pack…</span></button>
          <button id="export-pack" type="button" class="icon-button" disabled data-icon="upload-simple" data-icon-size="20" aria-label="Export pack" data-tip="Export… (the listed templates as a pack)"><span class="label">Export…</span></button>
        </div>
      </div>
      <div class="browse-body">
        <div id="browse-tree" class="browse-tree" role="tree" aria-label="Browse"></div>
      </div>
      <button id="browse-expand" type="button" class="region-expand icon-button" data-icon="caret-right" aria-label="Show the browse panel" hidden></button>
    </aside>
    <div id="split-browse" class="splitter v" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize the browse panel"></div>

    <main class="center">
      <div id="region-search" class="search-bar">
        <div class="search-row">
          <span id="scope-chip" class="scope-chip" hidden>
            <span id="scope-chip-icon" class="icon-slot" aria-hidden="true"></span>
            <span id="scope-chip-label"></span>
            <button id="scope-chip-clear" type="button" class="icon-button" data-icon="x" aria-label="Clear the search scope" data-tip="Search the whole library again"></button>
          </span>
          <span class="search-field">
            <span class="search-icon" data-icon="magnifying-glass" aria-hidden="true"></span>
            <input id="search" type="search" list="search-history" placeholder="Search the library" aria-label="Search the library" autocomplete="off" spellcheck="false" data-tip="Free text, or a filter: tag: type: theme: style: category: pack: duration: width: height: fps: res: codec: alpha: favorite: recent: — for example type:wipe theme:news duration:>5">
            <datalist id="search-history"></datalist>
          </span>
          <span class="sort-wrap">
            <span data-icon="sort-ascending" aria-hidden="true"></span>
            <select id="sort" aria-label="Sort results">
              <option value="relevance">Relevance</option>
              <option value="name">Name</option>
              <option value="recent">Recently used</option>
              <option value="duration">Duration</option>
            </select>
          </span>
          <span class="view-controls" role="group" aria-label="Result view">
            <button id="view-grid" type="button" class="icon-button" data-icon="squares-four" data-icon-size="20" aria-pressed="false" aria-label="Grid of cards"></button>
            <button id="view-list" type="button" class="icon-button" data-icon="rows" data-icon-size="20" aria-pressed="false" aria-label="List of rows"></button>
            <input id="thumb-size" type="range" min="0" max="3" step="1" value="1" aria-label="Thumbnail size" data-tip="Thumbnail size">
          </span>
          <button id="stage-toggle" type="button" class="region-toggle icon-button" data-icon="caret-up" aria-label="Hide the preview" aria-expanded="true"></button>
        </div>
        <div class="filter-chips" role="group" aria-label="Filters">
          <button id="chip-templates" class="chip" type="button" data-chip="templates" data-icon="shapes" aria-pressed="false"><span class="label">Templates</span></button>
          <button id="chip-video" class="chip" type="button" data-chip="video" data-icon="film-strip" aria-pressed="false"><span class="label">Video</span></button>
          <button id="chip-image" class="chip" type="button" data-chip="image" data-icon="image" aria-pressed="false"><span class="label">Images</span></button>
          <button id="chip-audio" class="chip" type="button" data-chip="audio" data-icon="music-notes" aria-pressed="false"><span class="label">Audio</span></button>
          <button id="chip-alpha" class="chip" type="button" data-chip="alpha" data-icon="checkerboard" aria-pressed="false"><span class="label">Alpha</span></button>
          <button id="chip-favorites" class="chip" type="button" data-chip="favorites" data-icon="star" aria-pressed="false"><span class="label">Favorites</span></button>
        </div>
      </div>
      <section id="region-stage" class="stage" aria-label="Stage">
        <div class="preview-wrap">
          <div id="preview-frame" class="preview checker">
            <iframe id="preview" title="Template preview" sandbox="allow-scripts allow-same-origin"></iframe>
            <video id="media-video" class="media" controls preload="metadata" hidden></video>
            <img id="media-image" class="media" alt="" hidden>
            <audio id="media-audio" class="media" controls preload="metadata" hidden></audio>
            <svg id="media-waveform" class="media waveform" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true" hidden><path></path></svg>
            <div id="safe-overlay" class="safe-overlay" aria-hidden="true" hidden>
              <div id="safe-action" class="safe action"></div>
              <div id="safe-title" class="safe title"></div>
            </div>
            <div id="preview-empty" class="preview-empty">Select a template</div>
          </div>
        </div>
        <div class="transport">
          <button id="step-back" type="button" class="icon-button" data-icon="caret-left" data-icon-size="20" aria-label="Previous frame" data-tip="Previous frame" disabled></button>
          <button id="play" type="button" class="icon-button transport-button" data-icon="play" data-icon-size="24" aria-label="Play" disabled></button>
          <button id="step-forward" type="button" class="icon-button" data-icon="caret-right" data-icon-size="20" aria-label="Next frame" data-tip="Next frame" disabled></button>
          <button id="loop" type="button" class="icon-button" data-icon="repeat" data-icon-size="20" aria-pressed="true" aria-label="Loop playback"></button>
          <span class="scrub-wrap">
            <input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Frame">
            <span id="scrub-marks" class="scrub-marks" aria-hidden="true">
              <span id="trim-before" class="trimmed"></span>
              <span id="trim-after" class="trimmed"></span>
              <span id="mark-in-flag" class="mark in" hidden></span>
              <span id="mark-out-flag" class="mark out" hidden></span>
            </span>
          </span>
          <span id="timecode" class="timecode">--</span>
        </div>
        <div class="stage-tools" role="toolbar" aria-label="Preview tools">
          <span class="tool-group">
            <button id="mark-in" type="button" disabled data-tip="Set the in point of the render to this frame"><span class="label">Set in</span></button>
            <button id="mark-out" type="button" disabled data-tip="Set the out point of the render to this frame"><span class="label">Set out</span></button>
            <button id="mark-clear" type="button" disabled data-tip="Render the whole template again"><span class="label">Clear</span></button>
          </span>
          <span class="tool-group volume">
            <button id="mute" type="button" class="icon-button" data-icon="speaker-high" data-icon-size="20" aria-pressed="false" aria-label="Mute"></button>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
          </span>
          <span class="tool-group backgrounds" role="group" aria-label="Preview background">
            <button id="bg-checker" type="button" class="icon-button" data-icon="checkerboard" data-icon-size="20" aria-pressed="true" aria-label="Checkerboard background"></button>
            <button id="bg-black" type="button" class="swatch black" aria-pressed="false" aria-label="Black background"></button>
            <button id="bg-white" type="button" class="swatch white" aria-pressed="false" aria-label="White background"></button>
            <input id="bg-custom" type="color" value="#808080" aria-label="Custom background color" data-tip="Custom background color">
          </span>
          <button id="audition" type="button" class="icon-button" data-icon="play-circle" data-icon-size="20" aria-pressed="false" aria-label="Audition mode" data-tip="Audition: choosing a sound plays it, and the arrow keys move through the results"></button>
          <button id="safe-toggle" type="button" class="icon-button" data-icon="frame-corners" data-icon-size="20" aria-pressed="false" aria-label="Title-safe and action-safe areas"></button>
        </div>
        <div class="item-row">
          <button id="add-to-collection" type="button" disabled data-icon="stack" data-tip="Add this item to the collection in the tray"><span class="label">Add to collection</span></button>
          <div id="item-tools" class="item-tools" hidden></div>
        </div>
        <p id="stage-note" class="note error" hidden></p>
      </section>
      <div id="split-stage" class="splitter h" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize the stage"></div>
      <section id="region-results" class="results-region" aria-label="Results">
        <ul id="results" class="results grid" role="listbox" aria-label="Library"></ul>
      </section>
    </main>

    <div id="split-inspector" class="splitter v" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize the inspector"></div>
    <section id="region-inspector" class="inspector" aria-label="Inspector">
      <div class="tabs" role="tablist" aria-label="Inspector sections">
        <button id="tab-parameters" class="tab" type="button" role="tab" aria-selected="true" aria-controls="pane-parameters" data-icon="sliders-horizontal"><span class="label">Parameters</span></button>
        <button id="tab-output" class="tab" type="button" role="tab" aria-selected="false" aria-controls="pane-output" data-icon="export"><span class="label">Output</span></button>
        <button id="tab-info" class="tab" type="button" role="tab" aria-selected="false" aria-controls="pane-info" data-icon="info"><span class="label">Info</span></button>
      </div>
      <div id="pane-parameters" class="tab-pane" role="tabpanel" aria-labelledby="tab-parameters">
      <div class="params-head">
        <div class="params-actions">
          <button id="undo" type="button" disabled title="Undo (Ctrl+Z or Cmd+Z outside a text field)">Undo</button>
          <button id="redo" type="button" disabled title="Redo (Shift+Ctrl+Z, Ctrl+Y or Shift+Cmd+Z)">Redo</button>
          <button id="reset-all" type="button" disabled title="Reset every parameter to the template's defaults">Reset all</button>
        </div>
      </div>
      <div class="param-presets">
        <select id="param-preset-list" aria-label="Saved presets"><option value="">Saved presets…</option></select>
        <input id="param-preset-name" type="text" placeholder="Preset name" aria-label="Preset name" autocomplete="off" spellcheck="false">
        <button id="param-preset-save" type="button" disabled title="Save the current values that differ from the defaults under this name">Save</button>
        <button id="param-preset-delete" type="button" disabled title="Delete the selected preset">Delete</button>
      </div>
      <div id="param-preset-confirm" class="note confirm" hidden>
        <span id="param-preset-confirm-text"></span>
        <button id="param-preset-replace" type="button">Replace</button>
        <button id="param-preset-cancel" type="button">Cancel</button>
      </div>
      <form id="params" class="params"></form>
      </div>
      <div id="pane-output" class="tab-pane" role="tabpanel" aria-labelledby="tab-output" hidden>
      <h2>Render</h2>
      <p id="editing-note" class="note editing" hidden><span id="editing-note-text"></span><button id="editing-done" type="button">Done</button></p>
      <label class="field">
        <span>Output preset</span>
        <select id="preset"></select>
      </label>
      <p id="preset-note" class="note"></p>
      <p id="preset-unavailable" class="note" hidden></p>
      <div class="render-options">
        <label class="field" id="opt-aspect-field" hidden>
          <span>Aspect</span>
          <select id="opt-aspect"></select>
        </label>
        <label class="field">
          <span>Resolution</span>
          <select id="opt-resolution"></select>
        </label>
        <div class="size-custom" id="opt-size-custom" hidden>
          <label class="field">
            <span>Width</span>
            <input id="opt-width" type="number" inputmode="numeric" min="16" max="8192" step="2" placeholder="1920">
          </label>
          <label class="field">
            <span>Height</span>
            <input id="opt-height" type="number" inputmode="numeric" min="16" max="8192" step="2" placeholder="1080">
          </label>
        </div>
        <label class="field">
          <span>Frame rate</span>
          <select id="opt-fps"></select>
        </label>
        <label class="field" id="opt-background-field" hidden>
          <span>Background for flattening</span>
          <input id="opt-background" type="color" value="#000000">
        </label>
        <div class="trim">
          <label class="field">
            <span>In point</span>
            <input id="opt-in" type="text" inputmode="numeric" spellcheck="false" placeholder="00:00:00:00" title="Timecode HH:MM:SS:FF, a frame number, or seconds such as 2.5s">
          </label>
          <label class="field">
            <span>Out point (inclusive)</span>
            <input id="opt-out" type="text" inputmode="numeric" spellcheck="false" placeholder="last frame" title="Timecode HH:MM:SS:FF, a frame number, or seconds such as 2.5s">
          </label>
        </div>
        <p id="options-note" class="note"></p>
      </div>
      <div class="render-actions">
        <button id="render" type="button" class="primary" disabled>Render…</button>
        <button id="drag-prepare" type="button" disabled data-tip="Render into the cache and add a card to the tray you can drag into your editor">Prepare for drag</button>
      </div>
      <p id="drag-status" class="note" role="status"></p>
      <details id="batch" class="batch">
        <summary>Batch from CSV</summary>
        <p class="note">One render per row. Column headers match a parameter id or label (any case); a <code>file</code> (or <code>name</code>, when that is not a parameter) column names the jobs and files.</p>
        <textarea id="batch-csv" rows="5" placeholder="file,Name,Title&#10;Alex,Alex Rivera,Director of Photography&#10;Sam,Sam Lee,Editor" spellcheck="false" aria-label="CSV"></textarea>
        <div class="render-actions">
          <button id="batch-file" type="button">Choose CSV file…</button>
          <input id="batch-file-input" type="file" accept=".csv,text/csv" hidden>
          <button id="batch-preview" type="button" disabled>Preview</button>
          <button id="batch-queue" type="button" class="primary" disabled>Queue</button>
        </div>
        <div id="batch-summary" class="note"></div>
      </details>
      <p id="render-status" class="note" role="status"></p>
      </div>
      <div id="pane-info" class="tab-pane info-pane" role="tabpanel" aria-labelledby="tab-info" hidden>
        <div id="info-item" hidden></div>
      </div>
    </section>

    <div id="region-tray" class="tray" aria-label="Render tray">
      <div id="split-tray" class="splitter h" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize the tray"></div>
      <div class="tray-head">
        <button id="tray-toggle" type="button" class="region-toggle" data-icon="caret-up" aria-label="Show or hide the collection" aria-expanded="false"><span class="label">Collection</span></button>
        <span id="tray-summary" class="tray-summary" aria-live="polite">Nothing collected yet.</span>
        <progress id="tray-progress" class="tray-progress" max="1" value="0" aria-label="Total render progress" hidden></progress>
        <button id="collection-render" type="button" class="primary" disabled data-tip="Render every item into one folder">Render all</button>
        <button id="collection-apply" type="button" disabled data-tip="Give every item the output settings of the one being edited">Apply to all</button>
        <button id="collection-open" type="button" data-icon="download-simple" aria-label="Open collection" data-tip="Open a saved collection"></button>
        <button id="collection-save" type="button" disabled data-icon="upload-simple" aria-label="Save collection" data-tip="Save this collection as a file"></button>
        <button id="clear-finished" type="button" disabled data-icon="trash" aria-label="Clear finished"><span class="label">Clear finished</span></button>
      </div>
      <div class="tray-body">
        <div id="drag-notice" class="note notice" role="status" hidden>
          <span id="drag-notice-text"></span>
          <button id="drag-notice-dismiss" type="button">Got it</button>
        </div>
        <p id="collection-note" class="note" role="status"></p>
        <div class="tray-lists">
          <ul id="collection" class="queue collection" aria-label="Collection"></ul>
          <ul id="queue" class="queue" aria-label="Renders" aria-live="polite" data-tip="A finished render: drag it into your editor, or press Enter to show it in the file manager and Cmd+C or Ctrl+C to copy its path"></ul>
        </div>
        <div class="tray-foot">
          <span id="link-info" class="icon-slot" tabindex="0" role="img" data-icon="info" data-icon-size="16" aria-label="How editors use a dragged file" data-tip="An editor links to the file rather than copying it. Keep a render while a project uses it: clearing the cache, or the cache dropping its oldest files, takes those clips offline in the editor."></span>
          <details class="cache">
            <summary>Render cache</summary>
            <p id="cache-summary" class="note"></p>
            <div class="render-actions">
              <button id="cache-clear" type="button">Clear cache</button>
              <button id="cache-dir" type="button">Change folder…</button>
              <label class="field inline"><span>Limit (MB)</span><input id="cache-limit" type="number" min="64" step="64"></label>
            </div>
          </details>
        </div>
      </div>
    </div>

    <footer id="region-status" class="status-bar" aria-label="Status">
      <p id="ffmpeg-status" class="note status-item"><span class="label"></span></p>
      <div id="library-summary" class="summary"></div>
      <span class="status-spacer"></span>
      <span id="status-scan" class="note status-item" role="status"><span class="label"></span></span>
      <span id="status-renders" class="note status-item" role="status"><span class="label"></span></span>
      <span id="status-cache" class="note status-item" data-icon="hard-drive"><span class="label"></span></span>
    </footer>
  </div>
  <dialog id="pack-dialog" class="pack-dialog">
    <form method="dialog">
      <h2 id="pack-title">Template pack</h2>
      <p id="pack-meta" class="note"></p>
      <p id="pack-license" class="note" hidden></p>
      <ul id="pack-templates" class="pack-templates"></ul>
      <div id="pack-problems" class="note error"></div>
      <div id="pack-export-fields" class="pack-export" hidden>
        <label class="field"><span>Pack name</span><input id="pack-export-name" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Author</span><input id="pack-export-author" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="field" title="An SPDX license identifier, e.g. CC0-1.0 or MIT"><span>License</span><input id="pack-export-license" type="text" value="CC0-1.0" autocomplete="off" spellcheck="false"></label>
      </div>
      <div id="pack-result" class="note"></div>
      <div class="render-actions">
        <button id="pack-confirm" type="button" class="primary">Install</button>
        <button id="pack-close" type="button">Close</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
