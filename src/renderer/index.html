<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pulp-template: pulp-media: pulp-thumb: pulp-strip:; media-src 'self' pulp-media: pulp-template:; font-src 'self' pulp-font:; frame-src pulp-template:; connect-src 'self' ws:">
  <title>Pulp</title>
  <!-- Before the stylesheet (milestone 62): the page opens on the chosen palette's background, so
       no frame shows the other one while styles.css loads. The values are the --bg tokens, held
       to them and to the main process's window background by tests/appearance.test.ts. -->
  <meta name="color-scheme" content="dark light">
  <style>html { background: #16181d; color-scheme: dark; } @media (prefers-color-scheme: light) { html { background: #f3f4f6; color-scheme: light; } }</style>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="region-browse" class="sidebar" data-i18n-attr="aria-label:ui.region-browse.aria-label">
      <div class="sidebar-head">
        <div class="region-head">
          <span class="region-title" data-i18n="ui.region-browse.library"></span>
          <button id="browse-toggle" type="button" class="region-toggle icon-button" data-icon="caret-left" aria-expanded="true" data-i18n-attr="aria-label:ui.browse-toggle.aria-label"></button>
        </div>
        <div class="sidebar-actions" role="toolbar" data-i18n-attr="aria-label:ui.region-browse.library-tools.aria-label">
          <button id="library-add" type="button" class="icon-button" data-icon="plus" data-icon-size="20" aria-haspopup="menu" data-i18n-attr="aria-label:ui.library-add.aria-label;data-tip:ui.library-add.data-tip"><span class="label" data-i18n="ui.library-add.add"></span></button>
          <button id="rescan" type="button" class="icon-button" data-icon="arrow-clockwise" data-icon-size="20" data-i18n-attr="aria-label:ui.rescan.aria-label"><span class="label" data-i18n="ui.rescan.rescan"></span></button>
          <span class="record-group">
            <button id="record-audio" type="button" class="icon-button" data-icon="microphone" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.record-audio.aria-label;data-tip:ui.record-audio.data-tip"><span class="label" data-i18n="ui.record-audio.record"></span></button>
            <button id="record-input" type="button" class="icon-button record-input" data-icon="caret-down" data-icon-size="12" aria-haspopup="menu" data-i18n-attr="aria-label:ui.record-input.aria-label;data-tip:ui.record-input.data-tip"></button>
          </span>
          <button id="record-video" type="button" class="icon-button" data-icon="video-camera" data-icon-size="20" aria-haspopup="dialog" data-i18n-attr="aria-label:ui.record-video.aria-label;data-tip:ui.record-video.data-tip"><span class="label" data-i18n="ui.record-video.camera"></span></button>
        </div>
      </div>
      <section id="region-search" class="panel-section search-section" data-i18n-attr="aria-label:ui.region-search.aria-label">
        <div class="section-head">
          <span class="section-title" data-i18n="ui.region-search.search"></span>
        </div>
        <span class="search-field">
          <span class="search-icon" data-icon="magnifying-glass" aria-hidden="true"></span>
          <input id="search" type="search" list="search-history" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:ui.search.aria-label;data-tip:ui.search.data-tip;placeholder:ui.search.placeholder">
          <datalist id="search-history"></datalist>
        </span>
        <span id="scope-chip" class="scope-chip" role="status" hidden>
          <span id="scope-chip-icon" class="icon-slot" aria-hidden="true"></span>
          <span id="scope-chip-label"></span>
          <button id="scope-chip-clear" type="button" class="icon-button" data-icon="x" data-i18n-attr="aria-label:ui.scope-chip-clear.aria-label;data-tip:ui.scope-chip-clear.data-tip"></button>
        </span>
        <div id="filter-chips" class="filter-chips" role="toolbar" data-i18n-attr="aria-label:ui.filter-chips.aria-label">
          <button id="chip-templates" class="chip" type="button" data-chip="templates" data-icon="shapes" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-templates.aria-label;data-tip:ui.chip-templates.data-tip"><span class="label" data-i18n="ui.chip-templates.templates"></span></button>
          <button id="chip-video" class="chip" type="button" data-chip="video" data-icon="film-strip" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-video.aria-label;data-tip:ui.chip-video.data-tip"><span class="label" data-i18n="ui.chip-video.video"></span></button>
          <button id="chip-image" class="chip" type="button" data-chip="image" data-icon="image" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-image.aria-label;data-tip:ui.chip-image.data-tip"><span class="label" data-i18n="ui.chip-image.images"></span></button>
          <button id="chip-audio" class="chip" type="button" data-chip="audio" data-icon="music-notes" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-audio.aria-label;data-tip:ui.chip-audio.data-tip"><span class="label" data-i18n="ui.chip-audio.audio"></span></button>
          <button id="chip-vertical" class="chip" type="button" data-chip="vertical" data-icon="device-mobile" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-vertical.aria-label;data-tip:ui.chip-vertical.data-tip"><span class="label" data-i18n="ui.chip-vertical.vertical"></span></button>
          <button id="chip-alpha" class="chip" type="button" data-chip="alpha" data-icon="checkerboard" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-alpha.aria-label;data-tip:ui.chip-alpha.data-tip"><span class="label" data-i18n="ui.chip-alpha.alpha"></span></button>
          <button id="chip-favorites" class="chip" type="button" data-chip="favorites" data-icon="star" aria-pressed="false" data-i18n-attr="aria-label:ui.chip-favorites.aria-label;data-tip:ui.chip-favorites.data-tip"><span class="label" data-i18n="ui.chip-favorites.favorites"></span></button>
        </div>
        <div class="narrow-chips" role="group" data-i18n-attr="aria-label:ui.region-search.narrow-by-theme-look-and.aria-label">
          <span class="chip-select" data-icon="tag" data-i18n-attr="data-tip:ui.region-search.narrow-the-results-to-what.data-tip">
            <select id="for-select" class="chip" data-i18n-attr="aria-label:ui.for-select.aria-label"><option value="" data-i18n="ui.for-select.for"></option></select>
          </span>
          <span class="chip-select" data-icon="palette" data-i18n-attr="data-tip:ui.region-search.narrow-the-results-by-look.data-tip">
            <select id="look-select" class="chip" data-i18n-attr="aria-label:ui.look-select.aria-label"><option value="" data-i18n="ui.look-select.look"></option></select>
          </span>
          <span class="chip-select" data-icon="speaker-high" data-i18n-attr="data-tip:ui.region-search.narrow-sounds-and-music-by.data-tip">
            <select id="mood-select" class="chip" data-i18n-attr="aria-label:ui.mood-select.aria-label"><option value="" data-i18n="ui.mood-select.mood"></option></select>
          </span>
        </div>
      </section>
      <section class="panel-section browse-section" data-i18n-attr="aria-label:ui.region-browse.browse.aria-label">
        <div class="section-head">
          <span class="section-title" data-i18n="ui.region-browse.browse"></span>
          <button id="browse-filter-toggle" type="button" class="icon-button" data-icon="funnel-simple" aria-expanded="false" aria-pressed="false" data-i18n-attr="aria-label:ui.browse-filter-toggle.aria-label;data-tip:ui.browse-filter-toggle.data-tip"></button>
        </div>
        <div id="browse-find" class="browse-find" hidden></div>
        <div id="browse-tree" class="browse-tree" role="tree" data-i18n-attr="aria-label:ui.browse-tree.aria-label"></div>
      </section>
      <button id="browse-expand" type="button" class="region-expand icon-button" data-icon="caret-right" hidden data-i18n-attr="aria-label:ui.browse-expand.aria-label"></button>
      <button id="rail-search" type="button" class="region-expand rail-search icon-button" data-icon="magnifying-glass" data-icon-size="20" hidden data-i18n-attr="aria-label:ui.rail-search.aria-label;data-tip:ui.rail-search.data-tip"></button>
    </aside>
    <div id="split-browse" class="splitter v" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-attr="aria-label:ui.split-browse.aria-label"></div>

    <main class="center">
      <section id="region-stage" class="stage" data-i18n-attr="aria-label:ui.region-stage.aria-label">
        <div class="preview-wrap">
          <p class="preview-no-room" role="status" data-i18n="ui.region-stage.no-room-for-the-preview"></p>
          <!-- The picture and what is drawn over it are in the frame's own coordinates, never mirrored (milestone 70). -->
          <div id="preview-frame" class="preview checker" dir="ltr">
            <canvas id="track-picture" class="media track-picture" aria-hidden="true" hidden></canvas>
            <iframe id="preview" sandbox="allow-scripts allow-same-origin" data-i18n-attr="title:ui.preview.title"></iframe>
            <iframe id="captions-preview" class="captions-preview" sandbox="allow-scripts allow-same-origin" aria-hidden="true" hidden data-i18n-attr="title:ui.captions-preview.title"></iframe>
            <video id="media-video" class="media" preload="metadata" hidden></video>
            <img id="media-image" class="media" alt="" hidden>
            <audio id="media-audio" class="media" preload="metadata" hidden></audio>
            <svg id="media-waveform" class="media waveform" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true" hidden><path></path></svg>
            <div id="layer-overlay" class="layer-overlay" tabindex="0" role="application" data-i18n-attr="aria-label:ui.layer-overlay.aria-label"></div>
            <div id="safe-overlay" class="safe-overlay" aria-hidden="true" hidden>
              <div id="safe-action" class="safe action"></div>
              <div id="safe-title" class="safe title"></div>
              <div id="safe-zones" class="zones" hidden>
                <div class="zone" data-zone="header"></div>
                <div class="zone" data-zone="controls"></div>
                <div class="zone" data-zone="caption"></div>
              </div>
            </div>
            <div id="preview-empty" class="preview-empty" data-i18n="ui.preview-empty"></div>
          </div>
        </div>
        <div class="stage-view" role="toolbar" data-i18n-attr="aria-label:ui.region-stage.preview-tools.aria-label">
          <span class="bg-choice">
            <button id="bg-button" type="button" class="icon-button" aria-haspopup="true" aria-expanded="false" aria-controls="bg-picker" data-i18n-attr="aria-label:ui.bg-button.aria-label;data-tip:ui.bg-button.data-tip"><span class="bg-current checker" aria-hidden="true"></span></button>
            <span id="bg-picker" class="bg-picker" role="group" hidden data-i18n-attr="aria-label:ui.bg-picker.aria-label">
              <button id="bg-checker" type="button" class="swatch checker" aria-pressed="true" data-i18n-attr="aria-label:ui.bg-checker.aria-label;data-tip:ui.bg-checker.data-tip"></button>
              <button id="bg-black" type="button" class="swatch black" aria-pressed="false" data-i18n-attr="aria-label:ui.bg-black.aria-label;data-tip:ui.bg-black.data-tip"></button>
              <button id="bg-white" type="button" class="swatch white" aria-pressed="false" data-i18n-attr="aria-label:ui.bg-white.aria-label;data-tip:ui.bg-white.data-tip"></button>
              <button id="bg-gray" type="button" class="swatch gray" aria-pressed="false" data-i18n-attr="aria-label:ui.bg-gray.aria-label;data-tip:ui.bg-gray.data-tip"></button>
              <input id="bg-custom" type="color" value="#808080" data-i18n-attr="aria-label:ui.bg-custom.aria-label;data-tip:ui.bg-custom.data-tip">
            </span>
          </span>
          <button id="safe-toggle" type="button" class="icon-button" data-icon="frame-corners" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.safe-toggle.aria-label"></button>
          <button id="stage-popout" type="button" class="icon-button" data-icon="arrow-square-out" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.stage-popout.aria-label;data-tip:ui.stage-popout.data-tip"></button>
          <button id="theater" type="button" class="icon-button" data-icon="corners-out" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.theater.aria-label;data-tip:ui.theater.data-tip"></button>
        </div>
        <p id="stage-note" class="note error" hidden></p>
      </section>
      <div id="split-stage" class="splitter h" role="separator" tabindex="0" aria-orientation="horizontal" data-i18n-attr="aria-label:ui.split-stage.aria-label"></div>
      <section id="region-results" class="results-region" data-i18n-attr="aria-label:ui.region-results.aria-label">
        <div class="results-head">
          <span id="results-label" class="region-count" data-i18n="ui.results-label"></span>
          <span id="results-description" class="results-description"></span>
          <span id="results-empty" class="results-empty-note" role="status" hidden></span>
          <span class="results-tools">
            <button id="export-pack" type="button" class="icon-button" disabled data-icon="upload-simple" data-icon-size="20" data-i18n-attr="aria-label:ui.export-pack.aria-label;data-tip:ui.export-pack.data-tip"></button>
            <span class="sort-wrap">
              <span data-icon="sort-ascending" aria-hidden="true"></span>
              <select id="sort" data-i18n-attr="aria-label:ui.sort.aria-label">
                <option value="relevance" data-i18n="ui.sort.relevance"></option>
                <option value="name" data-i18n="ui.sort.name"></option>
                <option value="recent" data-i18n="ui.sort.recently-used"></option>
                <option value="duration" data-i18n="ui.sort.duration"></option>
              </select>
            </span>
            <span class="view-controls" role="group" data-i18n-attr="aria-label:ui.region-results.result-view.aria-label">
              <button id="view-grid" type="button" class="icon-button" data-icon="squares-four" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.view-grid.aria-label"></button>
              <button id="view-list" type="button" class="icon-button" data-icon="rows" data-icon-size="20" aria-pressed="false" data-i18n-attr="aria-label:ui.view-list.aria-label"></button>
              <input id="thumb-size" type="range" min="0" max="3" step="1" value="1" data-i18n-attr="aria-label:ui.thumb-size.aria-label;data-tip:ui.thumb-size.data-tip">
            </span>
            <button id="stage-toggle" type="button" class="region-toggle icon-button" data-icon="caret-up" aria-expanded="true" data-i18n-attr="aria-label:ui.stage-toggle.aria-label"></button>
            <button id="results-toggle" type="button" class="region-toggle icon-button" data-icon="caret-down" aria-expanded="true" data-i18n-attr="aria-label:ui.results-toggle.aria-label"></button>
          </span>
        </div>
        <div id="category-cards" class="category-cards" hidden></div>
        <ul id="results" class="results grid" role="listbox" data-i18n-attr="aria-label:ui.results.aria-label"></ul>
        <div id="results-hint" class="results-hint" role="status" hidden>
          <span id="results-hint-text" class="hint-text"></span>
          <button id="results-hint-make" type="button" class="hint-make" data-i18n="ui.results-hint-make"></button>
        </div>
      <section id="region-inspector" class="inspector" data-i18n-attr="aria-label:ui.region-inspector.aria-label">
        <div id="split-inspector" class="splitter h" role="separator" tabindex="0" aria-orientation="horizontal" data-i18n-attr="aria-label:ui.split-inspector.aria-label"></div>
        <div class="inspector-head">
          <div id="item-tools" class="item-tools" hidden></div>
          <span class="inspector-head-spacer"></span>
          <button id="inspector-pin" type="button" class="icon-button" data-icon="push-pin" data-icon-size="16" aria-pressed="false" data-i18n-attr="aria-label:ui.inspector-pin.aria-label;data-tip:ui.inspector-pin.data-tip"></button>
          <button id="inspector-close" type="button" class="icon-button" data-icon="x" data-icon-size="16" data-i18n-attr="aria-label:ui.inspector-close.aria-label;data-tip:ui.inspector-close.data-tip"></button>
        </div>
      <div id="pane-parameters" class="tab-pane" role="tabpanel" aria-labelledby="tab-parameters">
      <div class="params-head">
        <div class="params-actions">
          <button id="undo" type="button" disabled data-i18n="ui.undo" data-i18n-attr="title:ui.undo.title"></button>
          <button id="redo" type="button" disabled data-i18n="ui.redo" data-i18n-attr="title:ui.redo.title"></button>
          <button id="reset-all" type="button" disabled data-i18n="ui.reset-all" data-i18n-attr="title:ui.reset-all.title"></button>
        </div>
      </div>
      <div class="param-presets">
        <select id="param-preset-list" data-i18n-attr="aria-label:ui.param-preset-list.aria-label"><option value="" data-i18n="ui.param-preset-list.saved-presets"></option></select>
        <input id="param-preset-name" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:ui.param-preset-name.aria-label;placeholder:ui.param-preset-name.placeholder">
        <button id="param-preset-save" type="button" disabled data-i18n="ui.param-preset-save" data-i18n-attr="title:ui.param-preset-save.title"></button>
        <button id="param-preset-delete" type="button" disabled data-i18n="ui.param-preset-delete" data-i18n-attr="title:ui.param-preset-delete.title"></button>
      </div>
      <div id="param-preset-confirm" class="note confirm" hidden>
        <span id="param-preset-confirm-text"></span>
        <button id="param-preset-replace" type="button" data-i18n="ui.param-preset-replace"></button>
        <button id="param-preset-cancel" type="button" data-i18n="ui.param-preset-cancel"></button>
      </div>
      <form id="params" class="params"></form>
      </div>
      <div id="pane-output" class="tab-pane" role="tabpanel" aria-labelledby="tab-output" hidden>
      <h2 data-i18n="ui.pane-output.render"></h2>
      <p id="editing-note" class="note editing" hidden><span id="editing-note-text"></span><button id="editing-done" type="button" data-i18n="ui.editing-done"></button></p>
      <label class="field" id="opt-platform-field" data-i18n-attr="data-tip:ui.opt-platform-field.data-tip">
        <span data-i18n="ui.opt-platform-field.platform"></span>
        <select id="opt-platform"></select>
      </label>
      <p id="platform-note" class="note"></p>
      <div class="field inline guided-field" id="guided-field" hidden>
        <button id="guided-open" type="button" class="ghost" aria-haspopup="dialog" data-i18n="ui.guided-open" data-i18n-attr="data-tip:ui.guided-open.data-tip"></button>
      </div>
      <div class="field asset-presets" id="asset-presets" hidden>
        <span data-i18n="ui.asset-presets.quick-setup"></span>
        <div class="asset-preset-buttons" id="asset-preset-buttons" role="group" data-i18n-attr="aria-label:ui.asset-preset-buttons.aria-label"></div>
      </div>
      <label class="field">
        <span data-i18n="ui.pane-output.output-preset"></span>
        <select id="preset"></select>
      </label>
      <p id="preset-note" class="note"></p>
      <p id="preset-unavailable" class="note" hidden></p>
      <p id="ffmpeg-needs-note" class="note warn" role="status" hidden></p>
      <div class="type-default" id="type-default-row" hidden>
        <button id="type-default-save" type="button" class="ghost" data-i18n="ui.type-default-save" data-i18n-attr="data-tip:ui.type-default-save.data-tip"></button>
        <button id="type-default-clear" type="button" class="ghost" hidden data-i18n="ui.type-default-clear"></button>
        <p id="type-default-note" class="note" hidden></p>
      </div>
      <div class="render-options">
        <label class="field" id="opt-aspect-field" hidden>
          <span data-i18n="ui.opt-aspect-field.aspect"></span>
          <select id="opt-aspect"></select>
        </label>
        <label class="field">
          <span data-i18n="ui.pane-output.resolution"></span>
          <select id="opt-resolution"></select>
        </label>
        <div class="size-custom" id="opt-size-custom" hidden>
          <label class="field">
            <span data-i18n="ui.opt-size-custom.width"></span>
            <input id="opt-width" type="number" inputmode="numeric" min="16" max="8192" step="2" placeholder="1920">
          </label>
          <label class="field">
            <span data-i18n="ui.opt-size-custom.height"></span>
            <input id="opt-height" type="number" inputmode="numeric" min="16" max="8192" step="2" placeholder="1080">
          </label>
        </div>
        <label class="field">
          <span data-i18n="ui.pane-output.frame-rate"></span>
          <select id="opt-fps"></select>
        </label>
        <div class="image-options" id="opt-image-field" hidden data-i18n-attr="data-tip:ui.opt-image-field.data-tip">
          <label class="field">
            <span data-i18n="ui.opt-image-fps.label"></span>
            <select id="opt-image-fps"></select>
          </label>
          <label class="field">
            <span data-i18n="ui.opt-image-width.label"></span>
            <select id="opt-image-width"></select>
          </label>
        </div>
        <label class="field" id="opt-background-field" hidden>
          <span data-i18n="ui.opt-background-field.background-for-flattening"></span>
          <input id="opt-background" type="color" value="#000000">
        </label>
        <div class="field" id="opt-lut-field" data-i18n-attr="data-tip:ui.opt-lut-field.data-tip">
          <span data-i18n="ui.opt-lut-field.lut"></span>
          <span class="lut-row">
            <button id="opt-lut" type="button" class="ghost" data-i18n="ui.opt-lut"></button>
            <span id="opt-lut-name" class="lut-name"></span>
            <button id="opt-lut-clear" type="button" class="icon-button" data-icon="x" hidden data-i18n-attr="aria-label:ui.opt-lut-clear.aria-label"></button>
          </span>
        </div>
        <div id="media-options" class="media-options" hidden>
          <label class="field" id="opt-length-field">
            <span data-i18n="ui.opt-length-field.length"></span>
            <input id="opt-length" type="number" inputmode="decimal" min="0.04" step="0.5" data-i18n-attr="data-tip:ui.opt-length.data-tip;placeholder:ui.opt-length.placeholder">
          </label>
          <label class="field" id="opt-speed-field">
            <span data-i18n="ui.opt-speed-field.speed"></span>
            <input id="opt-speed" type="number" inputmode="decimal" min="0.1" max="10" step="0.1" placeholder="1" data-i18n-attr="data-tip:ui.opt-speed.data-tip">
          </label>
          <label class="field" id="opt-crossfade-field">
            <span data-i18n="ui.opt-crossfade-field.loop-crossfade"></span>
            <input id="opt-crossfade" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.5" data-i18n-attr="data-tip:ui.opt-crossfade.data-tip">
          </label>
          <label class="field" id="opt-tint-field">
