<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Handle Card</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Handle Card, a sample template for Pulp. CC0-1.0: no rights reserved.
  // The handle types on at a fixed rate -- frame-exact, no randomness -- and the pill
  // grows to fit what has been typed so far.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var inF = 0.4, outF = 0.5;
    // The hold is the design's own, no longer a setting: the length is the control (milestone 30).
    var hold = Math.min(2.8, Math.max(0.2, d - inF - outF));
    var gone = easeInOut(clamp01((t - inF - hold) / outF));
    var come = easeOut(clamp01(t / inF));
    var show = come * (1 - gone);
    if (show <= 0.001) return;

    var typed = p.handle.slice(0, Math.max(0, Math.floor((t - inF * 0.5) * 18)));
    ctx.font = '600 ' + Math.round(44 * u) + 'px JetBrains Mono';
    var full = ctx.measureText(p.handle).width;
    var done = ctx.measureText(typed).width;

    var padX = 34 * u, dotR = 10 * u, gap = 22 * u;
    var pillH = 84 * u;
    var pillW = padX * 2 + dotR * 2 + gap + done;
    var y = H * 0.82;
    var x = p.side === 'right' ? W - W * 0.07 - pillW : W * 0.07;

    ctx.globalAlpha = show;
    ctx.fillStyle = 'rgba(12, 16, 24, 0.9)';
    ctx.beginPath();
    ctx.roundRect(x, y - pillH / 2, Math.max(pillW, pillH), pillH, pillH / 2);
    ctx.fill();

    // The dot pulses twice a second: enough to say "live", calm enough to sit on footage.
    var pulse = 0.75 + 0.25 * Math.sin(t * Math.PI * 2);
    ctx.fillStyle = p.dot;
    ctx.globalAlpha = show * pulse;
    ctx.beginPath();
    ctx.arc(x + padX + dotR, y, dotR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = show;

    ctx.fillStyle = '#edf4ff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(typed, x + padX + dotR * 2 + gap, y + 2 * u);
    // A block caret while there is still typing to do.
    if (typed.length < p.handle.length && Math.floor(t * 3) % 2 === 0) {
      ctx.fillRect(x + padX + dotR * 2 + gap + done + 4 * u, y - 22 * u, 14 * u, 44 * u);
    }
    void full;
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
