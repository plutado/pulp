<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halftone dots</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    var s = Math.min(W, H) / 1080;

    ctx.fillStyle = p.background;
    ctx.fillRect(0, 0, W, H);

    var pitch = Math.max(4, p.pitch * s);
    // Drift a whole number of cells over the loop, so the last frame meets the first.
    var drift = state.progress * pitch * Math.round(p.speed);
    var ang = p.angle * Math.PI / 180;
    var diag = Math.hypot(W, H);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(ang);
    ctx.fillStyle = p.dot;
    ctx.beginPath();
    // Walk a square grid big enough to cover the rotated frame; the lattice is offset by the drift
    // along its own rows so each cell is still an integer multiple of the pitch.
    var half = diag / 2 + pitch * 2;
    var start = -Math.ceil(half / pitch) * pitch;
    var maxR = pitch * 0.48;
    for (var gy = start; gy <= half; gy += pitch) {
      for (var gx = start; gx <= half; gx += pitch) {
        var x = gx + (drift % pitch), y = gy;
        // Dot size follows a diagonal gradient across the frame: small top-left, large bottom-right.
        var ux = x * Math.cos(ang) - y * Math.sin(ang);
        var uy = x * Math.sin(ang) + y * Math.cos(ang);
        var t = ((ux + W / 2) / W + (uy + H / 2) / H) / 2;
        t = Math.max(0, Math.min(1, t));
        var r = maxR * (0.12 + 0.88 * t * t);
        if (r < 0.4) continue;
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, TAU);
      }
    }
    ctx.fill();
    ctx.restore();

    // A faint paper tone over everything, warm at the edges.
    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(60,20,0,0.25)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
