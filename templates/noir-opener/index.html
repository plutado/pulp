<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Noir Blinds</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Noir Blinds, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The blinds settle by 1.2 s (the slow smoke drift stays within the lit room) and the title holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    ctx.fillStyle = rgba(p.smoke, 1); ctx.fillRect(0, 0, W, H);
    var slide = easeInOut(clamp01(t / 1.2));
    ctx.globalAlpha = 1 - gone;
    // The light through the blinds: angled bands that slide into place and stop.
    ctx.save();
    ctx.translate(W * (1 - slide) * 0.35, 0);
    ctx.rotate(-0.1);
    var band = H * 0.085;
    for (var y = -H * 0.4; y < H * 1.4; y += band * 1.8) {
      var g = ctx.createLinearGradient(0, y, 0, y + band);
      g.addColorStop(0, rgba(p.lightC, 0.02));
      g.addColorStop(0.5, rgba(p.lightC, 0.3));
      g.addColorStop(1, rgba(p.lightC, 0.02));
      ctx.fillStyle = g;
      ctx.fillRect(-W * 0.3, y, W * 1.8, band);
    }
    ctx.restore();
    // Smoke: three slow soft shapes, settled in the room.
    for (var s2 = 0; s2 < 3; s2++) {
      var settled = Math.min(t, 1.5);
      var sx2 = W * (0.2 + s2 * 0.3) + Math.sin(settled * 0.3 + s2 * 2) * W * 0.01;
      var g2 = ctx.createRadialGradient(sx2, H * (0.3 + s2 * 0.2), 0, sx2, H * (0.3 + s2 * 0.2), H * 0.3);
      g2.addColorStop(0, 'rgba(180,170,150,0.05)'); g2.addColorStop(1, 'rgba(180,170,150,0)');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    }
    var titleIn = easeOut(clamp01((t - 0.9) / 0.6));
    ctx.globalAlpha = (1 - gone) * titleIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#efe6d2';
    ctx.font = '700 ' + Math.round(104 * u) + 'px Playfair';
    ctx.fillText(p.title, W / 2, H * 0.5);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
