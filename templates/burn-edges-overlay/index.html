<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Burning Edges</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Burning Edges, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The burn breathes in and out one whole cycle per clip, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var ph = (t / d) * Math.PI * 2;
    var reach = 0.5 + 0.5 * Math.sin(ph);
    var corners = [[0, 0], [W, 0], [W, H], [0, H]];
    for (var c = 0; c < 4; c++) {
      var r = Math.min(W, H) * (0.1 + reach * 0.3 + at(c) * 0.08);
      var cx = corners[c][0], cy = corners[c][1];
      // The char: dark at the corner, with an ember lip where it meets the picture.
      var g = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
      g.addColorStop(0, 'rgba(10,4,2,0.95)');
      g.addColorStop(0.7, 'rgba(30,10,4,0.7)');
      g.addColorStop(0.88, rgba(p.ember, 0.55));
      g.addColorStop(1, rgba(p.ember, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      for (var k = 0; k <= 40; k++) {
        var a = (k / 40) * Math.PI * 2;
        var rr2 = r * (1 + (at(k * 3 + c * 50) - 0.5) * 0.18);
        if (k === 0) ctx.moveTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2); else ctx.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,200,140,' + (0.06 * reach).toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
