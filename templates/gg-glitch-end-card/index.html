<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Good Game</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Good Game, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The glitch shivers the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.6)), gone = easeOut(clamp01((t - (d - 0.9)) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    for (var y = 0; y < H; y += 6 * u) {
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      ctx.fillRect(0, y, W, 2 * u);
    }
    ctx.globalAlpha = come * (1 - gone);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    var beat = Math.floor(t * 12);
    var jx = (at(beat) - 0.5) * 14 * u, jy = (at(beat + 40) - 0.5) * 8 * u;
    var strong = at(beat + 80) > 0.72 ? 2.2 : 1;
    ctx.font = '700 ' + Math.round(330 * u) + 'px "Bebas Neue"';
    ctx.fillStyle = rgba(p.split, 0.75);
    ctx.fillText('GG', W / 2 + jx * strong + 8 * u, H * 0.5 + jy);
    ctx.fillStyle = 'rgba(244,63,94,0.75)';
    ctx.fillText('GG', W / 2 - jx * strong - 8 * u, H * 0.5 - jy);
    ctx.fillStyle = '#fafafa';
    ctx.fillText('GG', W / 2 + jx * 0.4, H * 0.5 + jy * 0.4);
    // A sliced band now and then, offset sideways on its own.
    if (at(beat + 7) > 0.6) {
      var sy = H * (0.3 + at(beat + 3) * 0.3), sh = 26 * u;
      var img = ctx.getImageData(0, sy, W, sh);
      ctx.putImageData(img, (at(beat + 11) - 0.5) * 60 * u, sy);
    }
    ctx.fillStyle = 'rgba(165,243,252,0.9)';
    ctx.font = '600 ' + Math.round(36 * u) + 'px "JetBrains Mono"';
    ctx.fillText(p.line, W / 2, H * 0.68);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
