<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Year in Review</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // The Year in Review, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The numerals rise and seat by 1.6 s; the card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    // Each numeral rises out of its own masked band, a beat apart.
    var chars = String(p.year).split('');
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    var size = Math.min(W / (chars.length * 0.62), H * 0.52);
    ctx.font = '700 ' + Math.round(size) + 'px "Bebas Neue"';
    var total = 0, widths = [];
    for (var i = 0; i < chars.length; i++) { var w2 = ctx.measureText(chars[i]).width * 1.08; widths.push(w2); total += w2; }
    var x = W / 2 - total / 2;
    var base = H * 0.52;
    for (var k = 0; k < chars.length; k++) {
      var rise = easeOut(clamp01((t - 0.15 - k * 0.18) / 0.7));
      ctx.save();
      ctx.beginPath(); ctx.rect(x - 6 * u, base - size, widths[k] + 12 * u, size * 1.12); ctx.clip();
      ctx.fillStyle = rgba(p.numerals, 1);
      ctx.fillText(chars[k], x + widths[k] / 2, base + (1 - rise) * size);
      ctx.restore();
      x += widths[k];
    }
    // The seat line the numerals stand on.
    var lineIn = easeInOut(clamp01((t - 0.2) / 0.7));
    ctx.strokeStyle = 'rgba(253,224,71,0.5)'; ctx.lineWidth = 3 * u;
    ctx.beginPath();
    ctx.moveTo(W / 2 - (total / 2 + 30 * u) * lineIn, base + 16 * u);
    ctx.lineTo(W / 2 + (total / 2 + 30 * u) * lineIn, base + 16 * u);
    ctx.stroke();
    var strapIn = easeOut(clamp01((t - 1.0) / 0.6));
    ctx.globalAlpha = (1 - gone) * strapIn;
    ctx.fillStyle = '#e4e4e7';
    ctx.font = '600 ' + Math.round(44 * u) + 'px Oswald';
    ctx.fillText(p.strap.toUpperCase(), W / 2, H * 0.66);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
