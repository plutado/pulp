<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stadium Flash</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Stadium Flash, a sample template for Pulp. CC0-1.0: no rights reserved.
  // Three banks arrive on fixed beats before the midpoint, each a row of flares; the
  // full wash lands exactly on the cut, with a grainy falloff after it.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var mid = d / 2;
    var banks = 3;
    for (var b = 0; b < banks; b++) {
      var when = mid - 0.3 + b * 0.12;
      var on = t >= when ? 1 : 0;
      if (!on) continue;
      var age = t - when;
      var punch = 1 + Math.exp(-age * 10) * 0.8;
      var fade = easeInOut(clamp01((d - t) / (d - mid)));
      var y = H * (0.18 + b * 0.14);
      for (var i = 0; i < 6; i++) {
        var x = W * (0.1 + i * 0.16);
        var r = 90 * u * punch * fade;
        var g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
        g.addColorStop(0, p.light);
        g.addColorStop(1, p.light + '00');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    var wash = 1 - Math.abs(t - mid) / (d * 0.14);
    if (wash > 0) {
      ctx.fillStyle = p.light;
      ctx.globalAlpha = easeInOut(clamp01(wash));
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    // A grainy falloff after the peak: fixed speckle, fading with the lights.
    if (t > mid) {
      var dust = easeInOut(clamp01((t - mid) / (d - mid)));
      var frame = Math.floor(t * 30);
      ctx.fillStyle = p.light;
      for (var s2 = 0; s2 < 120; s2++) {
        ctx.globalAlpha = (1 - dust) * 0.3 * at(s2 + frame * 7);
        ctx.fillRect(at(s2 * 3 + frame) * W, at(s2 * 3 + 1 + frame) * H, 3 * u, 3 * u);
      }
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
