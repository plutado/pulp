<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caption Beside</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Caption Beside, a caption style for Pulp made for vertical (milestone 65; docs/vertical-layouts.md). CC0-1.0: no rights reserved.
  //
  // A narrow column of words beside the person speaking: on the side away from the face, at the
  // face's height, aligned toward it. The word being said is underlined in its color. Three rows at a
  // time. The column on the right stops short of the controls column; on the left it starts inside
  // the safe box.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  document.fonts.load('900 64px Montserrat');
  document.fonts.load('800 64px Montserrat');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }

  // Drawn with no captions at all — a card's poster, the library preview, the visual references.
  var SPECIMEN = {
    time: 1.3, spoken: 3, box: null,
    line: { start: 0, end: 2.2, words: [
      { text: 'This', start: 0, end: 0.3 }, { text: 'is', start: 0.3, end: 0.45 }, { text: 'the', start: 0.45, end: 0.6 },
      { text: 'part', start: 1.2, end: 1.5 }, { text: 'that', start: 1.5, end: 1.7 }, { text: 'matters', start: 1.7, end: 2.2 }
    ] }
  };

  /** The words in rows no wider than maxWidth at the font already set; each keeps its index in the line. */
  function wrap(words, maxWidth, space, upper) {
    var rows = [[]], width = 0;
    for (var i = 0; i < words.length; i++) {
      var text = upper ? words[i].text.toUpperCase() : words[i].text;
      var w = ctx.measureText(text).width;
      var row = rows[rows.length - 1];
      if (row.length > 0 && width + space + w > maxWidth) { rows.push([]); row = rows[rows.length - 1]; width = 0; }
      row.push({ index: i, text: text, width: w, start: words[i].start });
      width += (row.length > 1 ? space : 0) + w;
    }
    return rows;
  }
  function rowWidth(row, space) { var w = 0; for (var i = 0; i < row.length; i++) w += row[i].width + (i > 0 ? space : 0); return w; }
  /** The rows shown now: `per` at a time, the page holding the word being said (the first page before any is). */
  function page(rows, spoken, per) {
    var at = 0;
    for (var r = 0; r < rows.length; r++) for (var k = 0; k < rows[r].length; k++) if (rows[r][k].index === spoken) at = r;
    var first = Math.floor(at / per) * per;
    return rows.slice(first, first + per);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fit(state) {
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    ctx.clearRect(0, 0, state.width, state.height);
  }
  // Every style here keeps its words between 18% and 82% of the width — clear of the controls column
  // down the right, and centered — so the words sit in the middle of the picture, not beside it.
  var LEFT = 0.18, RIGHT = 0.82;

  window.pulpRender = function (state) {
    fit(state);
    var W = state.width, H = state.height, p = state.params, u = Math.min(W, H);
    var caps = state.captions || SPECIMEN;
    var line = caps.line;
    if (!line || !line.words || line.words.length === 0) return;
    var size = Math.round(p.size * u);
    var space = size * 0.28, lead = size * 1.22;
    ctx.font = '800 ' + size + 'px Montserrat';
    var wordsRight = p.face !== 'right';
    var left = wordsRight ? 0.45 * W : 0.11 * W;
    var right = wordsRight ? 0.8 * W : 0.5 * W;
    var rows = page(wrap(line.words, right - left, space, false), caps.spoken, 3);
    var blockH = rows.length * lead;
    // At the face's height, kept inside the frame's clear middle: under the header strip, above the band.
    var top = Math.max(0.15 * H, Math.min(0.74 * H - blockH, p.level * H - blockH / 2));
    var inAt = easeOut(clamp01((caps.time - line.start) / 0.12));
    ctx.save();
    ctx.globalAlpha = inAt;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = size * 0.25;
    ctx.shadowOffsetY = size * 0.06;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var rw = rowWidth(row, space);
      // Aligned toward the face: the column's near edge is the one beside it.
      var x = wordsRight ? left : right - rw;
      x += (wordsRight ? 1 : -1) * (1 - inAt) * size * 0.5;
      var baseline = top + i * lead + size;
      for (var k = 0; k < row.length; k++) {
        var spoken = row[k].index === caps.spoken;
        ctx.fillStyle = spoken ? rgba(p.spoken, 1) : rgba(p.ink, 1);
        ctx.fillText(row[k].text, x, baseline);
        if (spoken) ctx.fillRect(x, baseline + size * 0.14, row[k].width, Math.max(3, size * 0.09));
        x += row[k].width + space;
      }
    }
    ctx.restore();
  };
</script>
</body>
</html>
