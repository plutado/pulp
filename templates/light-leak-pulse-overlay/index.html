<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Light Leak</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Light Leak, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Both leaks breathe on whole cycles of the clip, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var cycle = (t / d) * Math.PI * 2;
    var a1 = 0.5 + 0.5 * Math.sin(cycle), a2 = 0.5 + 0.5 * Math.sin(cycle + Math.PI * 0.9);
    var g1 = ctx.createRadialGradient(-W * 0.05, H * 0.1, 0, -W * 0.05, H * 0.1, W * (0.5 + a1 * 0.12));
    g1.addColorStop(0, rgba(p.warm, 0.28 + a1 * 0.2));
    g1.addColorStop(0.5, rgba(p.warm, (0.28 + a1 * 0.2) * 0.35));
    g1.addColorStop(1, rgba(p.warm, 0));
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
    var g2 = ctx.createRadialGradient(W * 1.02, H * 0.85, 0, W * 1.02, H * 0.85, W * (0.4 + a2 * 0.1));
    g2.addColorStop(0, rgba(p.cool, 0.2 + a2 * 0.16));
    g2.addColorStop(1, rgba(p.cool, 0));
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    // A thin streak that leans across with the first leak's breath.
    ctx.save();
    ctx.translate(W * 0.2, H * 0.3); ctx.rotate(0.6);
    var streak = ctx.createLinearGradient(0, -H * 0.1, 0, H * 0.1);
    streak.addColorStop(0, rgba(p.warm, 0)); streak.addColorStop(0.5, rgba(p.warm, 0.1 + a1 * 0.1)); streak.addColorStop(1, rgba(p.warm, 0));
    ctx.fillStyle = streak; ctx.fillRect(-W * 0.4, -H * 0.1, W * 1.4, H * 0.2);
    ctx.restore();
  };
</script>
</body>
</html>
