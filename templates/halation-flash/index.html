<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halation</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Halation, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Stretching the length only slows the bloom, which is what scale means.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var f = t / d;
    var swell = Math.sin(Math.min(1, f) * Math.PI);
    var reach = easeInOut(f);
    // The bloom hangs from the top edge and swells past the middle of the frame.
    var g = ctx.createLinearGradient(0, -H * 0.2, 0, H * (0.4 + reach * 0.8));
    g.addColorStop(0, rgba(p.warm, Math.min(1, swell * 1.3)));
    g.addColorStop(0.55, rgba(p.warm, swell * 0.55));
    g.addColorStop(1, rgba(p.warm, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // The halo: a soft ellipse that drifts down through the crossing.
    var hy = H * (0.1 + f * 0.5);
    var g2 = ctx.createRadialGradient(W * 0.5, hy, 0, W * 0.5, hy, W * 0.4);
    g2.addColorStop(0, rgba(p.warm, swell * 0.5));
    g2.addColorStop(1, rgba(p.warm, 0));
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    // At full swell the whole frame whites through, so the cut can hide under it.
    ctx.fillStyle = 'rgba(255,252,246,' + Math.pow(swell, 3).toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
