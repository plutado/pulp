<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Swoosh Arrow</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Swoosh Arrow, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The tail draws and the head lands by 1.0 s; the arrow then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var draw = easeInOut(clamp01(t / 0.7));
    var bounce = overshoot(clamp01((t - 0.6) / 0.4));
    var tx = W * p.x, ty = H * p.y;
    var sx = tx - W * 0.3, sy = ty + H * 0.32;
    var len = Math.min(W, H) * 0.3;
    ctx.globalAlpha = 1 - gone;
    ctx.fillStyle = rgba(p.fill, 1);
    // The tail: a tapering ribbon along a curve, grown to the drawn share.
    var steps = Math.max(2, Math.floor(30 * draw));
    ctx.beginPath();
    for (var side = 0; side < 2; side++) {
      for (var k = 0; k <= steps; k++) {
        var f = side ? 1 - k / 30 : k / 30;
        if (side) f = (steps - k) / 30;
        var cxp = sx + (tx - sx) * f, cyp = sy + (ty - sy) * f - Math.sin(f * Math.PI) * H * 0.18;
        var w = len * 0.1 * (0.2 + f * 0.8) * (side ? -1 : 1);
        var px2 = cxp + w * 0.6, py2 = cyp + w;
        if (side === 0 && k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
    }
    ctx.closePath(); ctx.fill();
    // The head lands with a bounce once the tail arrives.
    if (t >= 0.6) {
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(-0.75);
      ctx.scale(Math.max(0.0001, bounce), Math.max(0.0001, bounce));
      ctx.beginPath();
      ctx.moveTo(len * 0.26, 0); ctx.lineTo(-len * 0.16, -len * 0.22); ctx.lineTo(-len * 0.08, 0); ctx.lineTo(-len * 0.16, len * 0.22);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
