<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Timeline</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Timeline, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The last point lands at 1.9 s; the timeline then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.6) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var dates = [p.d1, p.d2, p.d3, p.d4], events = [p.e1, p.e2, p.e3, p.e4];
    var left = W * 0.1, right = W * 0.9, y = H * 0.5;
    ctx.globalAlpha = 1 - gone;
    var drawn = easeInOut(clamp01(t / 1.4));
    ctx.strokeStyle = rgba(p.line, 0.9); ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + (right - left) * drawn, y); ctx.stroke();
    for (var i = 0; i < 4; i++) {
      var x = left + (right - left) * (i / 3);
      var pop = overshoot(clamp01((t - 0.2 - i * 0.42) / 0.4));
      if (t < 0.2 + i * 0.42) continue;
      var above = i % 2 === 0;
      ctx.fillStyle = rgba(p.dot, 1);
      ctx.beginPath(); ctx.arc(x, y, Math.min(W, H) * 0.014 * Math.max(0.0001, pop), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = rgba(p.line, 0.6); ctx.lineWidth = 2 * u;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + (above ? -1 : 1) * 40 * u * Math.min(1, pop)); ctx.stroke();
      ctx.globalAlpha = (1 - gone) * Math.min(1, pop);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = rgba(p.dot, 1);
      ctx.font = '700 ' + Math.round(40 * u) + 'px Montserrat';
      ctx.fillText(String(dates[i]), x, y + (above ? -100 * u : 90 * u));
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '500 ' + Math.round(28 * u) + 'px Inter';
      ctx.fillText(String(events[i]), x, y + (above ? -60 * u : 130 * u));
      ctx.globalAlpha = 1 - gone;
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
