<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Four Steps</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Four Steps, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The fourth step lands at 1.9 s with the line full; the diagram then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.6) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var steps = [p.s1, p.s2, p.s3, p.s4];
    var left = W * 0.14, right = W * 0.86, y = H * 0.5, r = Math.min(W, H) * 0.05;
    ctx.globalAlpha = 1 - gone;
    ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 6 * u;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    var fillTo = easeInOut(clamp01((t - 0.3) / 1.4));
    ctx.strokeStyle = rgba(p.accent, 1);
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + (right - left) * fillTo, y); ctx.stroke();
    for (var i = 0; i < 4; i++) {
      var x = left + (right - left) * (i / 3);
      var pop = overshoot(clamp01((t - 0.15 - i * 0.42) / 0.45));
      if (t < 0.15 + i * 0.42) continue;
      ctx.save();
      ctx.translate(x, y); ctx.scale(Math.max(0.0001, pop), Math.max(0.0001, pop));
      ctx.fillStyle = rgba(p.accent, 1);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#082f2c';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(r * 1.1) + 'px Montserrat';
      ctx.fillText(String(i + 1), 0, 2 * u);
      ctx.restore();
      ctx.globalAlpha = (1 - gone) * Math.min(1, pop);
      ctx.fillStyle = rgba(p.ink, 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '600 ' + Math.round(34 * u) + 'px Inter';
      ctx.fillText(String(steps[i]), x, y + r + 52 * u);
      ctx.globalAlpha = 1 - gone;
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
