<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Live Bug</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Live Bug, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The dot pulses on whole beats of the clip, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var pulse = Math.pow(0.5 + 0.5 * Math.sin((t / d) * Math.PI * 2 * 4), 2);
    var ph = 52 * u, pw2 = ph * 1.1 + String(p.word).length * 20 * u;
    var x = W - pw2 - Math.min(W, H) * 0.045, y = Math.min(W, H) * 0.045;
    rr(x, y, pw2, ph, ph / 2);
    ctx.fillStyle = rgba(p.pill, 0.85); ctx.fill();
    ctx.lineWidth = 1.5 * u; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
    var dx2 = x + ph * 0.52, dy2 = y + ph / 2;
    var g = ctx.createRadialGradient(dx2, dy2, 0, dx2, dy2, ph * 0.5);
    g.addColorStop(0, rgba(p.dot, 0.5 * pulse)); g.addColorStop(1, rgba(p.dot, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(dx2, dy2, ph * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(p.dot, 0.6 + pulse * 0.4);
    ctx.beginPath(); ctx.arc(dx2, dy2, 7 * u + pulse * 2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(250,250,252,0.95)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(24 * u) + 'px Inter';
    ctx.fillText(String(p.word), x + ph * 0.95, y + ph / 2 + 1 * u);
  };
</script>
</body>
</html>
