<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clipboard</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // An object on transparency, a sample for Pulp (milestone 46). CC0-1.0: no rights reserved.
  // A vector drawing in a box of 100 units, scaled to the frame, so it stays sharp at any size;
  // it comes in with a light entrance, holds, and fades at the end.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function bounce(x) { if (x < 1 / 2.75) return 7.5625 * x * x; if (x < 2 / 2.75) { x -= 1.5 / 2.75; return 7.5625 * x * x + 0.75; } if (x < 2.5 / 2.75) { x -= 2.25 / 2.75; return 7.5625 * x * x + 0.9375; } x -= 2.625 / 2.75; return 7.5625 * x * x + 0.984375; }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + Math.max(0, a).toFixed(4) + ')'; }
  function shade(c, k) { var t = k > 0 ? 255 : 0, m = Math.abs(k); return 'rgb(' + Math.round(hex(c, 1) + (t - hex(c, 1)) * m) + ',' + Math.round(hex(c, 3) + (t - hex(c, 3)) * m) + ',' + Math.round(hex(c, 5) + (t - hex(c, 5)) * m) + ')'; }
  function circle(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
  function rrect(x, y, w, h, r, fill, stroke, lw) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
  function poly(pts, fill, stroke, lw) { ctx.beginPath(); for (var i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]); } ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
  function line(x1, y1, x2, y2, stroke, lw) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  function star(x, y, r, n, inner, fill) { ctx.beginPath(); for (var i = 0; i < n * 2; i++) { var a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * inner : r; var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);
    // The entrance over the first 0.8 s, the fade out over the last 0.6 s: the hold the manifest declares.
    var e = clamp01(t / 0.8), gone = clamp01((t - (d - 0.6)) / 0.6);
    if (gone >= 1) return;
    var u = Math.min(W, H) * 0.0036;
    var kind = p.entrance, s = 1, dy = 0, alpha = 1 - gone, clipTo = 1;
    if (kind === 'pop') { s = e < 1 ? overshoot(e) : 1; alpha *= clamp01(e * 3); }
    else if (kind === 'drop') { dy = -(1 - bounce(e)) * 60; alpha *= clamp01(e * 4); }
    else if (kind === 'rise') { dy = (1 - easeOut(e)) * 40; alpha *= easeOut(e); }
    else if (kind === 'draw') { clipTo = easeOut(e); }
    else { alpha *= easeOut(e); }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H / 2 + dy * u);
    ctx.scale(u * s, u * s);
    if (clipTo < 1) { ctx.beginPath(); ctx.rect(-60, -60, 120 * clipTo, 120); ctx.clip(); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    draw(p);
    ctx.restore();
  };

  function draw(p) {
    rrect(-32, -40, 64, 86, 5, p.board);
    rrect(-26, -30, 52, 70, 3, p.paper);
    rrect(-12, -46, 24, 12, 3, shade(p.board, -0.3));
    for (var i = 0; i < 3; i++) { var y = -14 + i * 18; ctx.strokeStyle = p.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-18, y); ctx.lineTo(-14, y + 4); ctx.lineTo(-8, y - 4); ctx.stroke(); line(-2, y, 18, y, shade(p.ink, 0.5), 3); }
  }
</script>
</body>
</html>
