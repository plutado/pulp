<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Citation Callout</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Citation Callout, a sample template for Pulp. CC0-1.0: no rights reserved.
  // The quote wraps to the card's measure; the source's underline draws left to right
  // once the card has settled.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var inF = 0.7, outF = 0.6;
    var hold = Math.min(p.inOut, Math.max(0.2, d - inF - outF));
    var gone = easeInOut(clamp01((t - inF - hold) / outF));
    var come = easeOut(clamp01(t / inF));
    var show = come * (1 - gone);
    if (show <= 0.001) return;

    var pw = Math.min(W * 0.62, 820 * u);
    ctx.font = '500 ' + Math.round(34 * u) + 'px Source Serif 4';
    // Wrap the quote by words into the card's measure.
    var words = p.quote.split(' ');
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      var cand = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(cand).width > pw - 80 * u) { lines.push(line); line = words[i]; }
      else line = cand;
    }
    if (line) lines.push(line);
    var lineH = 48 * u;
    var ph = 70 * u + lines.length * lineH + 70 * u;
    var cx = W * (p.x / 100), cy = H * (p.y / 100);
    var x = cx - pw / 2, y = cy - ph / 2 + (1 - come) * 24 * u;

    ctx.globalAlpha = show;
    ctx.fillStyle = 'rgba(250, 248, 243, 0.97)';
    ctx.strokeStyle = 'rgba(40, 40, 46, 0.3)';
    ctx.lineWidth = 1.5 * u;
    ctx.beginPath();
    ctx.roundRect(x, y, pw, ph, 6 * u);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = p.rule;
    ctx.fillRect(x, y, 8 * u, ph);

    ctx.fillStyle = '#23262e';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    for (var l = 0; l < lines.length; l++) ctx.fillText(lines[l], x + 44 * u, y + 56 * u + l * lineH);

    ctx.font = '600 ' + Math.round(22 * u) + 'px Inter';
    ctx.fillStyle = 'rgba(60, 64, 74, 0.85)';
    var srcY = y + ph - 28 * u;
    ctx.fillText(p.source.toUpperCase(), x + 44 * u, srcY);
    var lineIn = easeInOut(clamp01((t - inF - 0.2) / 0.5)) * (1 - gone);
    ctx.fillStyle = p.rule;
    ctx.fillRect(x + 44 * u, srcY + 10 * u, ctx.measureText(p.source.toUpperCase()).width * lineIn, 3 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
