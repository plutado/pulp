<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Strip</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Poll Strip, a sample template for Pulp. CC0-1.0: no rights reserved.
  // The halves grow from a 50-50 split to the real shares, and the shares count up
  // with them, so the result lands as one movement.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var inF = 0.5, growFor = 1.2, outF = 0.6;
    // The hold is the design's own, no longer a setting: the length is the control (milestone 30).
    var hold = Math.min(3, Math.max(0.2, d - inF - growFor - outF));
    var gone = easeInOut(clamp01((t - (inF + growFor + hold)) / outF));
    var come = easeOut(clamp01(t / inF));
    var show = come * (1 - gone);
    if (show <= 0.001) return;

    var f = easeInOut(clamp01((t - inF) / growFor));
    var share = 0.5 + (p.share / 100 - 0.5) * f;
    var pw = Math.min(W * 0.76, 900 * u), ph = 64 * u;
    var x = W / 2 - pw / 2, y = H * 0.8;

    ctx.globalAlpha = show;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f2f6fb';
    ctx.font = '600 ' + Math.round(34 * u) + 'px Inter';
    ctx.fillText(p.question, W / 2, y - 26 * u);

    // The two halves, with the leader at full strength and the trailer sitting back.
    var leftLeads = share >= 0.5;
    ctx.fillStyle = p.a;
    ctx.globalAlpha = show * (leftLeads ? 1 : 0.55);
    ctx.beginPath();
    ctx.roundRect(x, y, pw * share, ph, [ph / 2, 0, 0, ph / 2]);
    ctx.fill();
    ctx.fillStyle = p.b;
    ctx.globalAlpha = show * (leftLeads ? 0.55 : 1);
    ctx.beginPath();
    ctx.roundRect(x + pw * share, y, pw * (1 - share), ph, [0, ph / 2, ph / 2, 0]);
    ctx.fill();

    ctx.globalAlpha = show;
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 ' + Math.round(26 * u) + 'px Inter';
    ctx.textAlign = 'left';
    ctx.fillText(p.left + ' ' + Math.round(share * 100) + '%', x + 22 * u, y + ph / 2 + 9 * u);
    ctx.textAlign = 'right';
    ctx.fillText(Math.round((1 - share) * 100) + '% ' + p.right, x + pw - 22 * u, y + ph / 2 + 9 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
