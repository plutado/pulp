<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quote Mark</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Quote Mark, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The mark rises and the hairline draws by 1.2 s; the whole card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 1.0)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var b = state.blocks.words.box;
    ctx.globalAlpha = show;
    // The mark: two drawn comma shapes, rising into place.
    var mx = b.x - 26 * u, my = b.y + (1 - come) * 24 * u;
    ctx.fillStyle = rgba(p.mark, 0.95);
    for (var m = 0; m < 2; m++) {
      ctx.save(); ctx.translate(mx - m * 34 * u, my); ctx.scale(u, u);
      ctx.beginPath();
      ctx.arc(0, 0, 13, Math.PI * 0.2, Math.PI * 1.5);
      ctx.quadraticCurveTo(-16, 26, -26, 34);
      ctx.quadraticCurveTo(-6, 30, 6, 12);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // The hairline draws from the mark across the words.
    var drawn = easeInOut(clamp01((t - 0.3) / 0.9));
    ctx.strokeStyle = 'rgba(250,250,249,0.65)'; ctx.lineWidth = 1.5 * u;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.height + 14 * u);
    ctx.lineTo(b.x + b.width * drawn, b.y + b.height + 14 * u);
    ctx.stroke();
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.2 - position * 0.3) / 0.6));
        return { alpha: lineIn, dy: (1 - lineIn) * 10 * u };
      }
    });
    window.pulpDrawBlock(ctx, laid);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
