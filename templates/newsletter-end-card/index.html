<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Newsletter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // The Newsletter, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The flap closes and the seal lands by 1.7 s; the card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    var come = easeOut(clamp01(t / 0.7));
    var ew = Math.min(W * 0.34, 460 * u), eh = ew * 0.62;
    var ex = W / 2 - ew / 2, ey = H * 0.42 - eh / 2 + (1 - come) * 24 * u;
    ctx.globalAlpha = (1 - gone) * come;
    // The letter, peeking before the flap closes over it.
    var closes = easeInOut(clamp01((t - 0.7) / 0.7));
    ctx.fillStyle = '#fdfbf4';
    ctx.fillRect(ex + ew * 0.08, ey - eh * 0.34 * (1 - closes), ew * 0.84, eh * 0.5);
    ctx.strokeStyle = 'rgba(120,120,130,0.4)'; ctx.lineWidth = 1.5 * u;
    for (var l = 0; l < 3; l++) {
      ctx.beginPath();
      ctx.moveTo(ex + ew * 0.16, ey - eh * 0.34 * (1 - closes) + (10 + l * 9) * u);
      ctx.lineTo(ex + ew * 0.7, ey - eh * 0.34 * (1 - closes) + (10 + l * 9) * u);
      ctx.stroke();
    }
    ctx.fillStyle = rgba(p.envelope, 1);
    ctx.strokeStyle = 'rgba(100,100,110,0.45)'; ctx.lineWidth = 2 * u;
    rr(ex, ey, ew, eh, 8 * u); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex, ey + eh); ctx.lineTo(ex + ew / 2, ey + eh * 0.42); ctx.lineTo(ex + ew, ey + eh); ctx.stroke();
    // The flap, folding down over the letter.
    ctx.fillStyle = rgba(p.envelope, 1);
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex + ew / 2, ey + eh * 0.52 * closes);
    ctx.lineTo(ex + ew, ey);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    var sealed = overshoot(clamp01((t - 1.4) / 0.4));
    if (t >= 1.4) {
      ctx.fillStyle = rgba(p.seal, 1);
      ctx.beginPath(); ctx.arc(ex + ew / 2, ey + eh * 0.5, 16 * u * Math.max(0.0001, sealed), 0, Math.PI * 2); ctx.fill();
    }
    var wordsIn = easeOut(clamp01((t - 1.1) / 0.7));
    ctx.globalAlpha = (1 - gone) * wordsIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#33302a';
    ctx.font = '700 ' + Math.round(68 * u) + 'px "Source Serif 4"';
    ctx.fillText(p.title, W / 2, H * 0.66);
    ctx.fillStyle = '#8a7f6a';
    ctx.font = '500 ' + Math.round(32 * u) + 'px Inter';
    ctx.fillText(p.where, W / 2, H * 0.73);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
