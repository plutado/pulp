<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon Underline</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Neon Underline, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The tube stutters before 1.0 s and burns steady from then on, so the card holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.6)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var b = state.blocks.words.box;
    // The stutter: a fixed on/off pattern that ends at 1.0 s, then steady.
    var flicker = t >= 1.0 ? 1 : (at(Math.floor(t * 24)) > 0.45 ? 1 : 0.15);
    var ly = b.y + b.height * 0.62, lx0 = b.x - 6 * u, lx1 = b.x + b.width * 0.9;
    ctx.globalAlpha = show;
    ctx.lineCap = 'round';
    for (var pass = 0; pass < 3; pass++) {
      ctx.lineWidth = [14, 7, 3][pass] * u;
      ctx.strokeStyle = rgba(p.tube, [0.16, 0.45, 0.95][pass] * flicker);
      ctx.beginPath(); ctx.moveTo(lx0, ly); ctx.lineTo(lx1, ly); ctx.stroke();
    }
    // The tube's wall mounts.
    ctx.fillStyle = 'rgba(220,220,230,0.8)';
    ctx.fillRect(lx0 + 20 * u, ly - 3 * u, 8 * u, 6 * u);
    ctx.fillRect(lx1 - 28 * u, ly - 3 * u, 8 * u, 6 * u);
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.1 - position * 0.3) / 0.5));
        return { alpha: lineIn * (position === 0 ? (0.6 + 0.4 * flicker) : 1), dy: (1 - lineIn) * 8 * u };
      }
    });
    window.pulpDrawBlock(ctx, laid);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
