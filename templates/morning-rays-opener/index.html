<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Morning Rays</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Morning Rays, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The rays turn the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.8)), gone = easeOut(clamp01((t - (d - 0.8)) / 0.8));
    ctx.fillStyle = rgba(p.sky, 1); ctx.fillRect(0, 0, W, H);
    // The rays turn the whole way through: a morning that keeps spinning.
    ctx.save();
    ctx.translate(W / 2, H * 0.62);
    ctx.rotate(t * 0.22);
    for (var i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.fillStyle = rgba(p.ray, 0.35);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, Math.max(W, H) * 1.2, -Math.PI / 14, Math.PI / 14);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    var g = ctx.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, H * 0.5);
    g.addColorStop(0, 'rgba(255,252,240,0.9)'); g.addColorStop(1, 'rgba(255,252,240,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // The ribbon bounces in and bobs gently.
    var drop = overshoot(clamp01(t / 0.7));
    var bob = Math.sin(t * 2.2) * 6 * u;
    var rw = Math.min(W * 0.62, 900 * u), rh = 150 * u;
    var rx = W / 2 - rw / 2, ry = H * 0.42 - rh / 2 + (1 - drop) * -H * 0.5 + bob;
    ctx.globalAlpha = (1 - gone) * come;
    ctx.fillStyle = rgba(p.ribbon, 1);
    rr(rx, ry, rw, rh, rh / 2); ctx.fill();
    for (var e = 0; e < 2; e++) {
      var ex = e ? rx + rw - 8 * u : rx + 8 * u;
      ctx.beginPath();
      ctx.moveTo(ex, ry + rh * 0.24);
      ctx.lineTo(e ? ex + 46 * u : ex - 46 * u, ry + rh / 2);
      ctx.lineTo(ex, ry + rh * 0.76);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#fff7e6';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(76 * u) + 'px Montserrat';
    ctx.fillText(p.title, W / 2, ry + rh / 2 + 2 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
