<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Versus Bars</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Versus Bars, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The bars reach their values at 1.5 s and hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.6) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var race = easeOut(clamp01((t - 0.3) / 1.2));
    var cx = W / 2, y = H * 0.5, bh = Math.min(W, H) * 0.1, span = W * 0.42;
    var total = Math.max(1, p.va + p.vb);
    ctx.globalAlpha = 1 - gone;
    ctx.fillStyle = rgba(p.ca, 1);
    var wa = span * (p.va / total) * 2 * race;
    rr(cx - wa, y - bh / 2, wa, bh, bh * 0.2); ctx.fill();
    ctx.fillStyle = rgba(p.cb, 1);
    var wb = span * (p.vb / total) * 2 * race;
    rr(cx, y - bh / 2, wb, bh, bh * 0.2); ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(cx - 3 * u, y - bh * 0.8, 6 * u, bh * 1.6);
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(bh * 0.7) + 'px "Bebas Neue"';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(p.va * race) + '%', cx - 24 * u, y - bh * 1.1);
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(p.vb * race) + '%', cx + 24 * u, y - bh * 1.1);
    ctx.font = '600 ' + Math.round(bh * 0.32) + 'px Inter';
    ctx.fillStyle = 'rgba(226,232,240,0.9)';
    ctx.textAlign = 'right'; ctx.fillText(String(p.la), cx - 24 * u, y + bh * 1.0);
    ctx.textAlign = 'left'; ctx.fillText(String(p.lb), cx + 24 * u, y + bh * 1.0);
    var headIn = easeOut(clamp01(t / 0.5));
    ctx.globalAlpha = (1 - gone) * headIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 ' + Math.round(40 * u) + 'px Oswald';
    ctx.fillText(String(p.title).toUpperCase(), cx, y - bh * 1.9);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
