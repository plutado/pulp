<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>See You There</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // See You There, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The route draws and the pin lands by 1.9 s; the card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(100,130,110,0.16)'; ctx.lineWidth = 1;
    var step = Math.min(W, H) / 14;
    for (var x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (var y = 0; y <= H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.globalAlpha = 1 - gone;
    // The route: a dashed curve drawn to its pin.
    var run = easeInOut(clamp01((t - 0.2) / 1.1));
    var x0 = W * 0.12, y0 = H * 0.68, x1 = W / 2, y1 = H * 0.36;
    ctx.strokeStyle = 'rgba(70,100,85,0.75)'; ctx.lineWidth = 4 * u; ctx.setLineDash([12 * u, 10 * u]);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    var segs = Math.max(1, Math.floor(40 * run));
    for (var i = 1; i <= segs; i++) {
      var f = i / 40;
      var px = x0 + (x1 - x0) * f, py = y0 + (y1 - y0) * f - Math.sin(f * Math.PI) * H * 0.16;
      ctx.lineTo(px, py);
    }
    ctx.stroke(); ctx.setLineDash([]);
    // The pin drops once the route arrives, with a bounce and a shadow.
    var dropAt = 1.3, drop = overshoot(clamp01((t - dropAt) / 0.5));
    if (t >= dropAt) {
      var pr = 26 * u, py2 = y1 - 40 * u + (1 - drop) * -120 * u;
      ctx.fillStyle = 'rgba(40,60,50,0.18)';
      ctx.beginPath(); ctx.ellipse(x1, y1 + 6 * u, pr * 0.8 * drop, pr * 0.26 * drop, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(p.pin, 1);
      ctx.beginPath();
      ctx.arc(x1, py2, pr, Math.PI * 0.85, Math.PI * 0.15);
      ctx.quadraticCurveTo(x1 + pr * 0.5, py2 + pr * 1.1, x1, py2 + pr * 1.9);
      ctx.quadraticCurveTo(x1 - pr * 0.5, py2 + pr * 1.1, x1 - Math.cos(Math.PI * 0.15) * pr, py2 + Math.sin(Math.PI * 0.85) * pr);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = p.back;
      ctx.beginPath(); ctx.arc(x1, py2, pr * 0.42, 0, Math.PI * 2); ctx.fill();
    }
    var wordsIn = easeOut(clamp01((t - 1.4) / 0.6));
    ctx.globalAlpha = (1 - gone) * wordsIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#24473a';
    ctx.font = '700 ' + Math.round(84 * u) + 'px Montserrat';
    ctx.fillText(p.title, W / 2, H * 0.62 + (1 - wordsIn) * 18 * u);
    ctx.fillStyle = '#4f7a66';
    ctx.font = '500 ' + Math.round(34 * u) + 'px Inter';
    ctx.fillText(p.place, W / 2, H * 0.62 + 64 * u + (1 - wordsIn) * 18 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
