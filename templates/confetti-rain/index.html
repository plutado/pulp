<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Confetti Rain</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Confetti Rain, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Each piece falls one or two frame-heights per loop and spins a whole number of turns, so the last frame meets the first.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var loop = (t / d) % 1;

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p.back);
    g.addColorStop(1, '#0b0a1f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var palette = ['#f472b6', '#facc15', '#34d399', '#60a5fa', '#fb923c'];
    var count = Math.round(p.count);
    for (var i = 0; i < count; i++) {
      var cycles = 1 + (i % 2);
      var f = (at(i) + loop * cycles) % 1;
      var y = f * (H * 1.2) - H * 0.1;
      var x = W * at(i + 17) + Math.sin(loop * Math.PI * 2 * 2 + i) * W * 0.03;
      var spin = (at(i + 29) + loop * (2 + (i % 3))) * Math.PI * 2;
      var s = Math.min(W, H) * (0.012 + at(i + 43) * 0.012);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(spin);
      ctx.scale(1, Math.max(0.2, Math.abs(Math.cos(spin * 0.5))));
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(-s, -s * 0.6, s * 2, s * 1.2);
      ctx.restore();
    }
  };
</script>
</body>
</html>
