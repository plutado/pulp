<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival iris matte</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  function star(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var k = 0; k < 8; k++) {
      var rr = k % 2 === 0 ? r : r * 0.3;
      var a = k * TAU / 8 - Math.PI / 2;
      if (k === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  // The same colour at zero alpha, so gradients fade without passing through dark grey.
  function clear(hex) {
    return 'rgba(' + parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' + parseInt(hex.slice(5, 7), 16) + ',0)';
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    // The hole shrinks to nothing by the midpoint and grows back from nothing after it, so the
    // field covers everything at progress 0.5, where the cut goes.
    var cx = p.position === 'left' ? W * 0.3 : p.position === 'right' ? W * 0.7 : W / 2;
    var cy = H / 2;
    var cover = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 8;
    var pr = state.progress;
    var hole = pr < 0.5
      ? (1 - easeInOutCubic(clamp01(pr * 2))) * cover
      : easeInOutCubic(clamp01(pr * 2 - 1)) * cover;
    var s = Math.min(W, H) / 1080;
    var soft = Math.max(1, p.softness * Math.min(W, H) * 0.5);
    if (hole >= cover) return;

    // The field, with the hole cut out by a soft radial mask.
    ctx.fillStyle = p.panel;
    ctx.fillRect(0, 0, W, H);
    if (hole > 0) {
      var inner = Math.max(0, hole - soft);
      var mask = ctx.createRadialGradient(cx, cy, inner, cx, cy, hole);
      mask.addColorStop(0, 'rgba(0,0,0,1)');
      mask.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = mask;
      ctx.beginPath();
      ctx.arc(cx, cy, hole, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // The gold rim hugs the soft edge and glows a little outward; it and the twinkles fade away
    // as the hole closes, so the midpoint is a plain plum field.
    var rim = 10 * s;
    var presence = clamp01(hole / (rim * 6));
    var glowR = hole + rim * 3;
    var glow = ctx.createRadialGradient(cx, cy, Math.max(0, hole - soft), cx, cy, glowR);
    glow.addColorStop(0, clear(p.gold));
    glow.addColorStop(Math.min(0.99, soft / (glowR - Math.max(0, hole - soft) || 1)), p.gold);
    glow.addColorStop(1, clear(p.gold));
    ctx.globalAlpha = 0.85 * presence;
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, TAU);
    if (hole - soft > 0) ctx.arc(cx, cy, hole - soft, 0, TAU, true);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Twinkles ride the rim at fixed angles, each with its own flicker driven by the frame.
    var count = Math.round(p.twinkles);
    for (var i = 0; i < count; i++) {
      var ang = hash(i + 1) * TAU;
      var wob = Math.sin(state.frame * 0.9 + i * 2.1) * 0.5 + 0.5;
      var r = (6 + 10 * wob) * s * (0.6 + 0.4 * hash(i + 50));
      var d = hole + rim * (0.5 + hash(i + 100));
      var x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d;
      ctx.globalAlpha = (0.5 + 0.5 * wob) * presence;
      star(x, y, r, '#fff6d8');
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
