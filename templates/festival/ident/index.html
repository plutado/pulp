<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival ident</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var SERIF = 'Georgia, Times New Roman, serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }
  function easeOutBack(x) { var c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  // A seeded hash, so every twinkle sits where it sat last frame whatever order frames are drawn in.
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  function sparkle(x, y, r) {
    // A four-point star: two thin crossing diamonds.
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.closePath();
  }

  // Splits words into two balanced lines, measured in the current font.
  function twoLines(text) {
    var words = text.split(/\s+/).filter(Boolean);
    if (words.length < 2) return [text];
    var best = 1, bestDiff = Infinity;
    for (var i = 1; i < words.length; i++) {
      var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      var diff = Math.abs(ctx.measureText(a).width - ctx.measureText(b).width);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
  }

  // The fallback: the name in warm italic serif, centred in the logo's box and fitted to it by
  // measurement; two balanced lines when one line would shrink the type past half its size.
  function wordmark(text, box, color) {
    text = (text || '').trim();
    if (!text) return;
    var prefix = 'italic 700 ';
    var maxW = box.width * 0.92;
    var size = box.height * 0.42;
    ctx.font = prefix + size + 'px ' + SERIF;
    var w = ctx.measureText(text).width;
    var lines = [text];
    var fit = w > maxW ? size * maxW / w : size;
    if (fit < size * 0.5 && text.indexOf(' ') > 0) {
      lines = twoLines(text);
      size = box.height * 0.3;
      fit = size;
      ctx.font = prefix + size + 'px ' + SERIF;
      for (var i = 0; i < lines.length; i++) {
        var lw = ctx.measureText(lines[i]).width;
        if (lw > maxW) fit = Math.min(fit, size * maxW / lw);
      }
    }
    size = Math.max(8, Math.floor(fit));
    ctx.font = prefix + size + 'px ' + SERIF;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    var lineH = size * 1.1;
    var y0 = box.y + box.height / 2 - (lines.length - 1) * lineH / 2;
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], box.x + box.width / 2, y0 + j * lineH + size * 0.04);
  }

  // Image slot: the chosen logo in the box, or the name as a wordmark in the same box.
  function drawLogo(state, box, color) {
    var drawn = window.pulpDrawImage ? window.pulpDrawImage(ctx, state, 'logo', box) : false;
    if (drawn) return;
    var slot = state.images && state.images.logo;
    wordmark((slot && slot.fallback) || state.params.name, box, color);
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time;
    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    var short = Math.min(W, H);

    // The ground is part of the ident: deep plum with the set's vignette.
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.ground;
    ctx.fillRect(0, 0, W, H);
    var v = ctx.createRadialGradient(cx, cy, short * 0.4, cx, cy, short);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Where the logo rests: a box about the centre that reads the same tall, square and wide.
    var box = { width: Math.min(500 * s, W * 0.8), height: 324 * s };

    // Beats: the bloom swells 0 to 0.9 s and its twinkles fly to 1.1 s, the logo blooms up 0.35 to
    // 1.1 s, a few twinkles settle around it from 0.9 s, and everything fades 2.4 to 3 s.
    var swell = easeOutCubic(clamp01(t / 0.9));
    var fly = clamp01(t / 1.1);
    var bloom = clamp01((t - 0.35) / 0.75);
    var fade = 1 - easeInOutSine(clamp01((t - 2.4) / 0.6));
    if (fade <= 0) return;

    // The glow: bright and tight as it opens, then a soft halo that stays behind the mark.
    var radius = short * (0.08 + 0.42 * swell);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, p.text);
    g.addColorStop(0.25, p.gold);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = fade * (0.18 + 0.72 * (1 - swell));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, TAU);
    ctx.fill();

    // The bloom's twinkles ride rays out from the centre, each pulsing on its own clock, and are
    // spent by the time the logo has settled.
    var n = Math.round(p.twinkles);
    var spent = Math.pow(1 - fly, 1.3);
    for (var i = 0; i < n && spent > 0; i++) {
      var angle = hash(i * 3 + 1) * TAU;
      var reach = (0.2 + hash(i * 3 + 2) * 0.8) * short * 0.5;
      var dist = reach * easeOutCubic(fly);
      var x = cx + Math.cos(angle) * dist, y = cy + Math.sin(angle) * dist;
      var size = (7 + hash(i * 3 + 3) * 20) * s;
      var pulse = 0.5 + 0.5 * Math.sin(t * TAU * (1.5 + hash(i + 77) * 2) + hash(i + 11) * TAU);
      ctx.globalAlpha = fade * spent * (0.5 + 0.5 * pulse);
      ctx.fillStyle = dist < radius * 0.5 ? p.text : p.gold;
      sparkle(x, y, size * (0.7 + 0.5 * pulse));
      ctx.fill();
    }

    // Seven twinkles settle in a loose ring around the mark, each popping in on its own beat.
    for (var j = 0; j < 7; j++) {
      var at = 0.9 + hash(j + 200) * 0.7;
      var pop = easeOutBack(clamp01((t - at) / 0.35));
      if (pop <= 0) continue;
      var a = (j / 7) * TAU + hash(j + 300) * 0.6;
      var rx = box.width * 0.56 + hash(j + 400) * 50 * s, ry = box.height * 0.6 + hash(j + 500) * 50 * s;
      var tx = cx + Math.cos(a) * rx, ty = cy + Math.sin(a) * ry;
      var tsz = (9 + hash(j + 600) * 10) * s;
      var tw = 0.65 + 0.35 * Math.sin(t * TAU * (1 + hash(j + 700)) + hash(j + 800) * TAU);
      ctx.globalAlpha = fade * tw;
      ctx.fillStyle = p.gold;
      sparkle(tx, ty, tsz * Math.max(0, pop) * (0.8 + 0.3 * tw));
      ctx.fill();
    }

    // The logo blooms up through the glow with a little bounce and breathes out a touch on the fade.
    if (bloom <= 0) return;
    var scale = (0.4 + 0.6 * easeOutBack(bloom)) * (1 - 0.06 * (1 - fade));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.globalAlpha = fade * clamp01(bloom * 3);
    drawLogo(state, { x: -box.width / 2, y: -box.height / 2, width: box.width, height: box.height }, p.text);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
