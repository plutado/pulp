<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival lower third</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var SERIF = 'Georgia, Times New Roman, serif';
  var SANS = 'Helvetica Neue, Arial, sans-serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInCubic(x) { return x * x * x; }
  function lcg(seed) {
    var x = seed >>> 0;
    return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  }

  function pill(x, y, w, h) {
    var r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = (t < dur ? easeOutBack(inT) : 1) * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame keeps the bottom 22% for captions and the right 18% for controls, so the
    // pill sits with its baseline near 72% of the height and stays inside 82% of the width.
    var tall = H > W * 1.3;
    var margin = tall ? 0.06 * W : 110 * s;
    var nameSize = 54 * s, subSize = 28 * s;
    var padX = 52 * s;
    var pillH = 148 * s;
    // Image slot: a round badge in the pill's head when a logo is chosen; the type moves over to
    // make room. With no logo the slot falls back to the name, which the pill already carries.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    var badge = hasLogo ? pillH - 2 * 14 * s : 0;
    var headX = hasLogo ? 14 * s + badge + 28 * s : padX;
    ctx.font = 'italic 700 ' + nameSize + 'px ' + SERIF;
    var nameW = ctx.measureText(p.name).width;
    ctx.font = '400 ' + subSize + 'px ' + SANS;
    var subW = ctx.measureText(p.subtitle).width;
    // Shrink the type when it would run past the frame's safe width.
    var maxTextW = (tall ? 0.82 : 0.9) * W - margin - headX - padX;
    var fit = maxTextW / Math.max(nameW, subW);
    if (fit < 1) {
      nameSize *= fit; subSize *= fit;
      ctx.font = 'italic 700 ' + nameSize + 'px ' + SERIF;
      nameW = ctx.measureText(p.name).width;
      ctx.font = '400 ' + subSize + 'px ' + SANS;
      subW = ctx.measureText(p.subtitle).width;
    }
    var pillW = Math.max(nameW, subW) + headX + padX;
    var y = tall ? 0.72 * H - pillH : H - margin - pillH;

    // The pill scales up around its left-center with a gentle bounce.
    var grow = Math.min(show, 1) + Math.max(0, show - 1);
    ctx.save();
    ctx.translate(margin, y + pillH / 2);
    ctx.scale(grow, grow);
    ctx.translate(-margin, -(y + pillH / 2));

    pill(margin, y, pillW, pillH);
    ctx.fillStyle = p.panel;
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = p.gold;
    ctx.stroke();

    var textA = clamp01((show - 0.35) / 0.65);
    if (hasLogo) {
      // The badge rides the pill: same bounce, same fade as the type.
      ctx.save();
      ctx.globalAlpha = textA;
      ctx.beginPath();
      ctx.arc(margin + 14 * s + badge / 2, y + pillH / 2, badge / 2, 0, TAU);
      ctx.clip();
      window.pulpDrawImage(ctx, state, 'logo', { x: margin + 14 * s, y: y + 14 * s, width: badge, height: badge });
      ctx.restore();
    }
    ctx.globalAlpha = textA;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = p.text;
    ctx.font = 'italic 700 ' + nameSize + 'px ' + SERIF;
    ctx.fillText(p.name, margin + headX, y + 66 * s);
    ctx.fillStyle = p.gold;
    ctx.font = '400 ' + subSize + 'px ' + SANS;
    ctx.fillText(p.subtitle, margin + headX, y + 112 * s);
    ctx.globalAlpha = 1;
    ctx.restore();

    // A few confetti dots rise and sway beside the pill, each on its own deterministic phase.
    if (p.confetti) {
      var rand = lcg(2026);
      for (var i = 0; i < 10; i++) {
        var baseX = margin + rand() * pillW;
        var speed = 40 + rand() * 60;
        var phase = rand() * TAU;
        var size = (4 + rand() * 5) * s;
        var cy = y - 20 * s - ((t * speed * s + rand() * 200 * s) % (260 * s));
        var cx = baseX + Math.sin(t * 1.4 + phase) * 18 * s;
        var da = clamp01((y - 20 * s - cy) / (260 * s));
        ctx.globalAlpha = textA * (1 - da) * 0.9;
        ctx.fillStyle = rand() > 0.5 ? p.gold : p.text;
        ctx.beginPath();
        ctx.arc(cx, cy, size / 2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
