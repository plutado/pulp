<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival lower third</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var SERIF = 'Georgia, Times New Roman, serif';
  var SANS = 'Helvetica Neue, Arial, sans-serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInCubic(x) { return x * x * x; }
  function lcg(seed) {
    var x = seed >>> 0;
    return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  }

  function pill(x, y, w, h) {
    var r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = (t < dur ? easeOutBack(inT) : 1) * (1 - outT);
    if (show <= 0) return;

    var s = H / 1080;
    var margin = 110 * s;
    var nameSize = 54 * s, subSize = 28 * s;
    ctx.font = 'italic 700 ' + nameSize + 'px ' + SERIF;
    var nameW = ctx.measureText(p.name).width;
    ctx.font = '400 ' + subSize + 'px ' + SANS;
    var subW = ctx.measureText(p.subtitle).width;
    var padX = 52 * s;
    var pillW = Math.max(nameW, subW) + padX * 2;
    var pillH = 148 * s;
    var y = H - margin - pillH;

    // The pill scales up around its left-center with a gentle bounce.
    var grow = Math.min(show, 1) + Math.max(0, show - 1);
    ctx.save();
    ctx.translate(margin, y + pillH / 2);
    ctx.scale(grow, grow);
    ctx.translate(-margin, -(y + pillH / 2));

    pill(margin, y, pillW, pillH);
    ctx.fillStyle = p.panel;
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = p.gold;
    ctx.stroke();

    var textA = clamp01((show - 0.35) / 0.65);
    ctx.globalAlpha = textA;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = p.text;
    ctx.font = 'italic 700 ' + nameSize + 'px ' + SERIF;
    ctx.fillText(p.name, margin + padX, y + 66 * s);
    ctx.fillStyle = p.gold;
    ctx.font = '400 ' + subSize + 'px ' + SANS;
    ctx.fillText(p.subtitle, margin + padX, y + 112 * s);
    ctx.globalAlpha = 1;
    ctx.restore();

    // A few confetti dots rise and sway beside the pill, each on its own deterministic phase.
    if (p.confetti) {
      var rand = lcg(2026);
      for (var i = 0; i < 10; i++) {
        var baseX = margin + rand() * pillW;
        var speed = 40 + rand() * 60;
        var phase = rand() * TAU;
        var size = (4 + rand() * 5) * s;
        var cy = y - 20 * s - ((t * speed * s + rand() * 200 * s) % (260 * s));
        var cx = baseX + Math.sin(t * 1.4 + phase) * 18 * s;
        var da = clamp01((y - 20 * s - cy) / (260 * s));
        ctx.globalAlpha = textA * (1 - da) * 0.9;
        ctx.fillStyle = rand() > 0.5 ? p.gold : p.text;
        ctx.beginPath();
        ctx.arc(cx, cy, size / 2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
