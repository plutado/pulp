<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival sparkle flash</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  function sparkle(x, y, r) {
    // A four-point star: two thin crossing diamonds.
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time;
    ctx.clearRect(0, 0, W, H);

    var s = Math.min(W, H) / 1080;
    var pr = state.progress;
    var ox = W / 2, oy = H / 2;
    if (p.origin === 'top-left') { ox = 0; oy = 0; }
    else if (p.origin === 'top-right') { ox = W; oy = 0; }
    else if (p.origin === 'bottom-left') { ox = 0; oy = H; }
    else if (p.origin === 'bottom-right') { ox = W; oy = H; }
    // The farthest corner sets the radius that covers everything.
    var far = Math.sqrt(Math.max(ox, W - ox) * Math.max(ox, W - ox) + Math.max(oy, H - oy) * Math.max(oy, H - oy));

    // Swell to full cover by the midpoint, then fade out while holding the size.
    var swell = Math.pow(clamp01(pr * 2), 1.7);
    var fade = 1 - easeInOutSine(clamp01(pr * 2 - 1));
    if (fade <= 0) return;
    var radius = far * (1.08 * swell + 0.02);

    var g = ctx.createRadialGradient(ox, oy, 0, ox, oy, radius);
    g.addColorStop(0, p.core);
    g.addColorStop(0.45, p.core);
    g.addColorStop(0.75, p.gold);
    g.addColorStop(1, p.gold);
    ctx.globalAlpha = fade;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ox, oy, radius, 0, TAU);
    ctx.fill();

    // Twinkles burst out from the origin; each one rides a ray and pulses on its own clock.
    var burst = clamp01(pr * 1.6);
    var n = Math.round(p.twinkles);
    for (var i = 0; i < n; i++) {
      var angle = hash(i * 3 + 1) * TAU;
      var reach = (0.2 + hash(i * 3 + 2) * 0.9) * far;
      var dist = reach * easeOutCubic(burst);
      var x = ox + Math.cos(angle) * dist;
      var y = oy + Math.sin(angle) * dist;
      var size = (8 + hash(i * 3 + 3) * 22) * s;
      var pulse = 0.5 + 0.5 * Math.sin(t * TAU * (1.5 + hash(i + 77) * 2) + hash(i + 11) * TAU);
      var a = fade * (0.55 + 0.45 * pulse);
      // Ahead of the bloom's edge the twinkles are gold; inside it they read pale against the gold.
      ctx.fillStyle = dist > radius ? p.gold : p.core;
      ctx.globalAlpha = a;
      sparkle(x, y, size * (0.7 + 0.5 * pulse));
      ctx.fill();
      ctx.globalAlpha = a * 0.35;
      ctx.beginPath();
      ctx.arc(x, y, size * 0.35, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
