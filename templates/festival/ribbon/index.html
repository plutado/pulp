<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival ribbon</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  function sparkle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var show = easeOutCubic(clamp01(t / dur)) * (1 - easeInCubic(clamp01((t - (d - dur)) / dur)));
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var top = p.edge === 'top';
    var dirY = top ? 1 : -1; // inward
    var edgeY = top ? 0 : H;
    var thick = 84 * s;
    var amp = (10 + 34 * p.wave) * s;
    var wavelength = Math.max(W, H) * 0.42;
    // The ribbon's inner edge rises out of the frame edge as it fades in and sinks back as it leaves;
    // its outer edge sits beyond the frame so there is never a gap along the border.
    var inner = edgeY + dirY * (thick * show);
    var outer = edgeY - dirY * thick;
    var steps = Math.ceil(W / (8 * s)) + 1;

    function waveY(x, phase, k) {
      return Math.sin(x / wavelength * TAU + t * 1.1 + phase) * amp * k;
    }

    function ribbon(offsetIn, phase, color, alphaK) {
      ctx.globalAlpha = show * alphaK;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, outer);
      for (var i = 0; i <= steps; i++) {
        var x = i * W / steps;
        ctx.lineTo(x, inner + dirY * offsetIn + waveY(x, phase, 1));
      }
      ctx.lineTo(W, outer);
      ctx.closePath();
      ctx.fill();
    }
    // A deeper band a little further in, then the ribbon itself.
    ribbon(14 * s, 0.9, p.gold, 0.45);
    ribbon(0, 0, p.gold, 1);

    // A thin highlight line riding just inside the ribbon's edge.
    ctx.globalAlpha = show * 0.85;
    ctx.strokeStyle = p.second;
    ctx.lineWidth = Math.max(1, 3 * s);
    ctx.beginPath();
    for (var m = 0; m <= steps; m++) {
      var hx = m * W / steps;
      var hy = inner - dirY * 14 * s + waveY(hx, 0, 1);
      if (m === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.stroke();

    // Twinkles drifting just inward of the ribbon, each on its own slow blink.
    var n = 22;
    for (var k = 0; k < n; k++) {
      var tx = hash(k * 4 + 1) * W;
      var lift = (24 + hash(k * 4 + 2) * 150) * s;
      var ty = inner + dirY * lift + waveY(tx, 0.4, 0.6) + Math.sin(t * 0.8 + k) * 6 * s;
      var size = (5 + hash(k * 4 + 3) * 12) * s;
      var blink = 0.5 + 0.5 * Math.sin(t * TAU / (2 + hash(k * 4) * 3) + hash(k + 50) * TAU);
      ctx.globalAlpha = show * (0.25 + 0.75 * blink);
      ctx.fillStyle = hash(k + 300) > 0.5 ? p.gold : p.second;
      sparkle(tx, ty, size * (0.6 + 0.4 * blink));
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
