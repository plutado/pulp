<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival background</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function lcg(seed) {
    var x = seed >>> 0;
    return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    var s = Math.min(W, H) / 1080;

    var g = ctx.createRadialGradient(W / 2, H * 0.72, H * 0.1, W / 2, H / 2, H);
    g.addColorStop(0, p.base);
    g.addColorStop(1, p.deep);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // A warm hearth glow low in the frame.
    var warm = ctx.createRadialGradient(W / 2, H * 1.05, 0, W / 2, H * 1.05, H * 0.8);
    warm.addColorStop(0, p.gold);
    warm.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = p.glow * 0.5;
    ctx.fillStyle = warm;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // Bokeh rises on whole cycles per loop, each dot with its own lane, size, depth and sway.
    var rand = lcg(1912);
    var count = Math.round(p.amount);
    for (var i = 0; i < count; i++) {
      var lane = rand() * W;
      var size = (8 + rand() * 42) * s;
      var cycles = 1 + Math.floor(rand() * 2);
      var offset = rand();
      var span = H + size * 4;
      var yy = H + size * 2 - ((state.progress * cycles + offset) % 1) * span;
      var sway = Math.sin(state.progress * TAU * cycles + rand() * TAU) * 30 * s;
      var depth = 0.15 + rand() * 0.5;
      ctx.globalAlpha = p.glow * depth;
      ctx.fillStyle = p.gold;
      ctx.beginPath();
      ctx.arc(lane + sway, yy, size, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var short = Math.min(W, H);
    var v = ctx.createRadialGradient(W / 2, H / 2, short * 0.4, W / 2, H / 2, short);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
