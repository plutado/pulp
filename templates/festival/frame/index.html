<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival frame</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  // A four-point star: two thin crossing diamonds.
  function star(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.18, y - r * 0.18); ctx.lineTo(x + r, y);
    ctx.lineTo(x + r * 0.18, y + r * 0.18); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.18, y + r * 0.18);
    ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.18, y - r * 0.18);
    ctx.closePath();
  }

  // The rounded rectangle as a path that starts at the top centre and runs clockwise.
  function framePath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.lineTo(x + w / 2, y);
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutCubic(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var fade = 1 - outT;
    if (fade <= 0) return;

    var s = Math.min(W, H) / 1080;
    var m = p.margin * s, w = Math.max(1, p.weight * s);
    var fw = W - m * 2, fh = H - m * 2;
    var r = Math.min(p.radius * s, fw / 2, fh / 2);
    var L = 2 * (fw - 2 * r) + 2 * (fh - 2 * r) + TAU * r;

    // The frame draws from the top centre around both sides at once; the two halves meet at the bottom.
    var half = (L / 2) * inT;
    ctx.globalAlpha = fade;
    ctx.strokeStyle = p.gold;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    framePath(m, m, fw, fh, r);
    if (half > 0.5) {
      ctx.setLineDash([half, L - half]);
      ctx.lineDashOffset = 0;
      ctx.stroke();
      ctx.lineDashOffset = half;
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // A thin inner echo of the frame, a little later and much fainter.
    var inner = 10 * s;
    ctx.globalAlpha = fade * 0.35 * clamp01(inT * 1.4 - 0.4);
    ctx.lineWidth = Math.max(1, w * 0.35);
    framePath(m + inner, m + inner, fw - inner * 2, fh - inner * 2, Math.max(0, r - inner));
    ctx.stroke();

    // Twinkles at the corners, each arriving as the line reaches it, then glittering.
    var corners = [[W - m, m], [m, m], [W - m, H - m], [m, H - m]];
    var arrive = [0.3, 0.3, 0.8, 0.8];
    for (var c = 0; c < 4; c++) {
      var seen = clamp01((inT - arrive[c]) / 0.2);
      if (seen <= 0) continue;
      var cx = corners[c][0], cy = corners[c][1];
      var dx = cx < W / 2 ? 1 : -1, dy = cy < H / 2 ? 1 : -1;
      for (var i = 0; i < 5; i++) {
        var k = c * 7 + i;
        var ox = (hash(k) * 70 - 10) * s * dx, oy = (hash(k + 100) * 70 - 10) * s * dy;
        var size = (5 + hash(k + 200) * 11) * s * (i === 0 ? 1.6 : 1);
        var twinkle = 0.5 + 0.5 * Math.sin(t * (1.5 + hash(k + 300) * 2.5) * TAU / 2 + hash(k + 400) * TAU);
        ctx.globalAlpha = fade * seen * twinkle;
        ctx.fillStyle = i % 2 === 0 ? p.gold : p.second;
        star(cx + ox * (0.4 + 0.6 * seen), cy + oy * (0.4 + 0.6 * seen), size);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
