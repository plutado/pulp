<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival confetti burst</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInCubic(x) { return x * x * x; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var fade = 1 - easeInCubic(clamp01((t - (d - dur)) / dur));
    if (fade <= 0) return;

    var s = Math.min(W, H) / 1080;
    var ox = W / 2, oy = H + 10 * s, aim = -Math.PI / 2;
    if (p.origin === 'center') { oy = H / 2; }
    else if (p.origin === 'top') { oy = -10 * s; aim = Math.PI / 2; }
    else if (p.origin === 'bottom-left') { ox = -10 * s; aim = -Math.PI / 4; }
    else if (p.origin === 'bottom-right') { ox = W + 10 * s; aim = -Math.PI * 3 / 4; }

    var spread = p.spread * Math.PI / 180;
    var reach = Math.max(W, H);
    var g = reach * 0.9;        // gravity, px/s^2, scaled to the frame
    var drag = 1.6;             // air drag; pieces slow quickly then drift down
    var colors = [p.gold, p.first, p.second, p.gold];

    for (var i = 0; i < p.amount; i++) {
      var h0 = hash(i), h1 = hash(i + 1000), h2 = hash(i + 2000), h3 = hash(i + 3000);
      var h4 = hash(i + 4000), h5 = hash(i + 5000), h6 = hash(i + 6000);
      var delay = h0 * 0.35;
      var tt = t - delay;
      if (tt <= 0) continue;
      var angle = aim + (h1 - 0.5) * spread;
      var speed = reach * (0.55 + h2 * 0.9);
      // Velocity decays with drag; gravity pulls down, limited by a terminal fall speed.
      var k = (1 - Math.exp(-drag * tt)) / drag;
      var x = ox + Math.cos(angle) * speed * k + Math.sin(tt * (2 + h3 * 3) + h4 * TAU) * 14 * s * tt;
      var y = oy + Math.sin(angle) * speed * k + Math.min(0.5 * g * tt * tt, reach * 0.22 * tt);
      if (y > H + 40 * s || x < -40 * s || x > W + 40 * s) continue;

      var size = (9 + h5 * 11) * s;
      var spin = tt * (3 + h6 * 6) * (h3 > 0.5 ? 1 : -1);
      var tumble = Math.cos(spin * 1.3 + h0 * TAU);     // the piece turning over: a squash on one axis
      var alpha = fade * clamp01(tt * 6);
      // Pieces born late are slightly smaller and fainter, as if further away.
      alpha *= 0.75 + 0.25 * (1 - h0);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(spin + h1 * TAU);
      ctx.scale(1, Math.max(0.12, Math.abs(tumble)));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = colors[i % 4];
      if (h4 < 0.25) {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.55, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillRect(-size / 2, -size * 0.32, size, size * 0.64);
      }
      // A lighter lip on the piece as it turns, so the flip reads.
      if (tumble < 0) {
        ctx.globalAlpha = alpha * 0.35;
        ctx.fillStyle = '#fff6e8';
        ctx.fillRect(-size / 2, -size * 0.32, size, size * 0.2);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
