<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Festival title</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Festival sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var SERIF = 'Georgia, Times New Roman, serif';
  var SANS = 'Helvetica Neue, Arial, sans-serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function lcg(seed) {
    var x = seed >>> 0;
    return function () { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  }

  // Greedy word wrap with the current font; ok is false when a single word is wider than maxW.
  function wrapWords(text, maxW) {
    var words = text.split(/\s+/).filter(Boolean), lines = [], line = '', ok = true;
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (!line || ctx.measureText(test).width <= maxW) line = test;
      else { lines.push(line); line = words[i]; }
      if (ctx.measureText(line).width > maxW) ok = false;
    }
    if (line) lines.push(line);
    return { lines: lines, ok: ok };
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var show = easeOutCubic(clamp01(t / dur)) * (1 - easeInCubic(clamp01((t - (d - dur)) / dur)));
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame keeps its bottom 22% for captions, so the block sits a little above the middle
    // and the headline wraps onto up to three lines inside 86% of the width.
    var tall = H > W * 1.3;
    var cx = W / 2, cy = tall ? H * 0.44 : H / 2;
    var headSize = 104 * s;
    var wrapped;
    for (var k = 0; k < 12; k++) {
      ctx.font = 'italic 700 ' + headSize + 'px ' + SERIF;
      wrapped = wrapWords(p.headline || '', 0.86 * W);
      if (wrapped.ok && wrapped.lines.length <= 3) break;
      headSize *= 0.92;
    }
    var lines = wrapped.lines, n = Math.max(1, lines.length), lineH = 116 * s;
    var ext = (n - 1) * lineH / 2; // how far the extra lines push the kicker and arcs outward

    // Soft bokeh dots float up behind the words.
    var rand = lcg(451);
    for (var i = 0; i < 14; i++) {
      var bx = (0.2 + rand() * 0.6) * W;
      var size = (10 + rand() * 26) * s;
      var speed = 18 + rand() * 30;
      var phase = rand() * TAU;
      var by = cy + 180 * s - ((t * speed * s + rand() * 400 * s) % (420 * s));
      ctx.globalAlpha = show * 0.18 * (0.4 + rand() * 0.6);
      ctx.fillStyle = p.gold;
      ctx.beginPath();
      ctx.arc(bx + Math.sin(t + phase) * 12 * s, by, size, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Two gold arcs bow away from the headline as they draw in.
    var sweep = easeOutCubic(clamp01(show * 1.2)) * 0.42 * Math.PI;
    var r = 420 * s;
    ctx.strokeStyle = p.gold;
    ctx.lineWidth = 3 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy + r - 108 * s - ext, r, -Math.PI / 2 - sweep / 2, -Math.PI / 2 + sweep / 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy - r + 108 * s + ext, r, Math.PI / 2 - sweep / 2, Math.PI / 2 + sweep / 2);
    ctx.stroke();

    var textA = clamp01((show - 0.3) / 0.7);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = textA;
    ctx.fillStyle = p.gold;
    ctx.font = '400 ' + 32 * s + 'px ' + SANS;
    ctx.fillText((p.kicker || '').toUpperCase().split('').join(' '), cx, cy - 64 * s - ext);
    ctx.fillStyle = p.text;
    ctx.font = 'italic 700 ' + headSize + 'px ' + SERIF;
    for (var li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], cx, cy + 22 * s + (li - (n - 1) / 2) * lineH);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
