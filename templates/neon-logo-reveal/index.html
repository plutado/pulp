<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon Ident</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Neon Ident, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The stutter ends at 1.0 s and the sign burns steady; the ident then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 4.2) / 0.8));
    ctx.fillStyle = rgba(p.wall, 1); ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    // The stutter ends at 1.0 s; from then the sign burns steady.
    var lit = t >= 1.0 ? 1 : (at(Math.floor(t * 20)) > 0.4 ? 1 : 0.12);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var size = Math.min(W * 1.5 / Math.max(6, String(p.name).length), H * 0.2);
    ctx.font = '700 ' + Math.round(size) + 'px Montserrat';
    var cy = H * 0.44;
    // The glow passes, widest first.
    for (var pass = 0; pass < 3; pass++) {
      ctx.globalAlpha = (1 - gone) * [0.2, 0.45, 1][pass] * lit;
      ctx.lineWidth = [size * 0.12, size * 0.05, size * 0.02][pass];
      ctx.strokeStyle = rgba(p.tube, 1);
      ctx.strokeText(String(p.name), W / 2, cy);
    }
    ctx.globalAlpha = (1 - gone) * lit;
    ctx.fillStyle = 'rgba(240,252,255,0.95)';
    ctx.fillText(String(p.name), W / 2, cy);
    // The reflection: the sign mirrored into the wet floor, faded and squashed.
    ctx.save();
    ctx.translate(0, cy + size * 0.95);
    ctx.scale(1, -0.55);
    ctx.translate(0, -cy);
    ctx.globalAlpha = (1 - gone) * lit * 0.16;
    ctx.fillStyle = rgba(p.tube, 1);
    ctx.fillText(String(p.name), W / 2, cy);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
