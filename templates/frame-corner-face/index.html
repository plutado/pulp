<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frame Corner Face</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Frame Corner Face, made for vertical for Pulp (milestone 65; docs/vertical-layouts.md). CC0-1.0: no rights reserved.
  //
  // A face over a full-frame clip, in the top-left corner under the header strip, away from the
  // controls down the right. The face is a video layer — milestone 57's second picture track — so it
  // is placed, sized, cropped and timed like any clip layer; with none chosen a soft placeholder holds
  // its place. Its name sits under it. Still words, so it loops for any length.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  document.fonts.load('800 64px Montserrat');
  document.fonts.load('900 64px Montserrat');
  document.fonts.load('600 64px Inter');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function fit(state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    ctx.clearRect(0, 0, state.width, state.height);
  }
  function roundRect(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /** The extent of a laid block's drawn words: left, top, right and bottom over every layer that has room. */
  function extentOf(laid) {
    var e = null;
    laid.layers.forEach(function (l) {
      if (l.box.width <= 0 && l.box.height <= 0) return;
      var left = l.box.x, right = l.box.x + l.box.width;
      if (l.lines && l.lines.length) {
        left = Infinity; right = -Infinity;
        l.lines.forEach(function (ln) { if (ln.width > 0) { left = Math.min(left, ln.x); right = Math.max(right, ln.x + ln.width); } });
        if (!isFinite(left)) return;
      }
      if (!e) e = { left: left, top: l.box.y, right: right, bottom: l.box.y + l.box.height };
      else { e.left = Math.min(e.left, left); e.top = Math.min(e.top, l.box.y); e.right = Math.max(e.right, right); e.bottom = Math.max(e.bottom, l.box.y + l.box.height); }
    });
    return e;
  }
  /** One line of text in a bundled family, drawn and measured the same way. */
  function setFont(weight, size, family) { ctx.font = weight + ' ' + Math.round(size) + 'px ' + family; }

  window.pulpRender = function (state) {
    fit(state);
    var W = state.width, H = state.height, p = state.params, u = Math.min(W, H);
    if (!window.pulpDrawMedia(ctx, state, 'scene')) { ctx.fillStyle = p.sceneColor; ctx.fillRect(0, 0, W, H); }
    var laid = window.pulpLayoutBlock(ctx, state, 'corner', {});
    var face = laid.layers.filter(function (l) { return l.id === 'face' && l.box.width > 0 && l.box.height > 0; })[0];
    var box = face ? face.box : { x: laid.box.x, y: laid.box.y, width: 0.3 * u, height: 0.3 * u };
    if (face) {
      window.pulpDrawBlock(ctx, laid);
    } else {
      // Where the face goes, until one is chosen: a rounded well with a head and shoulders.
      roundRect(box.x, box.y, box.width, box.height, 0.03 * u);
      ctx.fillStyle = rgba('#ffffff', 0.16);
      ctx.fill();
      ctx.strokeStyle = p.ring;
      ctx.lineWidth = Math.max(2, 0.006 * u);
      ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', 0.4);
      ctx.beginPath();
      ctx.arc(box.x + box.width / 2, box.y + box.height * 0.4, box.height * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(box.x + box.width / 2, box.y + box.height * 0.92, box.width * 0.32, box.height * 0.26, 0, Math.PI, 0);
      ctx.fill();
    }
    if (p.name) {
      var size = 0.042 * u;
      setFont(700, size, 'Inter');
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = size * 0.3;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(p.name, box.x, box.y + box.height + size * 1.35);
      ctx.shadowColor = 'rgba(0,0,0,0)';
    }
  };
</script>
</body>
</html>
