<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scanlines</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  // The same colour at zero alpha, so gradients fade without passing through dark grey.
  function clear(hex) {
    return 'rgba(' + parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' + parseInt(hex.slice(5, 7), 16) + ',0)';
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    var s = Math.min(W, H) / 1080;
    var phase = state.progress * TAU;

    // Base with a cool glow from the centre, a touch of the line colour in it.
    ctx.fillStyle = p.background;
    ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    glow.addColorStop(0, p.line);
    glow.addColorStop(1, clear(p.line));
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // The faint grid: large cells, hairline, breathing very slightly with the loop.
    if (p.grid) {
      var cell = 120 * s;
      ctx.strokeStyle = p.line;
      ctx.lineWidth = 1 * s;
      ctx.globalAlpha = 0.07 + 0.02 * Math.sin(phase);
      ctx.beginPath();
      var ox = (W % cell) / 2, oy = (H % cell) / 2;
      for (var gx = ox; gx <= W; gx += cell) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
      for (var gy = oy; gy <= H; gy += cell) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // The rolling band: a soft bright bar that travels down and wraps a whole number of times.
    var passes = Math.round(p.bandSpeed);
    if (passes > 0) {
      var bandH = H * 0.22;
      var travel = (state.progress * passes) % 1;
      var by = travel * (H + bandH) - bandH;
      var band = ctx.createLinearGradient(0, by, 0, by + bandH);
      band.addColorStop(0, clear(p.line));
      band.addColorStop(0.5, p.line);
      band.addColorStop(1, clear(p.line));
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = band;
      ctx.fillRect(0, by, W, bandH);
      ctx.globalAlpha = 1;
    }

    // Scanlines: dark lines every pitch, so the gaps between them read as the lit rows.
    var pitch = Math.max(2, Math.round(p.pitch * s));
    var thick = Math.max(1, Math.round(pitch * 0.45));
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    for (var y = 0; y < H; y += pitch) ctx.fillRect(0, y, W, thick);

    // Vignette to settle the corners.
    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
