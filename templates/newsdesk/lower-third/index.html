<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk lower third</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22; // the slash motif: horizontal run per vertical unit

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  function slashPath(x, y, w, h) {
    var k = h * SLANT;
    ctx.beginPath();
    ctx.moveTo(x + k, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - k, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutQuart(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame (9:16) re-lays the unit: above the caption band (bottom 22%),
    // clear of the controls column (right 18%), left margin 0.06 W.
    var tall = H > W * 1.4;
    var margin = tall ? 0.06 * W : 96 * s;
    var barH = 118 * s, capW = 46 * s;
    var nameSize = 54 * s, topicSize = 28 * s;
    var y = tall ? H * 0.72 - barH : H - margin - barH;
    var padX = 40 * s;
    // The text must fit inside the bar's room: 0.76 W on a tall frame, 0.9 W elsewhere (a no-op at 16:9).
    var maxTextW = (tall ? 0.82 * W : 0.9 * W) - margin - capW - padX * 2 - barH * SLANT;
    // A chosen logo is a square badge in the panel's head, before the name; the panel grows to hold
    // it and the text moves over. With no logo the slot falls back to the name, which the bar already
    // carries, so nothing changes.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    var badge = hasLogo ? barH - 32 * s : 0;
    var badgeGap = hasLogo ? 24 * s : 0;
    maxTextW -= badge + badgeGap;

    ctx.font = '800 ' + nameSize + 'px ' + FONT;
    var nameText = (p.name || '').toUpperCase();
    var nameW = ctx.measureText(nameText).width;
    if (nameW > maxTextW) {
      nameSize = Math.max(18 * s, nameSize * maxTextW / nameW);
      ctx.font = '800 ' + nameSize + 'px ' + FONT;
      nameW = ctx.measureText(nameText).width;
    }
    ctx.font = '500 ' + topicSize + 'px ' + FONT;
    var topicText = (p.topic || '').toUpperCase();
    var topicW = ctx.measureText(topicText).width;
    if (topicW > maxTextW) {
      topicSize = Math.max(14 * s, topicSize * maxTextW / topicW);
      ctx.font = '500 ' + topicSize + 'px ' + FONT;
      topicW = ctx.measureText(topicText).width;
    }
    var barW = Math.max(nameW, topicW) + padX * 2 + capW + badge + badgeGap;

    // The whole unit slides in from the left on a hard ease; it leaves the same way.
    var slide = (1 - show) * (barW + margin + barH * SLANT);
    var x = margin - slide;

    // Dark panel with a slashed leading cap in the accent.
    slashPath(x + capW, y, barW - capW, barH);
    ctx.fillStyle = p.panel;
    ctx.fill();
    slashPath(x, y, capW + barH * SLANT, barH);
    ctx.fillStyle = p.accent;
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var textX = x + capW + padX + badge + badgeGap;
    if (hasLogo) {
      // The badge rides the bar: it slides in and out with the panel.
      window.pulpDrawImage(ctx, state, 'logo', { x: x + capW + padX, y: y + 16 * s, width: badge, height: badge });
    }
    ctx.fillStyle = p.text;
    ctx.font = '800 ' + nameSize + 'px ' + FONT;
    ctx.fillText(nameText, textX, y + 52 * s);
    ctx.globalAlpha = 0.85;
    ctx.font = '500 ' + topicSize + 'px ' + FONT;
    ctx.fillText(topicText, textX, y + 94 * s);
    ctx.globalAlpha = 1;

    // The live flag sits on the bar's top edge and breathes on a deterministic pulse.
    if (p.live) {
      var pulse = 0.72 + 0.28 * Math.sin(state.time * Math.PI * 2);
      var flagH = 40 * s, flagW = 128 * s;
      var fy = y - flagH - 8 * s;
      slashPath(x + capW, fy, flagW, flagH);
      ctx.fillStyle = p.accent;
      ctx.fill();
      ctx.fillStyle = p.text;
      ctx.globalAlpha = pulse;
      ctx.font = '800 ' + 24 * s + 'px ' + FONT;
      ctx.fillText('L I V E', x + capW + 26 * s, fy + 28 * s);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
