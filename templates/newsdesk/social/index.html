<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk social strip</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22; // the slash motif: horizontal run per vertical unit

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  function slashPath(x, y, w, h) {
    var k = h * SLANT;
    ctx.beginPath();
    ctx.moveTo(x + k, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - k, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutQuart(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var margin = 96 * s;
    var stripH = 72 * s, capW = 40 * s, pad = 32 * s;
    var k = stripH * SLANT;
    var stripW = W - margin * 2;
    var y = H - margin - stripH;

    // Both texts share the strip; shrink them together if they would collide.
    var handle = (p.handle || '').toUpperCase();
    var hashtag = (p.hashtag || '').toUpperCase();
    var size = 30 * s;
    ctx.font = '800 ' + size + 'px ' + FONT;
    var hw = ctx.measureText(handle).width;
    ctx.font = '500 ' + size + 'px ' + FONT;
    var tw = ctx.measureText(hashtag).width;
    var avail = stripW - capW - k * 2 - pad * 3;
    if (hw + tw > avail && hw + tw > 0) size = Math.max(8, Math.floor(size * avail / (hw + tw)));

    // In from the left, out to the right: the slide is one hard move each way.
    var x = margin - (1 - inT) * (W + margin) + outT * (W + margin);

    // The dark strip with a slashed trailing end and a red slashed cap leading it.
    slashPath(x + capW, y, stripW - capW, stripH);
    ctx.fillStyle = p.panel;
    ctx.fill();
    slashPath(x, y, capW + k, stripH);
    ctx.fillStyle = p.accent;
    ctx.fill();

    // A thin red slash also cuts the strip near its right end, leading the hashtag.
    var sx = x + stripW - k - tw - pad * 2 - 14 * s;
    slashPath(sx, y, 8 * s, stripH);
    ctx.fill();

    ctx.textBaseline = 'middle';
    var textY = y + stripH / 2 + 2 * s;
    var textA = clamp01((inT - 0.6) / 0.4);
    ctx.globalAlpha = textA;
    ctx.fillStyle = p.text;
    ctx.textAlign = 'left';
    ctx.font = '800 ' + size + 'px ' + FONT;
    ctx.fillText(handle, x + capW + k + pad, textY);
    ctx.textAlign = 'right';
    ctx.globalAlpha = textA * 0.9;
    ctx.font = '500 ' + size + 'px ' + FONT;
    ctx.fillText(hashtag, x + stripW - k - pad, textY);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
