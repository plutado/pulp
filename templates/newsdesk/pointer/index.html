<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk pointer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22; // the slash motif: horizontal run per vertical unit

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }
  function easeOutBack(x) { var c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = clamp01((t - (d - dur)) / dur);
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var right = p.side === 'right';
    var barH = 96 * s;
    var tipW = barH * 0.75;      // the pointed slash-cut head
    var capW = 34 * s;           // the accent cap at the tail
    var k = barH * SLANT;
    var cy = H * p.y / 100;
    cy = Math.max(barH / 2 + 8 * s, Math.min(H - barH / 2 - 8 * s, cy));
    var y = cy - barH / 2;

    var size = 44 * s;
    ctx.font = '800 ' + size + 'px ' + FONT;
    var caps = (p.label || '').toUpperCase().split('').join(' ');
    var tw = ctx.measureText(caps).width;
    var padX = 32 * s;
    var reach = W * p.reach / 100;
    var barW = Math.max(reach, tw + padX * 2 + capW + tipW);
    barW = Math.min(barW, W - 16 * s);

    // The whole bar punches in from its own edge with a hard overshoot and snaps back out.
    var punch = easeOutBack(easeOutQuart(inT));
    var leave = easeInCubic(outT);
    var travel = barW + 20 * s;
    var offset = (1 - punch) * travel + leave * travel;

    // Lay the bar out in a local frame where it points to +x, then mirror for "left".
    ctx.save();
    if (right) {
      ctx.translate(-offset, 0);
    } else {
      ctx.translate(W + offset, 0);
      ctx.scale(-1, 1);
    }
    var x0 = 0; // tail sits flush with the edge

    // Panel: a slash-cut tail and a pointed head.
    ctx.beginPath();
    ctx.moveTo(x0 + capW, y);
    ctx.lineTo(x0 + barW - tipW, y);
    ctx.lineTo(x0 + barW, cy);
    ctx.lineTo(x0 + barW - tipW, y + barH);
    ctx.lineTo(x0 + capW - k, y + barH);
    ctx.closePath();
    ctx.fillStyle = p.panel;
    ctx.fill();

    // Accent cap at the tail, cut on the slash.
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + capW + k - 8 * s, y);
    ctx.lineTo(x0 + capW - 8 * s, y + barH);
    ctx.lineTo(x0, y + barH);
    ctx.closePath();
    ctx.fillStyle = p.accent;
    ctx.fill();

    // A thin accent slash near the head, flashing on a deterministic pulse as it lands.
    var flash = 0.55 + 0.45 * Math.max(0, Math.sin(t * Math.PI * 3));
    ctx.globalAlpha = flash * (1 - leave);
    ctx.beginPath();
    ctx.moveTo(x0 + barW - tipW - 10 * s, y + 10 * s);
    ctx.lineTo(x0 + barW - tipW + 2 * s, y + 10 * s);
    ctx.lineTo(x0 + barW - tipW - 6 * s + tipW * 0.85 - (barH - 20 * s) * 0.1, cy);
    ctx.lineTo(x0 + barW - tipW + 2 * s, y + barH - 10 * s);
    ctx.lineTo(x0 + barW - tipW - 10 * s, y + barH - 10 * s);
    ctx.lineTo(x0 + barW - tipW - 10 * s + tipW * 0.75, cy);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // Text is drawn unmirrored so it reads correctly on both sides.
    var textX = right ? capW + padX - offset : W - capW - padX + offset;
    ctx.fillStyle = p.text;
    ctx.font = '800 ' + size + 'px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = right ? 'left' : 'right';
    ctx.fillText(caps, textX, cy + 2 * s);
  };
</script>
</body>
</html>
