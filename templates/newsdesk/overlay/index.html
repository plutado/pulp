<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk bug</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var show = easeOutQuart(clamp01(t / dur)) * (1 - easeInCubic(clamp01((t - (d - dur)) / dur)));
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var margin = 64 * s, boxH = 56 * s, tabW = 22 * s;
    // A chosen logo sits in the accent tab, before the label; the tab widens to hold it.
    // With no logo the slot falls back to the label, already set, so nothing changes.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    if (hasLogo) tabW = 64 * s;
    var labelText = (p.label || '').toUpperCase();
    ctx.font = '800 ' + 28 * s + 'px ' + FONT;
    var textW = ctx.measureText(labelText).width;
    var boxW = tabW + textW + 52 * s;

    var top = p.corner === 'top-left' || p.corner === 'top-right';
    var left = p.corner === 'top-left' || p.corner === 'bottom-left';
    var y = top ? margin : H - margin - boxH;
    // Slides in from its own edge.
    var slide = (1 - show) * (boxW + margin);
    var x = left ? margin - slide : W - margin - boxW + slide;
    var k = boxH * SLANT;

    ctx.beginPath();
    ctx.moveTo(x + k, y);
    ctx.lineTo(x + boxW, y);
    ctx.lineTo(x + boxW - k, y + boxH);
    ctx.lineTo(x, y + boxH);
    ctx.closePath();
    ctx.fillStyle = p.panel;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + k, y);
    ctx.lineTo(x + k + tabW, y);
    ctx.lineTo(x + tabW, y + boxH);
    ctx.lineTo(x, y + boxH);
    ctx.closePath();
    ctx.fillStyle = p.accent;
    ctx.fill();
    if (hasLogo) {
      // The mark rides the tab, inside its slanted edges, sliding with the bug.
      var mark = boxH - 16 * s;
      window.pulpDrawImage(ctx, state, 'logo', { x: x + k + (tabW - k - mark) / 2, y: y + 8 * s, width: mark, height: mark });
    }

    ctx.fillStyle = p.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(labelText, x + tabW + 30 * s, y + boxH / 2 + 2 * s);
  };
</script>
</body>
</html>
