<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk ticker</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutQuart(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var barH = 64 * s, bottomPad = 48 * s;
    var k = barH * SLANT;
    // The bar slides up from below the frame and drops back out the same way.
    var y = H - bottomPad - barH + (1 - inT) * (barH + bottomPad) + outT * (barH + bottomPad);

    ctx.fillStyle = p.panel;
    ctx.fillRect(0, y, W, barH);

    // The label: a red block with a slashed trailing edge, text in bold spaced capitals.
    var labelText = (p.label || '').toUpperCase();
    var labelSize = 26 * s;
    ctx.font = '800 ' + labelSize + 'px ' + FONT;
    var pad = 28 * s;
    var labelW = ctx.measureText(labelText).width + pad * 2 + 6 * s * labelText.length;
    labelW = Math.min(labelW, W * 0.5);
    ctx.fillStyle = p.accent;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(labelW + k, y);
    ctx.lineTo(labelW, y + barH);
    ctx.lineTo(0, y + barH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = p.ink;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    var lx = pad;
    for (var c = 0; c < labelText.length; c++) {
      var ch = labelText[c];
      ctx.fillText(ch, lx, y + barH / 2 + 2 * s);
      lx += ctx.measureText(ch).width + 6 * s;
    }

    // The crawl: the headline repeats with a slash separator and scrolls left, driven by time.
    var crawlX = labelW + k + pad;
    var crawlW = W - crawlX;
    if (crawlW <= 0) return;
    var textSize = 30 * s;
    ctx.font = '500 ' + textSize + 'px ' + FONT;
    var sep = '   //   ';
    var unit = (p.text || '') + sep;
    var unitW = Math.max(ctx.measureText(unit).width, 1);
    var offset = (t * p.speed * s) % unitW;
    ctx.save();
    ctx.beginPath();
    ctx.rect(crawlX, y, crawlW, barH);
    ctx.clip();
    var x = crawlX - offset;
    var ty = y + barH / 2 + 2 * s;
    while (x < W) {
      ctx.fillStyle = p.ink;
      ctx.fillText(unit, x, ty);
      // The separator slashes are red: overdraw them in the accent.
      var sepX = x + ctx.measureText(p.text || '').width;
      ctx.fillStyle = p.accent;
      ctx.fillText(sep, sepX, ty);
      x += unitW;
    }
    ctx.restore();
  };
</script>
</body>
</html>
