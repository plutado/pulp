<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk slash wipe</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutQuart(x) { return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    var k = H * p.slant;
    var span = W + 2 * k;
    var pr = state.progress;
    var head = easeInOutQuart(clamp01(pr * 2)) * span;
    var tail = easeInOutQuart(clamp01(pr * 2 - 1)) * span;
    if (head <= tail) return;
    var ltr = p.direction !== 'left';

    function slashQuad(q0, q1) {
      // Vertices for the band between two slanted edges, left-to-right orientation.
      var x0t = q0 - k, x0b = q0; // top and bottom x of the trailing edge
      var x1t = q1 - k, x1b = q1; // leading edge
      if (!ltr) { x0t = W - x0t; x0b = W - x0b; x1t = W - x1t; x1b = W - x1b; }
      ctx.beginPath();
      ctx.moveTo(x0t, 0);
      ctx.lineTo(x1t, 0);
      ctx.lineTo(x1b, H);
      ctx.lineTo(x0b, H);
      ctx.closePath();
    }

    // The navy panel fills between tail and head; the red slash rides the moving edge.
    slashQuad(tail, head);
    ctx.fillStyle = p.panel;
    ctx.fill();

    var slashW = 60 * (H / 1080);
    if (pr < 0.5) slashQuad(head - slashW, head);
    else slashQuad(tail, tail + slashW);
    ctx.fillStyle = p.accent;
    ctx.fill();
  };
</script>
</body>
</html>
