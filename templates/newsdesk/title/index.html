<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Newsdesk title</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Newsdesk sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var SLANT = 0.22;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutQuart(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // On a tall frame the block is centred a little above the middle, clear of the caption band.
    var tall = H > W * 1.4;
    var margin = tall ? 0.07 * W : 110 * s;
    var headSize = 76 * s, kickSize = 30 * s;
    var maxTextW = W - margin * 2;

    // The headline wraps onto two or three lines when it does not fit (a no-op on a wide frame);
    // the band grows by one line pitch per extra line.
    ctx.font = '800 ' + headSize + 'px ' + FONT;
    var words = (p.headline || '').toUpperCase().split(' ').filter(function (w) { return w; });
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      var trial = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(trial).width > maxTextW) { lines.push(line); line = words[i]; }
      else line = trial;
    }
    if (line) lines.push(line);
    if (!lines.length) lines.push('');
    var headW = 0;
    for (var j = 0; j < lines.length; j++) headW = Math.max(headW, ctx.measureText(lines[j]).width);
    if (headW > maxTextW) headSize = Math.max(24 * s, headSize * maxTextW / headW);
    var lineH = headSize * 1.13;
    var extra = (lines.length - 1) * lineH;

    var bandH = 170 * s + extra;
    var tabH = 52 * s;
    var y = tall ? H * 0.44 - (bandH - 6 * s - tabH) / 2 : H * 0.62;
    var k = bandH * SLANT;

    // The band enters from the left; its slashed nose leads.
    var slide = (1 - show) * (W + k);
    var head = W + k - slide;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(Math.max(0, head - k), y);
    ctx.lineTo(Math.max(0, head - 2 * k), y + bandH);
    ctx.lineTo(0, y + bandH);
    ctx.closePath();
    ctx.fillStyle = p.panel;
    ctx.fill();

    // A thin accent rule rides the band's top edge.
    ctx.fillStyle = p.accent;
    ctx.fillRect(0, y - 6 * s, Math.max(0, head - k), 6 * s);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var textA = clamp01((show - 0.35) / 0.65);

    // The kicker tab sits above the band on the left.
    var kickText = (p.kicker || '').toUpperCase();
    ctx.font = '800 ' + kickSize + 'px ' + FONT;
    var kickTextW = ctx.measureText(kickText).width;
    if (kickTextW > maxTextW - 56 * s) {
      kickSize = Math.max(14 * s, kickSize * (maxTextW - 56 * s) / kickTextW);
      ctx.font = '800 ' + kickSize + 'px ' + FONT;
      kickTextW = ctx.measureText(kickText).width;
    }
    var kickW = kickTextW + 56 * s;
    var tabY = y - 6 * s - tabH;
    ctx.globalAlpha = textA;
    ctx.beginPath();
    ctx.moveTo(margin + tabH * SLANT, tabY);
    ctx.lineTo(margin + kickW, tabY);
    ctx.lineTo(margin + kickW - tabH * SLANT, tabY + tabH);
    ctx.lineTo(margin, tabY + tabH);
    ctx.closePath();
    ctx.fillStyle = p.accent;
    ctx.fill();
    ctx.fillStyle = p.text;
    ctx.fillText(kickText, margin + 30 * s, tabY + 37 * s);

    ctx.fillStyle = p.text;
    ctx.font = '800 ' + headSize + 'px ' + FONT;
    for (var n = 0; n < lines.length; n++) {
      ctx.fillText(lines[n], margin, y + 112 * s + n * lineH);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
