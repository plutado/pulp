<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stacked Blocks</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Stacked Blocks, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The second block lands at 0.9 s and both hold; the exit reverses the punch.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    var b = state.blocks.words.box, pad = 18 * u;
    var rows = [
      { y: b.y - pad, h: b.height * 0.56 + pad, c: p.top, at: 0.0 },
      { y: b.y + b.height * 0.56 + 6 * u, h: b.height * 0.44 + pad - 6 * u, c: p.bottom, at: 0.25 }
    ];
    for (var i = 0; i < rows.length; i++) {
      var come = easeOut(clamp01((t - rows[i].at) / 0.65));
      var slide = (1 - come) * -(b.x + b.width + pad * 2) + gone * -(b.x + b.width + pad * 2);
      ctx.fillStyle = rgba(rows[i].c, 0.97);
      ctx.fillRect(b.x - pad + slide, rows[i].y, b.width + pad * 2, rows[i].h);
      // A skewed trailing edge, so the punch reads as speed.
      ctx.beginPath();
      ctx.moveTo(b.x - pad + slide + b.width + pad * 2, rows[i].y);
      ctx.lineTo(b.x - pad + slide + b.width + pad * 2 + 18 * u, rows[i].y + rows[i].h / 2);
      ctx.lineTo(b.x - pad + slide + b.width + pad * 2, rows[i].y + rows[i].h);
      ctx.closePath(); ctx.fill();
    }
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var come2 = easeOut(clamp01((t - 0.15 - position * 0.25) / 0.6));
        var slide2 = (1 - come2) * -(b.x + b.width) + gone * -(b.x + b.width);
        return { alpha: 1, dx: slide2 };
      }
    });
    window.pulpDrawBlock(ctx, laid);
  };
</script>
</body>
</html>
