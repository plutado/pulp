<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Next Episode</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Next Episode, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The ring sweeps the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeInOut(clamp01(t / 1.2)), gone = easeOut(clamp01((t - (d - 0.9)) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,255,255,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var show = come * (1 - gone);
    ctx.globalAlpha = show;
    var cx = W / 2, cy = H * 0.4, r = Math.min(W, H) * 0.12;
    // The ring sweeps round and round; the gap is the hand of a clock that never stops.
    ctx.lineWidth = 5 * u; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(p.ring, 0.25);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    var a0 = t * 1.6;
    ctx.strokeStyle = rgba(p.ring, 0.95);
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + Math.PI * 0.6); ctx.stroke();
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.26, cy - r * 0.4); ctx.lineTo(cx + r * 0.46, cy); ctx.lineTo(cx - r * 0.26, cy + r * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(p.ring, 0.9);
    ctx.font = '600 ' + Math.round(30 * u) + 'px Inter';
    ctx.fillText(p.kicker.toUpperCase(), cx, cy + r + 90 * u);
    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 ' + Math.round(72 * u) + 'px "Source Serif 4"';
    ctx.fillText(p.title, cx, cy + r + 185 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
