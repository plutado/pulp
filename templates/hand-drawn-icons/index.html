<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hand-drawn icons</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hand-drawn icons sample for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInCubic(x) { return x * x * x; }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hash(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

  // Icons are lists of polylines in a unit box (-1..1), resampled finely so the wobble
  // can bend every stretch of line, not just the corners.
  function arcPts(cx, cy, r, a0, a1, n) {
    var out = [];
    for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return out;
  }
  function starPts() {
    var out = [];
    for (var i = 0; i <= 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 === 0 ? 0.95 : 0.42;
      out.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return out;
  }
  function heartPts() {
    var out = [];
    for (var i = 0; i <= 48; i++) {
      var t = Math.PI + i / 48 * Math.PI * 2;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      out.push([x / 17, y / 17 + 0.1]);
    }
    return out;
  }
  var ICONS = {
    check: [[[-0.66, 0.0], [-0.2, 0.48], [0.7, -0.46]]],
    star: [starPts()],
    heart: [heartPts()],
    arrow: [[[-0.75, 0.0], [0.72, 0.0]], [[0.3, -0.42], [0.72, 0.0], [0.3, 0.42]]],
    lightbulb: [
      arcPts(0, -0.2, 0.5, Math.PI * 0.78, Math.PI * 2.22, 28).concat([[0.2, 0.42], [-0.2, 0.42], [-0.31, 0.27]]),
      [[-0.2, 0.58], [0.2, 0.58]],
      [[-0.14, 0.74], [0.14, 0.74]],
      [[-0.1, 0.42], [-0.1, 0.2]], [[0.1, 0.42], [0.1, 0.2]]
    ]
  };

  // Split every segment into short pieces so the wobble has something to bend.
  function resample(pl, step) {
    var out = [pl[0]];
    for (var i = 1; i < pl.length; i++) {
      var dx = pl[i][0] - pl[i - 1][0], dy = pl[i][1] - pl[i - 1][1];
      var n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / step));
      for (var k = 1; k <= n; k++) out.push([pl[i - 1][0] + dx * k / n, pl[i - 1][1] + dy * k / n]);
    }
    return out;
  }
  var CACHE = {};
  function strokesFor(name) {
    if (!CACHE[name]) CACHE[name] = (ICONS[name] || ICONS.star).map(function (pl) { return resample(pl, 0.08); });
    return CACHE[name];
  }

  function polyLength(pl) {
    var L = 0;
    for (var i = 1; i < pl.length; i++) L += Math.hypot(pl[i][0] - pl[i - 1][0], pl[i][1] - pl[i - 1][1]);
    return L;
  }

  // Wobbly point: offset by a seeded hash of the point index and the current "boil" seed.
  function wob(pt, idx, seed, amt) {
    var h1 = hash(idx * 7.13 + seed * 101.7 + 1) - 0.5;
    var h2 = hash(idx * 3.71 + seed * 57.3 + 2) - 0.5;
    return [pt[0] + h1 * amt, pt[1] + h2 * amt];
  }

  // Draw strokes in order up to a share of their total length, wobbling every point.
  function drawStrokes(strokes, cx, cy, r, share, seed, amt) {
    var total = 0, i;
    for (i = 0; i < strokes.length; i++) total += polyLength(strokes[i]);
    var budget = total * share;
    var idx = 0;
    for (i = 0; i < strokes.length && budget > 0; i++) {
      var pl = strokes[i];
      var q = wob(pl[0], idx++, seed, amt);
      ctx.beginPath();
      ctx.moveTo(cx + q[0] * r, cy + q[1] * r);
      for (var j = 1; j < pl.length; j++) {
        var seg = Math.hypot(pl[j][0] - pl[j - 1][0], pl[j][1] - pl[j - 1][1]);
        var pt = pl[j];
        if (seg > budget) {
          var f = budget / seg;
          pt = [pl[j - 1][0] + (pl[j][0] - pl[j - 1][0]) * f, pl[j - 1][1] + (pl[j][1] - pl[j - 1][1]) * f];
        }
        q = wob(pt, idx++, seed, amt);
        ctx.lineTo(cx + q[0] * r, cy + q[1] * r);
        budget -= seg;
        if (budget <= 0) break;
      }
      ctx.stroke();
    }
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = clamp01((t - (d - dur)) / dur);
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    var ringR = Math.min(W, H) * 0.5 * (p.size / 100);
    var iconR = ringR * 0.55;
    var lw = p.weight * s;
    // The boil: a new seed every few frames, taken from the template's own time.
    var seed = Math.floor(state.time * 8);
    var amt = 0.035 * (p.wobble / 100);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // A loose circle scrawled round the icon: slightly more than one turn, not quite closed.
    var ring = arcPts(0, 0, 1, -Math.PI * 0.6, Math.PI * 1.55, 40);
    for (var i = 0; i < ring.length; i++) { var w = 1 + 0.03 * Math.sin(i * 1.3); ring[i] = [ring[i][0] * w, ring[i][1] * w]; }
    var ringIn = easeInOut(clamp01(inT * 1.4));
    var ringOut = easeInCubic(clamp01((outT - 0.25) / 0.75));
    ctx.strokeStyle = p.ring;
    ctx.lineWidth = lw * 0.8;
    ctx.globalAlpha = 1 - ringOut;
    if (ringIn > 0 && ringOut < 1) drawStrokes([ring], cx, cy, ringR, ringIn, seed + 500, amt * 0.6);

    // The icon is drawn stroke by stroke after the circle begins, and fades out.
    var drawIn = easeInOut(clamp01((inT - 0.25) / 0.75));
    ctx.strokeStyle = p.stroke;
    ctx.lineWidth = lw;
    ctx.globalAlpha = 1 - easeInCubic(outT);
    if (drawIn > 0) drawStrokes(strokesFor(p.icon), cx, cy, iconR, drawIn, seed, amt);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
