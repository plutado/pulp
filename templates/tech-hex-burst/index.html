<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tech hex burst</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Tech hex burst sample for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function easeOutBack(x) { var c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }

  function hexPath(cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = rot + i * Math.PI / 3;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = easeOutCubic(inT) * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    var n = Math.round(p.count);
    // The ring radius is a share of the short side so the whole burst always fits the frame.
    var outer = Math.min(W, H) * 0.5 * (p.size / 100) * 0.86;
    var hexR = Math.min(outer * 0.34, outer * Math.PI / n * 0.7);
    var ringR = outer - hexR;

    // The ring scales out with a slight overshoot and keeps turning slowly while it holds.
    var grow = easeOutBack(inT) * (1 - outT);
    var spin = t * 0.25 + (1 - easeOutCubic(inT)) * 1.2;
    var lw = Math.max(1, 2.5 * s);

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Spokes from the core to each hexagon, drawn progressively just behind the ring.
    var spoke = clamp01(inT * 1.3) * (1 - outT);
    ctx.strokeStyle = p.lineColor;
    ctx.lineWidth = Math.max(1, 1.2 * s);
    ctx.globalAlpha = clamp01(show * 1.2);
    for (var i = 0; i < n; i++) {
      var a = spin + i * Math.PI * 2 / n;
      var r1 = hexR * 0.9 * grow, r2 = (ringR - hexR) * grow * spoke;
      if (r2 <= r1) continue;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.stroke();
    }

    // A thin connecting ring links neighbouring hexagons.
    ctx.beginPath();
    ctx.arc(cx, cy, ringR * grow, 0, Math.PI * 2);
    ctx.globalAlpha = show * 0.45;
    ctx.stroke();

    // The hexagons themselves: each one also rotates about its own centre as it arrives.
    ctx.strokeStyle = p.color;
    ctx.lineWidth = lw;
    for (var j = 0; j < n; j++) {
      var stagger = clamp01((inT - j / n * 0.35) / 0.65);
      var local = easeOutBack(stagger) * (1 - outT);
      if (local <= 0) continue;
      var ang = spin + j * Math.PI * 2 / n;
      var hx = cx + Math.cos(ang) * ringR * grow, hy = cy + Math.sin(ang) * ringR * grow;
      ctx.globalAlpha = clamp01(stagger * 1.5) * (1 - outT);
      hexPath(hx, hy, hexR * local, ang + (1 - stagger) * Math.PI);
      ctx.stroke();
      ctx.globalAlpha = ctx.globalAlpha * 0.18;
      ctx.fillStyle = p.color;
      ctx.fill();
      // A small inner hexagon gives the ring a second layer of detail.
      ctx.globalAlpha = clamp01(stagger * 1.5) * (1 - outT) * 0.7;
      hexPath(hx, hy, hexR * local * 0.55, -ang * 1.5);
      ctx.stroke();
    }

    // The core: a hexagon that pulses on a deterministic beat.
    var pulse = 1 + 0.08 * Math.sin(t * Math.PI * 2);
    ctx.globalAlpha = show;
    hexPath(cx, cy, hexR * 0.8 * grow * pulse, -spin * 2);
    ctx.lineWidth = lw * 1.4;
    ctx.stroke();
    ctx.globalAlpha = show * 0.35;
    ctx.fill();
    ctx.globalAlpha = show;
    ctx.beginPath();
    ctx.arc(cx, cy, hexR * 0.18 * grow, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
