<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stopwatch</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Stopwatch, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The watch runs the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.5)), gone = easeOut(clamp01((t - (d - 0.8)) / 0.8));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var elapsed = p.from + t;
    var mins = Math.floor(elapsed / 60), secs = Math.floor(elapsed % 60), hund = Math.floor((elapsed % 1) * 100);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var cx = W / 2, cy = H * 0.46, r = Math.min(W, H) * 0.2;
    ctx.globalAlpha = show;
    ctx.fillStyle = rgba(p.face, 0.95);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.5)'; ctx.lineWidth = 3 * u;
    for (var i = 0; i < 60; i++) {
      var a = (i / 60) * Math.PI * 2;
      var len = i % 5 === 0 ? r * 0.1 : r * 0.04;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r - len), cy + Math.sin(a) * (r - len));
      ctx.lineTo(cx + Math.cos(a) * r * 0.96, cy + Math.sin(a) * r * 0.96);
      ctx.stroke();
    }
    var ha = (elapsed % 1) * Math.PI * 2 - Math.PI / 2;
    ctx.strokeStyle = rgba(p.hand, 1); ctx.lineWidth = 4 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ha) * r * 0.82, cy + Math.sin(ha) * r * 0.82); ctx.stroke();
    ctx.fillStyle = rgba(p.hand, 1);
    ctx.beginPath(); ctx.arc(cx, cy, 6 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 ' + Math.round(r * 0.5) + 'px "JetBrains Mono"';
    ctx.fillText(pad(mins) + ':' + pad(secs) + '.' + pad(hund), cx, cy + r + r * 0.6);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
