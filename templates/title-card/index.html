<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Title Card</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  //
  // The words are a block of layers (docs/template-format.md, "Blocks and layers"): the host
  // measures, wraps and stacks them, and this template says how they move. A line added to the
  // block takes the movement of the position it lands in, so a third line fades in after the
  // subtitle without this file knowing anything about it.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var s = Math.min(W, H) / 1080;

    ctx.globalAlpha = 1;
    ctx.fillStyle = p.background;
    ctx.fillRect(0, 0, W, H);

    var fadeOut = easeInOutSine(clamp01((t - (d - 0.8)) / 0.8));
    // The first line leads; each one after it waits its turn and comes in a little quicker.
    function fadeAt(position) {
      var start = position === 0 ? 0 : 0.7 * position;
      var over = position === 0 ? 1.2 : 1.0;
      return easeInOutSine(clamp01((t - start) / over));
    }
    var titleFade = fadeAt(0);

    var card = window.pulpLayoutBlock(ctx, state, 'card', {
      each: function (layer, position) {
        var over = { alpha: fadeAt(position) * (1 - fadeOut) };
        // The first line tracks out wide and settles as it arrives; the layer's own spacing is where it settles.
        if (position === 0 && layer.type === 'text') {
          over.letterSpacing = layer.letterSpacing + (1 - titleFade) * 24 * s / layer.fontSize;
        }
        return over;
      }
    });
    window.pulpDrawBlock(ctx, card);

    var first = card.layers[0];
    // A chosen logo is a mark centred above the first line, fading with it. With no logo the slot
    // falls back to that line's text, already set, so nothing changes.
    if (state.images && state.images.logo && state.images.logo.bitmap && first.lines.length) {
      var mark = 110 * s;
      ctx.globalAlpha = titleFade * (1 - fadeOut);
      window.pulpDrawImage(ctx, state, 'logo', {
        x: W / 2 - mark / 2, y: first.lines[0].baseline - first.size * 0.95 - 28 * s - mark, width: mark, height: mark
      });
      ctx.globalAlpha = 1;
    }

    // The rule sits under the first line and grows from the centre, so it follows the stack.
    var ruleW = 360 * s * easeInOutSine(clamp01((t - 0.3) / 1.2)) * (1 - fadeOut);
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.rule;
    ctx.fillRect(W / 2 - ruleW / 2, first.box.y + first.box.height + 10.8 * s, ruleW, 3 * s);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
