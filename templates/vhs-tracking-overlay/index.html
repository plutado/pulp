<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VHS Tracking</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // VHS Tracking, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The band rolls whole cycles and the static steps over the clip, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    // Scanlines, always on.
    for (var y = 0; y < H; y += 4 * u) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.1 * p.wear).toFixed(4) + ')';
      ctx.fillRect(0, y, W, 1.6 * u);
    }
    // The colour fringe at the frame's edges.
    ctx.fillStyle = 'rgba(0,255,230,' + (0.08 * p.wear).toFixed(4) + ')';
    ctx.fillRect(0, 0, 5 * u, H);
    ctx.fillStyle = 'rgba(255,40,120,' + (0.08 * p.wear).toFixed(4) + ')';
    ctx.fillRect(W - 5 * u, 0, 5 * u, H);
    // The tracking band rolls bottom to top once per cycle, two cycles a clip.
    var f = ((t / d) * 2) % 1;
    var by = H * (1 - f), bh = H * 0.045;
    var frames = Math.floor(d * 30);
    var step = Math.floor(t * 30) % frames;
    ctx.fillStyle = 'rgba(235,235,235,' + (0.14 * p.wear).toFixed(4) + ')';
    ctx.fillRect(0, by, W, bh);
    for (var sgm = 0; sgm < 24; sgm++) {
      ctx.fillStyle = 'rgba(10,10,10,' + (0.3 * p.wear * at(sgm * 3 + step)).toFixed(4) + ')';
      ctx.fillRect((sgm / 24) * W, by + at(sgm + step) * bh * 0.6, W / 24 + 1, bh * 0.4);
    }
    // A breath of static everywhere, cycling with the loop.
    for (var i = 0; i < Math.floor(240 * p.wear); i++) {
      var seed = i * 17 + step * 653;
      ctx.fillStyle = 'rgba(255,255,255,' + (at(seed) * 0.1).toFixed(4) + ')';
      ctx.fillRect(at(seed + 1) * W, at(seed + 2) * H, 2 * u, 1.4 * u);
    }
  };
</script>
</body>
</html>
