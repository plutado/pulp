<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caution Chip</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Caution Chip, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The chip drops, shakes once and is still by 0.95 s; it then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var drop = overshoot(clamp01(t / 0.5));
    // One firm shake after landing, finished well before the hold.
    var shakeT = clamp01((t - 0.5) / 0.45);
    var shake = Math.sin(shakeT * Math.PI * 3) * (1 - shakeT) * 0.03;
    var ch = 120 * u;
    ctx.font = '700 ' + Math.round(44 * u) + 'px Montserrat';
    var tw = ctx.measureText(String(p.warning)).width;
    var cw = ch * 1.3 + tw + 60 * u;
    var x = W / 2 - cw / 2, y = H * p.y - ch / 2 + (1 - drop) * -H * 0.3;
    ctx.save();
    ctx.globalAlpha = (1 - gone) * clamp01(t / 0.12);
    ctx.translate(x + cw / 2, y + ch / 2); ctx.rotate(shake); ctx.translate(-(x + cw / 2), -(y + ch / 2));
    rr(x, y, cw, ch, 16 * u);
    ctx.fillStyle = rgba(p.chip, 1); ctx.fill();
    // The striped tab at the chip's start, cut like hazard tape.
    ctx.save();
    rr(x, y, ch * 1.1, ch, 16 * u); ctx.clip();
    for (var s2 = -2; s2 < 8; s2++) {
      ctx.fillStyle = s2 % 2 ? rgba(p.ink, 0.9) : 'rgba(0,0,0,0)';
      ctx.beginPath();
      ctx.moveTo(x + s2 * ch * 0.22, y + ch);
      ctx.lineTo(x + s2 * ch * 0.22 + ch * 0.22, y + ch);
      ctx.lineTo(x + s2 * ch * 0.22 + ch * 0.22 + ch * 0.4, y);
      ctx.lineTo(x + s2 * ch * 0.22 + ch * 0.4, y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = rgba(p.ink, 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(44 * u) + 'px Montserrat';
    ctx.fillText(String(p.warning), x + ch * 1.3, y + ch / 2 + 2 * u);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
