<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boardroom blinds</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Boardroom sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    // Each slat grows from its leading edge during the first half and shrinks away from the same
    // edge during the second, so the motion runs one way throughout. The stagger delays later
    // slats but every slat is fully closed at progress 0.5, where the cut goes.
    var pr = state.progress;
    var horizontal = p.direction !== 'vertical';
    var n = Math.max(1, Math.round(p.slats));
    var span = horizontal ? H : W;
    var slat = span / n;
    var edge = 4 * (Math.min(W, H) / 1080);
    var stag = p.stagger;

    for (var i = 0; i < n; i++) {
      var delay = n > 1 ? stag * (i / (n - 1)) : 0;
      var closeT = easeInOutCubic(clamp01((pr * 2 - delay) / (1 - stag)));
      var openT = easeInOutCubic(clamp01((pr * 2 - 1 - delay) / (1 - stag)));
      var a = i * slat + openT * slat;        // the trailing edge moves in during the open
      var b = i * slat + closeT * slat;       // the leading edge moves in during the close
      // Overdraw by a hair so adjacent slats never show a seam when closed.
      var size = b - a;
      if (size <= 0) continue;
      if (horizontal) {
        ctx.fillStyle = p.panel;
        ctx.fillRect(0, a, W, size + 0.5);
        ctx.fillStyle = p.accent;
        if (pr < 0.5) ctx.fillRect(0, b - edge, W, edge);
        else ctx.fillRect(0, a, W, Math.min(edge, size));
      } else {
        ctx.fillStyle = p.panel;
        ctx.fillRect(a, 0, size + 0.5, H);
        ctx.fillStyle = p.accent;
        if (pr < 0.5) ctx.fillRect(b - edge, 0, edge, H);
        else ctx.fillRect(a, 0, Math.min(edge, size), H);
      }
    }
  };
</script>
</body>
</html>
