<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boardroom wipe</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Boardroom sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    // Cover during the first half, reveal during the second, moving one way throughout.
    // The cut goes at the midpoint, where the panel fills the frame.
    var pr = state.progress;
    var edge = 6 * (Math.min(W, H) / 1080);
    var ltr = p.direction !== 'left';
    var head = easeInOutCubic(clamp01(pr * 2)) * (W + edge);
    var tail = easeInOutCubic(clamp01(pr * 2 - 1)) * (W + edge);

    var x0 = ltr ? tail : W - head;
    var x1 = ltr ? head : W - tail;
    if (x1 <= x0) return;

    ctx.fillStyle = p.panel;
    ctx.fillRect(x0, 0, x1 - x0, H);
    ctx.fillStyle = p.accent;
    if (pr < 0.5) ctx.fillRect(ltr ? x1 - edge : x0, 0, edge, H);
    else ctx.fillRect(ltr ? x0 : x1 - edge, 0, edge, H);

    // A chosen logo sits at the centre of the panel, clipped to the covered span and fading in as
    // the leading edge passes it and out as the trailing edge follows. With no logo nothing is drawn.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    if (hasLogo) {
      var mark = 200 * (Math.min(W, H) / 1080);
      var cx = W / 2;
      var cover = clamp01((x1 - cx + mark / 2) / mark) * clamp01((cx + mark / 2 - x0) / mark);
      if (cover > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0, 0, x1 - x0, H);
        ctx.clip();
        ctx.globalAlpha = cover;
        window.pulpDrawImage(ctx, state, 'logo', { x: cx - mark / 2, y: H / 2 - mark / 2, width: mark, height: mark });
        ctx.restore();
      }
    }
  };
</script>
</body>
</html>
