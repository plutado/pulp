<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boardroom credits</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Boardroom sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }

  // Sets ctx.font, shrinking the size until the text fits maxW; returns the size used.
  function fitFont(text, prefix, size, maxW) {
    ctx.font = prefix + size + 'px ' + FONT;
    var w = ctx.measureText(text).width;
    if (w > maxW && w > 0) {
      size = Math.max(8, Math.floor(size * maxW / w));
      ctx.font = prefix + size + 'px ' + FONT;
    }
    return size;
  }

  // "Role: Name" per line; a line without a colon is a name on its own.
  function parseCredits(text) {
    var out = [];
    var lines = String(text || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var k = line.indexOf(':');
      if (k < 0) out.push({ role: '', name: line });
      else out.push({ role: line.slice(0, k).trim(), name: line.slice(k + 1).trim() });
    }
    return out;
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutCubic(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var margin = 100 * s;
    var cx = W / 2;
    var maxW = W - margin * 2;

    // Fixed title in spaced capitals with a hairline that draws out from the centre beneath it.
    var titleSize = 30 * s;
    var caps = (p.title || '').toUpperCase().split('').join(' ');
    fitFont(caps, '600 ', titleSize, maxW);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = show;
    ctx.fillStyle = p.text;
    ctx.fillText(caps, cx, margin + titleSize);
    var ruleY = margin + titleSize + 28 * s;
    var ruleW = Math.min(maxW, 720 * s) * show;
    ctx.fillStyle = p.accent;
    ctx.fillRect(cx - ruleW / 2, ruleY, ruleW, 2 * s);

    // The roll lives below the rule and above the bottom margin; rows fade at both edges.
    var top = ruleY + 36 * s, bottom = H - margin * 0.5;
    var rows = parseCredits(p.credits);
    var rowH = 108 * s;
    var travelLen = (bottom - top) + rows.length * rowH;
    var rollStart = dur * 0.5;
    var travel = clamp01((t - rollStart) / (d - rollStart)) * travelLen * p.speed;

    var gap = 24 * s;
    var colW = cx - gap - margin;
    var roleSize = 24 * s, nameSize = 44 * s;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, top, W, bottom - top);
    ctx.clip();
    for (var i = 0; i < rows.length; i++) {
      var y = bottom + i * rowH + rowH * 0.65 - travel;
      if (y < top - rowH || y > bottom + rowH) continue;
      var edge = clamp01((y - top) / (90 * s)) * clamp01((bottom - y + 10 * s) / (60 * s));
      var a = edge * show;
      if (a <= 0) continue;

      // Role: spaced capitals in the accent, right of centre gap.
      var role = rows[i].role.toUpperCase().split('').join(' ');
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = p.accent;
      ctx.textAlign = 'right';
      fitFont(role, '600 ', roleSize, colW);
      ctx.fillText(role, cx - gap, y - 4 * s);

      // Name: light weight, left of the gap.
      ctx.globalAlpha = a;
      ctx.fillStyle = p.text;
      ctx.textAlign = 'left';
      fitFont(rows[i].name, '300 ', nameSize, colW);
      ctx.fillText(rows[i].name, cx + gap, y);
    }
    ctx.restore();

    // A short hairline tick marks the centre gap, drawn across the roll's full height.
    ctx.globalAlpha = show * 0.35;
    ctx.fillStyle = p.accent;
    ctx.fillRect(cx - 0.5 * s, top, 1 * s, (bottom - top) * show);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
