<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boardroom counter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Boardroom sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function easeInOutQuint(x) { return x < 0.5 ? 16 * x * x * x * x * x : 1 - Math.pow(-2 * x + 2, 5) / 2; }

  function fitFont(text, maxW, size, prefix) {
    for (var i = 0; i < 24; i++) {
      ctx.font = prefix + size + 'px ' + FONT;
      if (ctx.measureText(text).width <= maxW || size < 8) return size;
      size *= 0.92;
    }
    return size;
  }

  function fmt(n, dec) {
    var f = Math.abs(n).toFixed(dec).split('.');
    f[0] = f[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 && Number(f.join('.')) !== 0 ? '-' : '') + f.join('.');
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutCubic(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    var innerW = W - 160 * s;
    var dec = Math.max(0, Math.min(3, Math.round(p.decimals)));

    // The count runs between the in and the out on a slow-in, slow-out curve.
    var countT = easeInOutQuint(clamp01((t - dur * 0.5) / Math.max(0.1, d - dur * 1.5)));
    var value = p.start + (p.target - p.start) * countT;
    var numText = fmt(value, dec);
    var fullText = fmt(Math.abs(p.target) > Math.abs(p.start) ? p.target : p.start, dec);

    // Sizes: the figure is sized so prefix + widest figure + suffix fit the frame.
    var numSize = 220 * s;
    var affixSize = numSize * 0.42;
    for (var i = 0; i < 12; i++) {
      numSize = fitFont(fullText, innerW * 0.8, numSize, '200 ');
      affixSize = numSize * 0.42;
      ctx.font = '300 ' + affixSize + 'px ' + FONT;
      var affixW = ctx.measureText(p.prefix).width + ctx.measureText(p.suffix).width + (p.prefix ? 14 * s : 0) + (p.suffix ? 14 * s : 0);
      ctx.font = '200 ' + numSize + 'px ' + FONT;
      if (ctx.measureText(fullText).width + affixW <= innerW) break;
      numSize *= 0.92;
    }
    ctx.font = '200 ' + numSize + 'px ' + FONT;
    var numW = ctx.measureText(numText).width;
    ctx.font = '300 ' + affixSize + 'px ' + FONT;
    var preW = p.prefix ? ctx.measureText(p.prefix).width + 14 * s : 0;
    var sufW = p.suffix ? ctx.measureText(p.suffix).width + 14 * s : 0;
    var totalW = preW + numW + sufW;
    var left = cx - totalW / 2;
    var baseY = cy + numSize * 0.3;

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    // Hairline above, drawing in from the centre.
    var ruleW = innerW * 0.6 * easeOutCubic(clamp01(t / (dur * 1.3)));
    ctx.globalAlpha = show;
    ctx.fillStyle = p.accent;
    ctx.fillRect(cx - ruleW / 2, baseY - numSize * 0.78 - 56 * s, ruleW, 2 * s);

    var textA = clamp01((show - 0.25) / 0.75);
    ctx.globalAlpha = textA * (1 - outT);
    ctx.fillStyle = p.accent;
    ctx.font = '300 ' + affixSize + 'px ' + FONT;
    if (p.prefix) ctx.fillText(p.prefix, left, baseY);
    if (p.suffix) ctx.fillText(p.suffix, left + preW + numW + 14 * s, baseY);

    ctx.fillStyle = p.text;
    ctx.font = '200 ' + numSize + 'px ' + FONT;
    ctx.fillText(numText, left + preW, baseY);

    // The label beneath, spaced capitals in steel.
    var label = (p.label || '').toUpperCase().split('').join(' ');
    var labelSize = fitFont(label, innerW, 26 * s, '600 ');
    ctx.textAlign = 'center';
    ctx.fillStyle = p.accent;
    ctx.font = '600 ' + labelSize + 'px ' + FONT;
    ctx.fillText(label, cx, baseY + 70 * s);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
