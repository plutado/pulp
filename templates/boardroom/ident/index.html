<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boardroom ident</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Boardroom sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  // Splits words into two balanced lines, measured in the current font.
  function twoLines(text) {
    var words = text.split(/\s+/).filter(Boolean);
    if (words.length < 2) return [text];
    var best = 1, bestDiff = Infinity;
    for (var i = 1; i < words.length; i++) {
      var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      var diff = Math.abs(ctx.measureText(a).width - ctx.measureText(b).width);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
  }

  // The fallback: the name set in light type, centred in the logo's box and fitted to it by
  // measurement; two balanced lines when one line would shrink the type past half its size.
  function wordmark(text, box, color) {
    text = (text || '').trim();
    if (!text) return;
    var prefix = '300 ';
    var maxW = box.width * 0.92;
    var size = box.height * 0.42;
    ctx.font = prefix + size + 'px ' + FONT;
    var w = ctx.measureText(text).width;
    var lines = [text];
    var fit = w > maxW ? size * maxW / w : size;
    if (fit < size * 0.5 && text.indexOf(' ') > 0) {
      lines = twoLines(text);
      size = box.height * 0.3;
      fit = size;
      ctx.font = prefix + size + 'px ' + FONT;
      for (var i = 0; i < lines.length; i++) {
        var lw = ctx.measureText(lines[i]).width;
        if (lw > maxW) fit = Math.min(fit, size * maxW / lw);
      }
    }
    size = Math.max(8, Math.floor(fit));
    ctx.font = prefix + size + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    var lineH = size * 1.1;
    var y0 = box.y + box.height / 2 - (lines.length - 1) * lineH / 2;
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], box.x + box.width / 2, y0 + j * lineH + size * 0.06);
  }

  // Image slot: the chosen logo in the box, or the name as a wordmark in the same box.
  function drawLogo(state, box, color) {
    var drawn = window.pulpDrawImage ? window.pulpDrawImage(ctx, state, 'logo', box) : false;
    if (drawn) return;
    var slot = state.images && state.images.logo;
    wordmark((slot && slot.fallback) || state.params.name, box, color);
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time;
    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;

    // The ground is part of the ident: a flat ink field with the set's quiet vignette.
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.ground;
    ctx.fillRect(0, 0, W, H);
    var vr = W >= H ? H : Math.sqrt(W * H);
    var v = ctx.createRadialGradient(cx, cy, vr * 0.4, cx, cy, vr * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Where the logo rests: a box about the centre that reads the same tall, square and wide.
    var box = { width: Math.min(500 * s, W * 0.8), height: 324 * s };
    box.x = cx - box.width / 2;
    box.y = cy - box.height / 2;
    var ruleY = box.y + box.height + 28 * s;
    var ruleMax = Math.min(W - 200 * s, 760 * s);

    // Beats: the rule draws 0 to 0.6 s, the logo rises 0.3 to 1.2 s, the rule fades 1.3 to 1.8 s,
    // and the mark is gone by 2.5 s.
    var draw = easeOutCubic(clamp01(t / 0.6));
    var rise = easeOutCubic(clamp01((t - 0.3) / 0.9));
    var ruleFade = 1 - easeInOutCubic(clamp01((t - 1.3) / 0.5));
    var out = easeInCubic(clamp01((t - 1.95) / 0.55));
    var fade = 1 - out;

    // The hairline rule grows from the centre outward.
    var ruleW = ruleMax * draw;
    if (ruleW > 0 && ruleFade * fade > 0) {
      ctx.globalAlpha = ruleFade * fade;
      ctx.fillStyle = p.accent;
      ctx.fillRect(cx - ruleW / 2, ruleY - s, ruleW, 2 * s);
    }

    // The logo rises from below the rule. Until it has settled, only what is above the rule shows,
    // so the mark emerges through the line; after that the clip is gone and the mark is whole.
    if (fade <= 0) return;
    var lift = (1 - rise) * (box.height + 40 * s);
    var riding = { x: box.x, y: box.y + lift - out * 24 * s, width: box.width, height: box.height };
    ctx.save();
    if (rise < 1) {
      ctx.beginPath();
      ctx.rect(0, 0, W, ruleY);
      ctx.clip();
    }
    ctx.globalAlpha = fade;
    drawLogo(state, riding, p.text);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
