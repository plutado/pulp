<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caption Pop</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Caption Pop, a caption style for Pulp (milestone 50). CC0-1.0: no rights reserved.
  // Capitals in a heavy outline; the word being spoken takes the colour and jumps a size, settling
  // over a tenth of a second. With no captions handed over it draws a specimen line.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  document.fonts.load('800 64px Montserrat');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }

  var SPECIMEN = {
    time: 1.25,
    spoken: 3,
    box: null,
    line: {
      start: 0, end: 2.2,
      words: [
        { text: 'Say', start: 0, end: 0.3 },
        { text: 'it', start: 0.3, end: 0.5 },
        { text: 'and', start: 0.5, end: 0.8 },
        { text: 'read', start: 1.2, end: 1.6 },
        { text: 'it', start: 1.6, end: 1.8 },
        { text: 'back', start: 1.8, end: 2.2 }
      ]
    }
  };

  function band(W, H) {
    var tall = H > W;
    var bottom = tall ? 0.78 : 0.95;
    var right = tall ? 0.82 : 0.95;
    return { x: 0.05 * W, y: (bottom - 0.22) * H, width: (right - 0.05) * W, height: 0.22 * H };
  }

  function wrap(words, maxWidth, space) {
    var rows = [[]];
    var width = 0;
    for (var i = 0; i < words.length; i++) {
      var w = ctx.measureText(words[i].text.toUpperCase()).width;
      var row = rows[rows.length - 1];
      if (row.length > 0 && width + space + w > maxWidth) {
        rows.push([]);
        row = rows[rows.length - 1];
        width = 0;
      }
      row.push({ index: i, text: words[i].text.toUpperCase(), width: w, start: words[i].start });
      width += (row.length > 1 ? space : 0) + w;
    }
    return rows;
  }

  window.pulpRender = function (state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, p = state.params;
    var u = Math.min(W, H);
    ctx.clearRect(0, 0, W, H);
    var caps = state.captions || SPECIMEN;
    var line = caps.line;
    if (!line || !line.words || line.words.length === 0) return;
    var box = caps.box || band(W, H);
    var size = Math.round(p.size * u);
    var space = size * 0.32;
    var lead = size * 1.3;
    ctx.font = '800 ' + size + 'px Montserrat';
    ctx.textBaseline = 'alphabetic';
    var rows = wrap(line.words, box.width, space);
    var inAt = easeOut(clamp01((caps.time - line.start) / 0.1));
    var block = rows.length * lead;
    var top = box.y + box.height - block;
    ctx.save();
    ctx.globalAlpha = inAt;
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.16);
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var rowWidth = 0;
      for (var i = 0; i < row.length; i++) rowWidth += row[i].width + (i > 0 ? space : 0);
      var x = box.x + (box.width - rowWidth) / 2;
      var baseline = top + r * lead + size;
      for (var k = 0; k < row.length; k++) {
        var spoken = row[k].index === caps.spoken;
        // The jump settles over a tenth of a second from the moment the word was said, so a
        // long word is not held large and a quick one still reads as a beat.
        var pop = spoken ? 1 + 0.12 * (1 - easeOut(clamp01((caps.time - row[k].start) / 0.1))) : 1;
        ctx.save();
        ctx.translate(x + row[k].width / 2, baseline);
        ctx.scale(pop, pop);
        ctx.textAlign = 'center';
        ctx.strokeStyle = rgba(p.outline, 1);
        ctx.strokeText(row[k].text, 0, 0);
        ctx.fillStyle = spoken ? rgba(p.spoken, 1) : rgba(p.ink, 1);
        ctx.fillText(row[k].text, 0, 0);
        ctx.restore();
        x += row[k].width + space;
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
