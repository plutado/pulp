<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Film grain field</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  // Grain is drawn at reduced resolution into this canvas and scaled up, so 4K stays fast.
  var small = document.createElement('canvas');
  var sctx = small.getContext('2d');
  var img = null;

  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  // Integer hash for per-pixel grain; cheaper than the sine hash across a million cells.
  function ihash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = Math.imul(n, 9);
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return (n >>> 0) / 4294967296;
  }
  function rgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    var s = Math.min(W, H) / 1080;
    var frame = state.frame;

    // Grain cell size scales with the frame so the texture reads the same at any resolution.
    var cell = Math.max(1, Math.round(p.grainSize * s));
    var gw = Math.ceil(W / cell), gh = Math.ceil(H / cell);
    if (small.width !== gw || small.height !== gh || !img) {
      small.width = gw;
      small.height = gh;
      img = sctx.createImageData(gw, gh);
    }

    var base = rgb(p.base);
    var amp = 90 * p.grain;
    var data = img.data;
    var seed = (frame * 7919 + 13) | 0;
    for (var i = 0, n = gw * gh; i < n; i++) {
      var v = (ihash(i * 2654435761 + seed) - 0.5) * amp;
      var o = i * 4;
      data[o] = base[0] + v;
      data[o + 1] = base[1] + v;
      data[o + 2] = base[2] + v;
      data[o + 3] = 255;
    }
    sctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, gw, gh, 0, 0, W, H);
    ctx.imageSmoothingEnabled = true;

    // A gentle lens falloff so the field has a centre.
    var v2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
    v2.addColorStop(0, 'rgba(0,0,0,0)');
    v2.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = v2;
    ctx.fillRect(0, 0, W, H);

    // Dust specks: a few per frame, placed and sized from the frame number alone.
    var count = Math.round(p.specks);
    for (var k = 0; k < count; k++) {
      var h0 = hash(frame * 31 + k * 7 + 1);
      var h1 = hash(frame * 31 + k * 7 + 2);
      var h2 = hash(frame * 31 + k * 7 + 3);
      var h3 = hash(frame * 31 + k * 7 + 4);
      // Roughly half the specks show on any one frame, so they flicker like real dust.
      if (h3 < 0.45) continue;
      var x = h0 * W, y = h1 * H;
      var r = (3 + h2 * 7) * s;
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      var a = 0.4 + 0.6 * h3;
      g.addColorStop(0, 'rgba(255,250,240,' + a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,250,240,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }

    // Long thin hair-like scratches, rarer, drawn in the same way.
    for (var m = 0; m < 2; m++) {
      var q0 = hash(frame * 17 + m * 5 + 101);
      if (q0 < 0.7) continue;
      var q1 = hash(frame * 17 + m * 5 + 102);
      var q2 = hash(frame * 17 + m * 5 + 103);
      var sx = q1 * W, sy = q2 * H;
      var len = (40 + q0 * 80) * s;
      ctx.strokeStyle = 'rgba(255,250,240,0.35)';
      ctx.lineWidth = 1 * s;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(sx + len * 0.3, sy + len * 0.6, sx + len * 0.2, sy + len);
      ctx.stroke();
    }
  };
</script>
</body>
</html>
