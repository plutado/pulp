<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Camera Flashes</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Camera Flashes, a sample template for Pulp. CC0-1.0: no rights reserved.
  // Each flash has a fixed place and a fixed moment from the seeded hash, denser near
  // the midpoint, so the frame whites out exactly where the cut sits.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var mid = d / 2;
    var n = Math.round(p.bursts);
    for (var i = 0; i < n; i++) {
      // Flash moments cluster around the midpoint; each lives about a tenth of a second.
      var when = mid + (at(i) - 0.5) * d * 0.7;
      var life = 0.1 + at(i + 40) * 0.08;
      var f = 1 - Math.abs(t - when) / life;
      if (f <= 0) continue;
      var x = at(i + 80) * W, y = at(i + 120) * H * 0.8 + H * 0.1;
      var r = (120 + at(i + 160) * 240) * u * f;
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, p.tint);
      g.addColorStop(1, p.tint + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // The whole frame blooms at the midpoint so the cut is fully hidden.
    var wash = 1 - Math.abs(t - mid) / (d * 0.18);
    if (wash > 0) {
      ctx.fillStyle = p.tint;
      ctx.globalAlpha = easeInOut(clamp01(wash));
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
