<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Definition</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Definition, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The entry fills line by line, done by 1.3 s; the card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    var come = easeOut(clamp01(t / 0.7));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var cw = Math.min(W * 0.56, 860 * u), ch = Math.min(H * 0.4, 380 * u);
    var cx = W / 2 - cw / 2, cy = H * 0.5 - ch / 2 + (1 - come) * 24 * u;
    ctx.globalAlpha = (1 - gone) * come;
    ctx.fillStyle = 'rgba(30,24,16,0.2)';
    rr(cx + 5 * u, cy + 9 * u, cw, ch, 10 * u); ctx.fill();
    ctx.fillStyle = rgba(p.card, 1);
    rr(cx, cy, cw, ch, 10 * u); ctx.fill();
    var rows = [
      { at: 0.25, draw: function (a) {
        ctx.globalAlpha = a;
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#2d241a';
        ctx.font = '700 ' + Math.round(72 * u) + 'px "Source Serif 4"';
        ctx.fillText(p.word, cx + cw * 0.08, cy + ch * 0.36);
      } },
      { at: 0.55, draw: function (a) {
        ctx.globalAlpha = a;
        ctx.fillStyle = rgba(p.accent, 0.95);
        ctx.font = 'italic 500 ' + Math.round(28 * u) + 'px "Source Serif 4"';
        ctx.fillText(p.said, cx + cw * 0.08, cy + ch * 0.52);
      } },
      { at: 0.85, draw: function (a) {
        ctx.globalAlpha = a;
        ctx.strokeStyle = rgba(p.accent, 0.5); ctx.lineWidth = 1.5 * u;
        ctx.beginPath(); ctx.moveTo(cx + cw * 0.08, cy + ch * 0.62); ctx.lineTo(cx + cw * 0.92, cy + ch * 0.62); ctx.stroke();
        ctx.fillStyle = '#4c4337';
        ctx.font = '500 ' + Math.round(32 * u) + 'px Inter';
        ctx.fillText(p.means, cx + cw * 0.08, cy + ch * 0.78);
      } },
    ];
    for (var i = 0; i < rows.length; i++) {
      var a2 = easeOut(clamp01((t - rows[i].at) / 0.45)) * (1 - gone) * come;
      if (a2 > 0) rows[i].draw(a2);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
