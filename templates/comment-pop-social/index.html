<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Comment Pop</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Comment Pop, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The bubble pops and the heart lands by 1.2 s; the comment then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var pop = overshoot(clamp01(t / 0.5));
    var bw = Math.min(W * 0.52, 760 * u), bh = 190 * u;
    var x = W / 2 - bw / 2, y = H * 0.68;
    ctx.save();
    ctx.globalAlpha = (1 - gone) * clamp01(t / 0.1);
    ctx.translate(x + bw * 0.1, y + bh);
    ctx.scale(Math.max(0.0001, pop), Math.max(0.0001, pop));
    ctx.translate(-(x + bw * 0.1), -(y + bh));
    ctx.fillStyle = 'rgba(15,20,30,0.18)';
    rr(x + 4 * u, y + 8 * u, bw, bh, 28 * u); ctx.fill();
    ctx.fillStyle = rgba(p.bubble, 0.98);
    rr(x, y, bw, bh, 28 * u); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + bw * 0.08, y + bh - 2 * u);
    ctx.lineTo(x + bw * 0.03, y + bh + 30 * u);
    ctx.lineTo(x + bw * 0.16, y + bh - 2 * u);
    ctx.closePath(); ctx.fill();
    // The avatar dot: initials cut from the handle.
    var handle = String(p.user2).replace('@', '');
    ctx.fillStyle = '#6366f1';
    ctx.beginPath(); ctx.arc(x + 56 * u, y + 56 * u, 30 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(26 * u) + 'px Inter';
    ctx.fillText(handle.slice(0, 2).toUpperCase(), x + 56 * u, y + 57 * u);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#111827';
    ctx.font = '700 ' + Math.round(28 * u) + 'px Inter';
    ctx.fillText(String(p.user2), x + 100 * u, y + 50 * u);
    ctx.fillStyle = '#374151';
    ctx.font = '500 ' + Math.round(34 * u) + 'px Inter';
    ctx.fillText(String(p.comment), x + 100 * u, y + 110 * u);
    // The heart ticks on once the bubble has settled.
    var liked = overshoot(clamp01((t - 0.8) / 0.4));
    if (t >= 0.8) {
      var hx = x + bw - 60 * u, hy = y + bh - 46 * u, hr = 16 * u * Math.min(1.2, liked);
      ctx.fillStyle = rgba(p.heart, 1);
      ctx.beginPath();
      ctx.moveTo(hx, hy + hr * 0.9);
      ctx.bezierCurveTo(hx - hr * 1.3, hy - hr * 0.2, hx - hr * 0.5, hy - hr * 1.2, hx, hy - hr * 0.3);
      ctx.bezierCurveTo(hx + hr * 0.5, hy - hr * 1.2, hx + hr * 1.3, hy - hr * 0.2, hx, hy + hr * 0.9);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
