<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Signal Drop Glitch</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Signal Drop Glitch, a sample template for Pulp. CC0-1.0: no rights reserved.
  // Block corruption worsens into the midpoint, where the card holds for a few frames
  // over solid black -- the cut lives there -- then the same corruption unwinds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var mid = d / 2;
    var strength = easeInOut(1 - clamp01(Math.abs(t - mid) / mid));
    if (strength <= 0.01) return;
    var frame = Math.floor(t * 30);

    // Block corruption: cells that go dark or tint, more of them as the drop nears.
    var cols = 16, rows = 9;
    for (var r2 = 0; r2 < rows; r2++) {
      for (var c2 = 0; c2 < cols; c2++) {
        var roll = at(r2 * 37 + c2 * 11 + frame * 5);
        if (roll > strength * 0.8) continue;
        var cw = W / cols, chh = H / rows;
        var mode = at(r2 + c2 * 3 + frame);
        ctx.fillStyle = mode < 0.5 ? 'rgba(8, 10, 12, 0.9)' : (mode < 0.8 ? p.accent + '44' : 'rgba(255,255,255,0.18)');
        ctx.fillRect(c2 * cw, r2 * chh, cw + 1, chh + 1);
      }
    }

    // The dead air: solid black with the card, holding around the midpoint.
    var card = 1 - Math.abs(t - mid) / (d * 0.16);
    if (card > 0) {
      ctx.globalAlpha = easeInOut(clamp01(card));
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = p.accent;
      ctx.lineWidth = 2 * u;
      var bw2 = 460 * u, bh2 = 120 * u;
      ctx.strokeRect(W / 2 - bw2 / 2, H / 2 - bh2 / 2, bw2, bh2);
      ctx.fillStyle = p.accent;
      ctx.font = '600 ' + Math.round(44 * u) + 'px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.word, W / 2, H / 2 + 2 * u);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
