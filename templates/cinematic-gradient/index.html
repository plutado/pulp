<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cinematic gradient</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // A still: every frame draws the same picture.
  // The same colour at zero alpha, so gradients fade without passing through dark grey.
  function clear(hex) {
    return 'rgba(' + parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' + parseInt(hex.slice(5, 7), 16) + ',0)';
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    var lx = W * p.lightX / 100, ly = H * p.lightY / 100;
    var far = Math.max(W, H);

    // Base: shadow to midtone, leaning toward the light.
    var g = ctx.createLinearGradient(W - lx, H - ly, lx, ly);
    g.addColorStop(0, p.shadow);
    g.addColorStop(1, p.mid);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // The soft off-centre light: a wide warm bloom with a brighter core.
    var bloom = ctx.createRadialGradient(lx, ly, 0, lx, ly, far * 0.7);
    bloom.addColorStop(0, p.light);
    bloom.addColorStop(0.25, p.light);
    bloom.addColorStop(1, clear(p.light));
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, W, H);

    var core = ctx.createRadialGradient(lx, ly, 0, lx, ly, far * 0.18);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // The heavy vignette, pulled toward the light so the dark side falls off harder.
    var vx = W / 2 + (lx - W / 2) * 0.3, vy = H / 2 + (ly - H / 2) * 0.3;
    var v = ctx.createRadialGradient(vx, vy, Math.min(W, H) * 0.2, vx, vy, far * 0.85);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.55, 'rgba(0,0,0,' + (0.35 * p.vignette).toFixed(3) + ')');
    v.addColorStop(1, 'rgba(0,0,0,' + (0.95 * p.vignette).toFixed(3) + ')');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
