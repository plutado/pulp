<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Letterbox vignette</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Letterbox vignette, a sample overlay for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeInOut(clamp01(t / dur));
    var outT = easeInOut(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var ratio = parseFloat(p.ratio) || 2.39;
    var r = hex(p.bar, 1), g = hex(p.bar, 3), b = hex(p.bar, 5);
    function rgba(a) { return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')'; }

    // Wide frames get bars top and bottom; tall ones get the same ratio turned on its side, as pillars.
    var wide = W >= H;
    var barSize = wide ? Math.max(0, (H - W / ratio) / 2) : Math.max(0, (W - H / ratio) / 2);
    var slid = barSize * show;
    var x0 = wide ? 0 : slid, y0 = wide ? slid : 0;
    var iw = wide ? W : W - slid * 2, ih = wide ? H - slid * 2 : H;

    // The vignette inside the picture area, clipped so it never spills onto the bars.
    if (p.vignette > 0 && iw > 0 && ih > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, y0, iw, ih);
      ctx.clip();
      var cx = W / 2, cy = H / 2;
      var radius = Math.sqrt(iw * iw + ih * ih) / 2;
      var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      grad.addColorStop(0, rgba(0));
      grad.addColorStop(0.45, rgba(0));
      for (var i = 1; i <= 5; i++) {
        var k = i / 5;
        grad.addColorStop(0.45 + 0.55 * k, rgba(p.vignette * k * k));
      }
      ctx.translate(cx, cy);
      ctx.scale(radius * 1.1 * (iw >= ih ? 1.1 : 1), radius * 1.1 * (iw < ih ? 1.1 : 1));
      ctx.globalAlpha = show;
      ctx.fillStyle = grad;
      ctx.fillRect(-2, -2, 4, 4);
      ctx.restore();
    }

    // The bars, with a one-pixel soft edge so they do not alias against the picture.
    ctx.fillStyle = p.bar;
    if (wide) {
      ctx.fillRect(0, 0, W, slid);
      ctx.fillRect(0, H - slid, W, slid);
    } else {
      ctx.fillRect(0, 0, slid, H);
      ctx.fillRect(W - slid, 0, slid, H);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
