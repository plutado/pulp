<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Give</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Give, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The ring fills over the first two seconds and then holds still; the words sit beside it.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeInOut(clamp01(t / 2.0)), gone = easeInOut(clamp01((t - 6.0) / 1.0));
    ctx.fillStyle = p.back;
    ctx.fillRect(0, 0, W, H);
    var show = 1 - gone;
    var tall = H > W;
    var cx = tall ? W / 2 : W * 0.3, cy = tall ? H * 0.36 : H / 2, r = Math.min(W, H) * 0.17;
    ctx.globalAlpha = show;
    ctx.lineWidth = 18 * u;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    var frac = Math.max(0, Math.min(1, p.percent / 100)) * come;
    ctx.strokeStyle = p.ring;
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
    // A heart at the centre, from two arcs and a point.
    var hs = r * 0.42;
    ctx.fillStyle = p.ring;
    ctx.beginPath();
    ctx.moveTo(cx, cy + hs * 0.9);
    ctx.bezierCurveTo(cx - hs * 1.6, cy - hs * 0.3, cx - hs * 0.6, cy - hs * 1.2, cx, cy - hs * 0.4);
    ctx.bezierCurveTo(cx + hs * 0.6, cy - hs * 1.2, cx + hs * 1.6, cy - hs * 0.3, cx, cy + hs * 0.9);
    ctx.fill();
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#fff7ed';
    if (tall) {
      ctx.textAlign = 'center';
      ctx.font = '600 ' + Math.round(52 * u) + 'px "Source Serif 4"';
      ctx.fillText(p.line, W / 2, H * 0.64);
      ctx.font = '600 ' + Math.round(34 * u) + 'px Inter';
      ctx.fillStyle = p.ring;
      ctx.fillText(Math.round(p.percent * come) + '% raised', W / 2, H * 0.71);
      ctx.fillStyle = '#fed7aa';
      ctx.font = '400 ' + Math.round(30 * u) + 'px Inter';
      ctx.fillText(p.where, W / 2, H * 0.78);
    } else {
      ctx.textAlign = 'left';
      var tx = cx + r + 60 * u;
      ctx.font = '600 ' + Math.round(56 * u) + 'px "Source Serif 4"';
      ctx.fillText(p.line, tx, cy - 20 * u);
      ctx.font = '600 ' + Math.round(34 * u) + 'px Inter';
      ctx.fillStyle = p.ring;
      ctx.fillText(Math.round(p.percent * come) + '% raised', tx, cy + 34 * u);
      ctx.fillStyle = '#fed7aa';
      ctx.font = '400 ' + Math.round(30 * u) + 'px Inter';
      ctx.fillText(p.where, tx, cy + 84 * u);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
