<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Memorial End Card</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Memorial End Card, a sample template for Pulp. CC0-1.0: no rights reserved.
  // The words are a block, so another line -- a verse, a place -- joins the stack and takes
  // its turn in the same slow fade. Everything has cleared by the last frame.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeInOut(clamp01(t / 1.6));
    var gone = easeInOut(clamp01((t - (d - 1.4)) / 1.4));
    var show = come * (1 - gone);
    if (show <= 0.001) return;

    ctx.globalAlpha = show;
    ctx.fillStyle = '#121014';
    ctx.fillRect(0, 0, W, H);
    // The candle glow breathes: a slow, shallow swell, never a flicker.
    var breath = 1 + 0.06 * Math.sin(t * 1.3);
    var g = ctx.createRadialGradient(W / 2, H * 0.52, 0, W / 2, H * 0.52, Math.min(W, H) * 0.55 * breath);
    g.addColorStop(0, p.glow + '55');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeInOut(clamp01((t - 0.5 - position * 0.45) / 1.4));
        return { alpha: lineIn * (1 - gone) };
      }
    });
    window.pulpDrawBlock(ctx, laid);
  };
</script>
</body>
</html>
