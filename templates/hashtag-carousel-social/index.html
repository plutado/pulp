<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hashtag Carousel</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hashtag Carousel, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The carousel rolls the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.6)), gone = easeOut(clamp01((t - (d - 0.8)) / 0.8));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var tags = [String(p.t1), String(p.t2), String(p.t3)];
    var ch = 110 * u;
    ctx.font = '700 ' + Math.round(44 * u) + 'px Montserrat';
    var widest = 0;
    for (var i = 0; i < tags.length; i++) widest = Math.max(widest, ctx.measureText(tags[i]).width);
    var cw = ch * 1.1 + widest + 60 * u;
    var x = W / 2 - cw / 2, y = H * 0.76;
    ctx.globalAlpha = show;
    rr(x, y, cw, ch, ch / 2);
    ctx.fillStyle = rgba(p.chip, 0.95); ctx.fill();
    ctx.fillStyle = rgba(p.hash, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(60 * u) + 'px Montserrat';
    ctx.fillText('#', x + ch * 0.55, y + ch / 2 + 2 * u);
    // The carousel: each tag slides up and out on a fixed beat, round and round.
    var beat = 1.4, slot = (t / beat) % tags.length;
    var idx = Math.floor(slot), f = slot - idx;
    var lift = easeInOut(clamp01((f - 0.72) / 0.28));
    ctx.save();
    ctx.beginPath(); ctx.rect(x + ch * 0.95, y + 8 * u, cw - ch, ch - 16 * u); ctx.clip();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '700 ' + Math.round(44 * u) + 'px Montserrat';
    ctx.fillText(tags[idx], x + ch * 1.05, y + ch / 2 + 2 * u - lift * ch);
    ctx.fillText(tags[(idx + 1) % tags.length], x + ch * 1.05, y + ch / 2 + 2 * u + ch - lift * ch);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
