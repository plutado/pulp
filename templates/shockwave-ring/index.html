<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shockwave ring</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // An effect on transparency, a sample for Pulp (milestone 45). CC0-1.0: no rights reserved.
  // Everything is drawn from the frame's own time and a seeded generator, so a frame is the same
  // picture on every render; a looping effect is built from whole cycles, so its last moment meets
  // its first however fast it is asked to run.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function frac(x) { return x - Math.floor(x); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeIn(x) { return x * x * x; }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + Math.max(0, a).toFixed(4) + ')'; }
  /** The colour lightened (k > 0) or darkened (k < 0), so one knob gives an effect its whole range. */
  function shade(c, k, a) {
    var t = k > 0 ? 255 : 0, m = Math.abs(k);
    var r = Math.round(hex(c, 1) + (t - hex(c, 1)) * m), g = Math.round(hex(c, 3) + (t - hex(c, 3)) * m), b = Math.round(hex(c, 5) + (t - hex(c, 5)) * m);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + Math.max(0, a === undefined ? 1 : a).toFixed(4) + ')';
  }
  /** A seeded stream: the same i gives the same number every time, on every machine. */
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function at2(i) { var x = Math.sin(i * 39.3467 + 11.135) * 24634.6345; return x - Math.floor(x); }
  /** Whole cycles only: the speed knob changes how many times it goes round, never where it ends. */
  function cycles(base, p) { return Math.max(1, Math.round(base * p.speed)); }
  /** A soft round glow. `k` lightens or darkens the colour, so a caller never builds one itself. */
  function blob(x, y, r, c, a, k) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(0.01, r));
    g.addColorStop(0, shade(c, k || 0, a)); g.addColorStop(1, shade(c, k || 0, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); ctx.fill();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    var W = state.width, H = state.height, d = state.duration || 1, t = state.time;
    // The loop's phase: 0 at the start and again at the end.
    var u = frac(t / d);
    // One-shot effects run once, the speed knob deciding how soon they are over.
    var pr = clamp01((t / d) * p.speed);
    var S = Math.min(W, H) * 0.01 * p.size;
    var N = p.density;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    draw(W, H, p, u, S, N, pr, t, d);
    ctx.restore();
  };

  function draw(W, H, p, u, S, N, pr) {
    if (pr <= 0) return;
    ctx.globalCompositeOperation = 'lighter';
    var rings = Math.max(1, Math.round(3 * N));
    for (var k = 0; k < rings; k++) {
      var f = clamp01((pr - k * 0.08) / 0.92);
      if (f <= 0) continue;
      var r = easeOut(f) * Math.min(W, H) * 0.52 * p.size;
      ctx.strokeStyle = shade(p.color, 0.3, 0.75 * (1 - f) * (1 - k * 0.25));
      ctx.lineWidth = Math.max(1, S * 2.4 * (1 - f));
      ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.stroke();
    }
    blob(W / 2, H / 2, Math.min(W, H) * 0.2 * p.size * (1 - pr), p.color, 0.5 * (1 - pr));
  }
</script>
</body>
</html>
