<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Velvet spotlight</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
  function rgba(hex, a) { var c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' + Math.round(x[1] + (y[1] - x[1]) * t) + ',' + Math.round(x[2] + (y[2] - x[2]) * t) + ')'; }
  // A seeded generator: a still is the same picture on every frame and every render, so nothing here is random.
  function rng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // A linear gradient along an angle (0 is bottom to top, as a clock hand at 12), spanning the frame.
  function along(W, H, deg) { var a = (deg - 90) * Math.PI / 180, cx = W / 2, cy = H / 2, L = Math.abs(W * Math.cos(a)) / 2 + Math.abs(H * Math.sin(a)) / 2; return ctx.createLinearGradient(cx - Math.cos(a) * L, cy - Math.sin(a) * L, cx + Math.cos(a) * L, cy + Math.sin(a) * L); }
  // Draw a pattern turned by an angle about the center, over a square big enough to stay covered.
  function turned(W, H, deg, fn) { var D = Math.ceil(Math.sqrt(W * W + H * H)); ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(deg * Math.PI / 180); ctx.translate(-D / 2, -D / 2); ctx.beginPath(); ctx.rect(0, 0, D, D); ctx.clip(); fn(D); ctx.restore(); }
  // Film grain, as a seeded noise tile laid over the picture; the amount is a parameter.
  var grainTile = null;
  function grain(W, H, amount) {
    if (!(amount > 0)) return;
    if (!grainTile) {
      var t = document.createElement('canvas'); t.width = 256; t.height = 256;
      var g = t.getContext('2d'), img = g.createImageData(256, 256), r = rng(11);
      for (var i = 0; i < img.data.length; i += 4) { var v = Math.floor(r() * 256); img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255; }
      g.putImageData(img, 0, 0); grainTile = t;
    }
    ctx.save(); ctx.globalAlpha = amount * 0.35; ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(grainTile, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  function vignette(W, H, amount) {
    if (!(amount > 0)) return;
    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + amount.toFixed(3) + ')');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    var W = state.width, H = state.height, S = Math.min(W, H) * p.scale;
    ctx.save();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    draw(W, H, p, S);
    ctx.restore();
    grain(W, H, p.grain);
  };

  function draw(W, H, p, S) {
    ctx.fillStyle = p.base; ctx.fillRect(0, 0, W, H);
    var r = rng(71);
    turned(W, H, 90, function (D) {
      for (var i = 0; i < 18; i++) { var x = r() * D, w = D * (0.02 + r() * 0.06); var g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, rgba(p.fold, 0)); g.addColorStop(0.5, rgba(p.fold, 0.5)); g.addColorStop(1, rgba(p.fold, 0)); ctx.fillStyle = g; ctx.fillRect(x, 0, w, D); }
    });
    var a = (p.angle - 90) * Math.PI / 180, lx = W / 2 + Math.cos(a) * W * 0.25, ly = H * 0.35 + Math.sin(a) * H * 0.2;
    var l = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 0.6 * p.scale); l.addColorStop(0, rgba(p.light, 0.55)); l.addColorStop(0.3, rgba(p.light, 0.2)); l.addColorStop(1, rgba(p.light, 0));
    ctx.fillStyle = l; ctx.fillRect(0, 0, W, H);
    vignette(W, H, 0.6);
  }
</script>
</body>
</html>
