<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spotlight</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Spotlight, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The beams cross and the pool is lit by 1.3 s; the stage then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    ctx.fillStyle = rgba(p.floor, 1); ctx.fillRect(0, 0, W, H);
    var swing = easeInOut(clamp01(t / 1.1));
    ctx.globalAlpha = 1 - gone;
    for (var side = 0; side < 2; side++) {
      var ox = side ? W * 0.9 : W * 0.1;
      var a0 = side ? Math.PI * 0.75 : Math.PI * 0.25;
      var a1 = side ? Math.PI * 1.22 : -Math.PI * 0.22;
      var a = a0 + (a1 - a0) * swing;
      ctx.save();
      ctx.translate(ox, -H * 0.05);
      ctx.rotate(a - Math.PI / 2);
      var g = ctx.createLinearGradient(0, 0, 0, H * 1.5);
      g.addColorStop(0, rgba(p.beam, 0.5)); g.addColorStop(1, rgba(p.beam, 0.02));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-W * 0.11, H * 1.5); ctx.lineTo(W * 0.11, H * 1.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // Where the beams cross, a pool of light; the title stands in it.
    var lit = easeOut(clamp01((t - 0.8) / 0.5));
    var g2 = ctx.createRadialGradient(W / 2, H * 0.58, 0, W / 2, H * 0.58, H * 0.4);
    g2.addColorStop(0, rgba(p.beam, 0.3 * lit)); g2.addColorStop(1, rgba(p.beam, 0));
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = (1 - gone) * lit;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fdf8ec';
    ctx.font = '700 ' + Math.round(96 * u) + 'px Playfair';
    ctx.fillText(p.title, W / 2, H * 0.56);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
