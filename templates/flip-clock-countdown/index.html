<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flip Clock</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Flip Clock, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The cards count across the clip, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.4)), gone = easeOut(clamp01((t - (d - 0.6)) / 0.6));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var from = Math.round(p.from);
    var perStep = (d - 1) / from;
    var step = Math.min(from, Math.floor(t / perStep));
    var current = Math.max(0, from - step);
    var within = clamp01((t - step * perStep) / 0.35);
    var flipping = within < 1 && step > 0 && t < d - 1;
    var cw = Math.min(W, H) * 0.42, ch = cw * 1.2;
    var x = W / 2 - cw / 2, y = H / 2 - ch / 2;
    ctx.globalAlpha = show;
    function card(value, topHalf, scaleY) {
      ctx.save();
      ctx.translate(x + cw / 2, y + ch / 2);
      ctx.scale(1, Math.max(0.0001, scaleY));
      ctx.translate(-(x + cw / 2), -(y + ch / 2));
      ctx.beginPath();
      if (topHalf) ctx.rect(x, y, cw, ch / 2 - 2 * u); else ctx.rect(x, y + ch / 2 + 2 * u, cw, ch / 2 - 2 * u);
      ctx.clip();
      rr(x, y, cw, ch, cw * 0.08);
      ctx.fillStyle = rgba(p.card, 1); ctx.fill();
      ctx.fillStyle = rgba(p.digit, 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(ch * 0.78) + 'px "Bebas Neue"';
      ctx.fillText(String(value), x + cw / 2, y + ch / 2 + ch * 0.04);
      ctx.restore();
    }
    var previous = Math.min(from, current + 1);
    card(current, true, 1);
    card(flipping ? previous : current, false, 1);
    if (flipping) {
      if (within < 0.5) card(previous, true, 1 - within * 2);
      else card(current, false, (within - 0.5) * 2);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x, y + ch / 2 - 2 * u, cw, 4 * u);
  };
</script>
</body>
</html>
