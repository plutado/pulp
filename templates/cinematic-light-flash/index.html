<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cinematic light flash</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Pulp sample template. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInQuad(x) { return x * x; }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hash(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    var s = Math.min(W, H) / 1080;
    var pr = state.progress;
    // A quick rise to white, then a long slow fall.
    var rise = easeInQuad(clamp01(pr * 2));
    var fall = 1 - easeInOutCubic(clamp01(pr * 2 - 1));
    var level = pr < 0.5 ? rise : fall;
    if (level <= 0) return;

    var warm = hexToRgb(p.warm), peak = hexToRgb(p.peak);
    var tint = mix(peak, warm, p.warmth * (1 - level * 0.5));
    var cx = W / 2, cy = H / 2;

    // The anamorphic streak: a horizontal band fading out at both ends, growing in height as it rises.
    var streakW = W * p.streak * (0.6 + 0.4 * level);
    var streakH = H * (0.03 + 0.25 * level);
    var sg = ctx.createLinearGradient(cx - streakW / 2, 0, cx + streakW / 2, 0);
    sg.addColorStop(0, rgba(tint, 0));
    sg.addColorStop(0.3, rgba(tint, 0.7));
    sg.addColorStop(0.5, rgba(peak, 1));
    sg.addColorStop(0.7, rgba(tint, 0.7));
    sg.addColorStop(1, rgba(tint, 0));
    var vg = ctx.createLinearGradient(0, cy - streakH, 0, cy + streakH);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.5, 'rgba(0,0,0,1)');
    vg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = clamp01(level * 1.4);
    ctx.fillStyle = sg;
    ctx.fillRect(cx - streakW / 2, cy - streakH, streakW, streakH * 2);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.globalAlpha = 1;
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // The bloom: a soft warm glow spreading from the center.
    var far = Math.sqrt(W * W + H * H) / 2;
    var bloomR = far * (0.3 + 0.9 * level);
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, bloomR);
    bg.addColorStop(0, rgba(peak, 0.9));
    bg.addColorStop(0.4, rgba(tint, 0.6));
    bg.addColorStop(1, rgba(warm, 0));
    ctx.globalAlpha = clamp01(level * 1.2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // The full-frame wash: at the midpoint the whole frame is the peak colour.
    var wash = clamp01((level - 0.45) / 0.55);
    if (wash > 0) {
      ctx.globalAlpha = wash;
      ctx.fillStyle = p.peak;
      ctx.fillRect(0, 0, W, H);
    }

    // Grain: a fixed budget of tiny warm and dark specks, re-seeded each frame.
    var count = Math.round(1600 * p.grain);
    var seed = state.frame * 7919;
    var size = Math.max(1, 2 * s);
    for (var i = 0; i < count; i++) {
      var gx = hash(seed + i * 3) * W, gy = hash(seed + i * 3 + 1) * H;
      var light = hash(seed + i * 3 + 2) > 0.5;
      ctx.fillStyle = light ? p.peak : p.warm;
      ctx.globalAlpha = level * (light ? 0.5 : 0.35);
      ctx.fillRect(gx, gy, size, size);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
