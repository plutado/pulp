<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>This Week</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // This Week, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The lines write themselves a beat apart, done by 1.9 s; the page then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = '#c9c2b2'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    var pw = Math.min(W * 0.6, 860 * u), ph = Math.min(H * 0.78, 780 * u);
    var px2 = W / 2 - pw / 2, py2 = H / 2 - ph / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    rr(px2 + 6 * u, py2 + 10 * u, pw, ph, 6 * u); ctx.fill();
    ctx.fillStyle = rgba(p.paper, 1);
    rr(px2, py2, pw, ph, 6 * u); ctx.fill();
    // The rulings and the red margin every notebook has.
    ctx.strokeStyle = 'rgba(120,150,190,0.35)'; ctx.lineWidth = 1.5 * u;
    for (var y = py2 + ph * 0.18; y < py2 + ph - 20 * u; y += ph * 0.09) {
      ctx.beginPath(); ctx.moveTo(px2 + 16 * u, y); ctx.lineTo(px2 + pw - 16 * u, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(220,110,110,0.6)'; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(px2 + pw * 0.14, py2 + 10 * u); ctx.lineTo(px2 + pw * 0.14, py2 + ph - 10 * u); ctx.stroke();
    // Two punched holes.
    ctx.fillStyle = '#c9c2b2';
    ctx.beginPath(); ctx.arc(px2 + pw * 0.07, py2 + ph * 0.3, 10 * u, 0, Math.PI * 2); ctx.arc(px2 + pw * 0.07, py2 + ph * 0.7, 10 * u, 0, Math.PI * 2); ctx.fill();
    // The writing: each line clipped on by its own reveal, as if written.
    var rows = [
      { txt: p.title, size: 64, at: 0.2, under: true },
      { txt: p.l1, size: 42, at: 0.8 },
      { txt: p.l2, size: 42, at: 1.4 },
    ];
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < rows.length; i++) {
      var wrote = easeInOut(clamp01((t - rows[i].at) / 0.55));
      if (wrote <= 0) continue;
      var y2 = py2 + ph * (0.24 + i * 0.16);
      ctx.save();
      ctx.beginPath(); ctx.rect(px2, y2 - ph * 0.1, pw * (0.18 + 0.82 * wrote), ph * 0.14); ctx.clip();
      ctx.fillStyle = rgba(p.ink, 0.95);
      ctx.font = '600 ' + Math.round(rows[i].size * u) + 'px Caveat';
      ctx.fillText(rows[i].txt, px2 + pw * 0.18, y2);
      ctx.restore();
      if (rows[i].under && wrote > 0.4) {
        ctx.strokeStyle = rgba(p.ink, 0.8); ctx.lineWidth = 3 * u; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px2 + pw * 0.18, y2 + 12 * u);
        ctx.lineTo(px2 + pw * 0.18 + (pw * 0.24) * clamp01((wrote - 0.4) / 0.6), y2 + 14 * u);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
