<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Handle Capsule</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Handle Capsule, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The capsule scales up from its left end and the dots pop in one after another; still through the hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var inFor = 0.8, outFor = 0.8, outAt = d - outFor;
    var come = easeOut(clamp01(t / inFor)), gone = easeOut(clamp01((t - outAt) / outFor));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var b = state.blocks.words.box;

    var pad = 22 * u;
    var sx = b.x - pad, sy = b.y - pad, sw = b.width + pad * 2, sh = b.height + pad * 2;
    var grow = overshoot(clamp01(t / inFor)) * (1 - gone);
    ctx.save();
    ctx.translate(sx, sy + sh / 2);
    ctx.scale(Math.max(0.001, grow), 1);
    ctx.translate(-sx, -(sy + sh / 2));
    var g = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
    g.addColorStop(0, p.from);
    g.addColorStop(1, p.to);
    rr(sx, sy, sw, sh, sh / 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    for (var i = 0; i < 4; i++) {
      var pop = overshoot(clamp01((t - 0.5 - i * 0.1) / 0.4)) * (1 - gone);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(sx + sw - 30 * u - i * 22 * u, sy + sh - 14 * u, 6 * u * pop, 0, Math.PI * 2);
      ctx.fill();
    }

    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.15 - position * 0.15) / 0.5));
        return { alpha: lineIn * (1 - gone), dy: (1 - lineIn) * 10 * u };
      }
    });
    window.pulpDrawBlock(ctx, laid);
  };
</script>
</body>
</html>
