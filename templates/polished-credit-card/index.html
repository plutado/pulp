<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Credit Card</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // A polished object on transparency (milestone 67, docs/art-direction.md). CC0-1.0: no rights reserved.
  // A vector drawing in a box of 100 units, scaled to the frame, so it stays sharp at any size.
  // One soft light (the Light from parameter), layered depth from gradients, a named material,
  // a contact and a soft shadow, and a light entrance that settles without a bounce.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function settle(x) { var c = 0.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + Math.max(0, a).toFixed(4) + ')'; }
  function shade(c, k) { var t = k > 0 ? 255 : 0, m = Math.abs(k), two = function (v) { return (v < 16 ? '0' : '') + v.toString(16); }; return '#' + two(Math.round(hex(c, 1) + (t - hex(c, 1)) * m)) + two(Math.round(hex(c, 3) + (t - hex(c, 3)) * m)) + two(Math.round(hex(c, 5) + (t - hex(c, 5)) * m)); }
  function rrPath(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function rr(x, y, w, h, r, fill) { rrPath(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
  function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function poly(pts, fill) { ctx.beginPath(); for (var i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
  function seg(x1, y1, x2, y2, stroke, lw) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  function lin(x1, y1, x2, y2, stops) { var g = ctx.createLinearGradient(x1, y1, x2, y2); for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]); return g; }

  /* The one light: -1 from the left, 0 from the top, +1 from the right. Every gradient, specular
     catch and shadow reads it, so changing the light moves them together and nothing else. */
  var LX = -1;
  /* A surface's gradient from its lit side to its shaded side, along the light. */
  function litG(x, y, w, h, stops) { if (LX === 0) return lin(x, y, x, y + h, stops); return LX < 0 ? lin(x, y, x + w, y + h * 0.35, stops) : lin(x + w, y, x, y + h * 0.35, stops); }
  /* The material vocabulary (docs/art-direction.md): what a body surface is filled with. */
  function matFill(x, y, w, h, m, a) {
    if (m === 'frosted-glass') return litG(x, y, w, h, [[0, 'rgba(255,255,255,0.55)'], [0.5, rgba(shade(a, 0.55), 0.4)], [1, rgba(shade(a, 0.1), 0.42)]]);
    if (m === 'clear-glass') return litG(x, y, w, h, [[0, 'rgba(255,255,255,0.3)'], [0.5, rgba(shade(a, 0.5), 0.16)], [1, rgba(shade(a, 0), 0.22)]]);
    if (m === 'brushed-metal') return litG(x, y, w, h, [[0, '#d9dde1'], [0.55, '#9aa1a9'], [1, '#7d848d']]);
    if (m === 'polished-metal') return litG(x, y, w, h, [[0, '#f4f6f8'], [0.38, '#8d959e'], [0.6, '#e7eaed'], [1, '#555c65']]);
    return litG(x, y, w, h, [[0, shade(a, 0.2)], [1, shade(a, -0.26)]]);
  }
  /* Fine parallel strokes over brushed metal, clipped to the caller's path; a whisper, not a texture. */
  function brushed(x, y, w, h) { ctx.save(); ctx.clip(); ctx.globalAlpha *= 0.05; ctx.strokeStyle = '#ffffff'; for (var yy = y + 1.2; yy < y + h; yy += 2.4) seg(x, yy, x + w, yy, '#ffffff', 0.5); ctx.restore(); }
  /* How strongly a material catches the light: the one or two specular touches a piece is allowed. */
  function specAlpha(m) { return m === 'polished-metal' || m === 'clear-glass' ? 0.75 : m === 'frosted-glass' ? 0.5 : m === 'brushed-metal' ? 0.35 : 0.2; }
  function spec(x, y, r, a) { var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)'); circ(x, y, r, g); }
  /* The light-catching edge a glass surface wears on its lit side. */
  function litEdge(x1, y1, x2, y2, m) { if (m === 'frosted-glass' || m === 'clear-glass') seg(x1, y1, x2, y2, 'rgba(255,255,255,0.65)', 1); }
  /* The ground: a tight contact shadow where the piece meets it, and a wide soft one cast away
     from the light. Neutral and transparent, so they darken the footage rather than cover it. */
  function ground(y, w, mode) {
    if (mode === 'none') return;
    var sx = -LX * 5;
    if (mode === 'soft') { var g = ctx.createRadialGradient(sx, y, 1, sx, y, w); g.addColorStop(0, 'rgba(8,10,14,0.22)'); g.addColorStop(1, 'rgba(8,10,14,0)'); ctx.save(); ctx.translate(sx, y); ctx.scale(1, 0.16); ctx.beginPath(); ctx.arc(0, 0, w, 0, TAU); ctx.fillStyle = g; ctx.fill(); ctx.restore(); }
    var c = ctx.createRadialGradient(sx * 0.4, y, 0.5, sx * 0.4, y, w * 0.42);
    c.addColorStop(0, 'rgba(8,10,14,0.34)'); c.addColorStop(1, 'rgba(8,10,14,0)');
    ctx.save(); ctx.translate(sx * 0.4, y); ctx.scale(1, 0.09); ctx.beginPath(); ctx.arc(0, 0, w * 0.42, 0, TAU); ctx.fillStyle = c; ctx.fill(); ctx.restore();
  }
  /* The soft dark band where one surface sits over another. */
  function occlude(x, y, w) { var g = lin(x, y, x, y + 2.4, [[0, 'rgba(8,10,14,0.22)'], [1, 'rgba(8,10,14,0)']]); ctx.fillStyle = g; ctx.fillRect(x, y, w, 2.4); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);
    LX = p.light === 'right' ? 1 : p.light === 'top' ? 0 : -1;
    // The entrance over the first 0.8 s, the fade out over the last 0.6 s: the hold the manifest
    // declares. Settled, not bounced: the pop overshoots by a few percent at most.
    var e = clamp01(t / 0.8), gone = clamp01((t - (d - 0.6)) / 0.6);
    if (gone >= 1) return;
    var u = Math.min(W, H) * 0.0036;
    var kind = p.entrance, s = 1, dy = 0, alpha = 1 - gone, clipTo = 1;
    if (kind === 'pop') { s = e < 1 ? 0.92 + 0.08 * settle(e) : 1; alpha *= clamp01(e * 2.5); }
    else if (kind === 'drop') { dy = -(1 - easeOut(e)) * 26; alpha *= clamp01(e * 2.5); }
    else if (kind === 'rise') { dy = (1 - easeOut(e)) * 22; alpha *= easeOut(e); }
    else if (kind === 'draw') { clipTo = easeOut(e); }
    else { alpha *= easeOut(e); }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H / 2 + dy * u);
    ctx.scale(u * s, u * s);
    if (clipTo < 1) { ctx.beginPath(); ctx.rect(-60, -60, 120 * clipTo, 120); ctx.clip(); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    draw(p);
    ctx.restore();
  };

  /* A shadow cast by a piece floating over the picture — a panel, a chip, a card. The shape is
     drawn far off the frame and only its shadow brought back, so a translucent glass panel never
     shows an opaque copy of itself, and the shadow darkens the footage rather than covering it. */
  function floatShadow(path, mode, lw) {
    if (mode === 'none') return;
    // Moved off the frame along the frame's own y, in device pixels, so a piece drawn turned (the
    // tag) casts its shadow under itself rather than off along its turned axis.
    var t = ctx.getTransform(), k = Math.hypot(t.c, t.d), soft = mode === 'soft', far = 8000;
    ctx.save();
    ctx.setTransform(t.a, t.b, t.c, t.d, t.e, t.f - far);
    ctx.shadowColor = soft ? 'rgba(8,10,14,0.32)' : 'rgba(8,10,14,0.42)';
    ctx.shadowBlur = (soft ? 7 : 1.6) * k;
    ctx.shadowOffsetX = -LX * (soft ? 2.2 : 0.6) * k;
    ctx.shadowOffsetY = far + (soft ? 4 : 1.2) * k;
    path();
    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.stroke(); } else { ctx.fillStyle = '#000'; ctx.fill(); }
    ctx.restore();
  }
  /* A face of a material at a lightness: the accent's own shade for matte, a translucent one for
     glass, and a neutral gray for metal — for drawings made of several faces, like a pie's slices. */
  function tone(m, a, k) {
    if (m === 'frosted-glass') return rgba(shade(a, Math.min(0.9, k + 0.45)), 0.5);
    if (m === 'clear-glass') return rgba(shade(a, Math.min(0.9, k + 0.35)), 0.28);
    if (m === 'brushed-metal' || m === 'polished-metal') return shade('#9aa1a9', k * (m === 'polished-metal' ? 1.4 : 1));
    return shade(a, k);
  }
  /* The shading over a sphere: bright toward the light, dark at the far rim. */
  function sphereShade(x, y, r) {
    var hx = x + (LX === 0 ? 0 : LX * r * 0.4), hy = y - r * 0.45;
    var g = ctx.createRadialGradient(hx, hy, r * 0.05, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.32)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(8,10,14,0.36)');
    circ(x, y, r, g);
  }
  /* The rim of a glass or metal sphere catching the light: one crescent on the lit shoulder. */
  function crescent(x, y, r, m, lw) {
    var lo = LX > 0 ? -1.25 : LX < 0 ? Math.PI + 0.45 : -Math.PI * 0.75, hi = LX > 0 ? -0.45 : LX < 0 ? Math.PI + 1.25 : -Math.PI * 0.25;
    ctx.beginPath(); ctx.arc(x, y, r, lo, hi, false);
    ctx.strokeStyle = 'rgba(255,255,255,' + (specAlpha(m) * 0.7).toFixed(3) + ')'; ctx.lineWidth = lw || 2.2; ctx.stroke();
  }
  /* Tinted glass: the accent washed into a glass face, strongest away from the light, so a flat
     panel carries the project's palette and not only its bar. Nothing for metal or matte. */
  function glassTint(path, x, y, w, h, m, a) {
    if (m.indexOf('glass') < 0) return;
    path(); ctx.fillStyle = litG(x, y, w, h, [[0, rgba(a, m === 'clear-glass' ? 0.06 : 0.12)], [1, rgba(a, m === 'clear-glass' ? 0.22 : 0.4)]]); ctx.fill();
  }
  /* Where the light sits along x for a highlight: left, middle or right of a span. */
  function lit(span) { return LX === 0 ? 0 : LX * span; }
  /* A card 85.6 x 54 mm (ID-1), lying back and turned: drawn in its own flat coordinates and
     carried onto the picture by a perspective of four corners. */
  var C = [[-41, -14], [28, -30], [43, 12], [-27, 30]], TH = 1.4;
  function Q(u, v) { // u 0..1 along the long side, v 0..1 down the short side
    var top = [C[0][0] + (C[1][0] - C[0][0]) * u, C[0][1] + (C[1][1] - C[0][1]) * u];
    var bot = [C[3][0] + (C[2][0] - C[3][0]) * u, C[3][1] + (C[2][1] - C[3][1]) * u];
    return [top[0] + (bot[0] - top[0]) * v, top[1] + (bot[1] - top[1]) * v];
  }
  function quad(u0, v0, u1, v1) { var a = Q(u0, v0), b = Q(u1, v0), c = Q(u1, v1), d = Q(u0, v1); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); }
  /* The card's outline with rounded corners, in card space. */
  function cardPath(dy) {
    var r = 0.045, rv = r * 85.6 / 54, n = 6, pts = [];
    var corner = function (cu, cv, a0) { for (var i = 0; i <= n; i++) { var t = a0 + i / n * Math.PI / 2; pts.push(Q(cu + r * Math.cos(t), cv + rv * Math.sin(t))); } };
    corner(1 - r, rv, -Math.PI / 2); corner(1 - r, 1 - rv, 0); corner(r, 1 - rv, Math.PI / 2); corner(r, rv, Math.PI);
    ctx.beginPath(); for (var i = 0; i < pts.length; i++) { if (i) ctx.lineTo(pts[i][0], pts[i][1] + (dy || 0)); else ctx.moveTo(pts[i][0], pts[i][1] + (dy || 0)); } ctx.closePath();
  }
  function draw(p) {
    var m = p.material, a = p.accent, glass = m.indexOf('glass') >= 0;
    // A card lies on the surface: a soft shadow under it, cast away from the light.
    if (p.shadow !== 'none') floatShadow(function () { cardPath(TH); }, p.shadow === 'soft' ? 'soft' : 'contact');
    // The edge: the card's thickness showing along its near sides.
    cardPath(TH); ctx.fillStyle = glass ? rgba(shade(a, -0.2), m === "clear-glass" ? 0.3 : 0.5) : m === "matte" ? shade(a, -0.45) : tone(m, a, -0.35); ctx.fill();
    // The face.
    var face;
    if (m === 'matte') face = lin(C[0][0], C[0][1], C[2][0], C[2][1], [[0, shade(a, 0.22)], [0.55, a], [1, shade(a, -0.3)]]);
    else face = matFill(-36, -26, 74, 52, m, a);
    cardPath(); ctx.fillStyle = face; ctx.fill();
    glassTint(cardPath, -36, -26, 74, 52, m, a);
    ctx.save(); cardPath(); ctx.clip();
    if (m === 'brushed-metal') { cardPath(); brushed(-40, -30, 80, 60); }
    // A quiet wave across the face, a lighter tint of the accent: the design, not a brand.
    var w0 = Q(0, 0.75), w1 = Q(0.45, 0.35), w2 = Q(0.7, 1.05), w3 = Q(1, 0.45);
    ctx.beginPath(); ctx.moveTo(w0[0], w0[1]); ctx.bezierCurveTo(w1[0], w1[1], w2[0], w2[1], w3[0], w3[1]);
    var e1 = Q(1, 1), e0 = Q(0, 1); ctx.lineTo(e1[0], e1[1]); ctx.lineTo(e0[0], e0[1]); ctx.closePath();
    ctx.fillStyle = glass ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.07)'; ctx.fill();
    // The sheen: one broad soft band across the face from the lit side.
    var s0 = Q(LX > 0 ? 0.95 : LX < 0 ? 0.05 : 0.5, 0), s1 = Q(LX > 0 ? 0.35 : LX < 0 ? 0.65 : 0.5, 1);
    ctx.fillStyle = lin(s0[0], s0[1], s1[0], s1[1], [[0, 'rgba(255,255,255,' + (0.12 + specAlpha(m) * 0.25).toFixed(3) + ')'], [0.6, 'rgba(255,255,255,0)']]);
    ctx.fillRect(-45, -35, 90, 70);
    ctx.restore();
    // The chip: gold, with its contact lines.
    quad(0.1, 0.36, 0.25, 0.6);
    var c0 = Q(0.1, 0.36), c1 = Q(0.25, 0.6);
    ctx.fillStyle = lin(c0[0], c0[1], c1[0], c1[1], [[0, '#f3dc9a'], [0.5, '#c9a24f'], [1, '#e6c77a']]); ctx.fill();
    ctx.strokeStyle = 'rgba(110,80,25,0.55)'; ctx.lineWidth = 0.35;
    [[0.1, 0.44, 0.25, 0.44], [0.1, 0.52, 0.25, 0.52], [0.175, 0.36, 0.175, 0.6]].forEach(function (l) { var x = Q(l[0], l[1]), y = Q(l[2], l[3]); ctx.beginPath(); ctx.moveTo(x[0], x[1]); ctx.lineTo(y[0], y[1]); ctx.stroke(); });
    // The contactless mark: three nested arcs, beside the chip.
    var cm = Q(0.32, 0.48);
    for (var i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(cm[0], cm[1], 1.2 + i * 1.3, 1.4 + i * 1.5, -0.2, -0.9, 0.9); ctx.strokeStyle = glass ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.55)'; ctx.lineWidth = 0.55; ctx.stroke(); }
    // The number: four groups of four raised dots, each with a light top and a dark foot.
    for (var g = 0; g < 4; g++) for (var k = 0; k < 4; k++) {
      var u = 0.1 + g * 0.2 + k * 0.038, d = Q(u, 0.72);
      circ(d[0] + 0.25, d[1] + 0.35, 0.95, 'rgba(8,10,14,0.25)');
      circ(d[0], d[1], 0.95, glass ? 'rgba(255,255,255,0.75)' : m === 'matte' ? shade(a, 0.7) : '#eef1f4');
    }
    // The holder's line and the expiry, as short raised bars.
    var bar = function (u0, u1, v) { var x = Q(u0, v), y = Q(u1, v); seg(x[0], x[1], y[0], y[1], glass ? 'rgba(255,255,255,0.55)' : m === 'matte' ? rgba(shade(a, 0.7), 0.8) : 'rgba(238,241,244,0.8)', 1.1); };
    bar(0.1, 0.42, 0.87); bar(0.6, 0.72, 0.87);
    // A small brand-free mark at the far corner: two overlapping rings.
    var mk = Q(0.86, 0.84); ctx.globalAlpha *= 0.8;
    ctx.beginPath(); ctx.ellipse(mk[0] - 1.8, mk[1], 2.6, 2.4, 0, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(mk[0] + 1.8, mk[1], 2.6, 2.4, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha /= 0.8;
    // The lit edge along the card's far side, and the one specular catch near the lit corner.
    var t0 = Q(0.02, 0), t1 = Q(0.98, 0); seg(t0[0], t0[1], t1[0], t1[1], 'rgba(255,255,255,' + (glass ? 0.65 : 0.3) + ')', glass ? 0.8 : 0.5);
    var sp = Q(LX > 0 ? 0.88 : LX < 0 ? 0.12 : 0.5, 0.1); spec(sp[0], sp[1], 5, specAlpha(m) * 0.7);
  }
</script>
</body>
</html>
