<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stat Ring</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Stat Ring, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The ring fills and the figure lands by 1.3 s; both then hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    var come = easeOut(clamp01(t / 0.5));
    var fill2 = easeInOut(clamp01((t - 0.3) / 1.0));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var cx = W * p.x, cy = H * p.y, r = Math.min(W, H) * 0.16;
    ctx.globalAlpha = (1 - gone) * come;
    ctx.lineWidth = r * 0.16; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(p.track, 0.85);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    var share = Math.max(0, Math.min(100, p.value)) / 100;
    ctx.strokeStyle = rgba(p.ring, 1);
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * share * fill2); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 ' + Math.round(r * 0.62) + 'px Montserrat';
    ctx.fillText(Math.round(p.value * fill2) + '%', cx, cy - r * 0.02);
    ctx.fillStyle = 'rgba(203,213,225,0.95)';
    ctx.font = '500 ' + Math.round(r * 0.17) + 'px Inter';
    ctx.fillText(p.label, cx, cy + r + r * 0.35);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
