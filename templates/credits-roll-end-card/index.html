<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Credits Roll</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Credits Roll, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The roll moves the whole time, so the card has a fixed length; the speed is set so the last line clears the top at the end.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = p.back;
    ctx.fillRect(0, 0, W, H);
    var lines = String(p.lines).split('\n').filter(function (l) { return l.trim() !== ''; });
    var size = Math.round(34 * u), lead = size * 2.2;
    var total = lines.length * lead;
    var y0 = H + 40 * u - (t / d) * (H + total + 80 * u);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < lines.length; i++) {
      var y = y0 + i * lead;
      if (y < -lead || y > H + lead) continue;
      var parts = lines[i].split(' — ');
      var fade = clamp01((y - H * 0.08) / (H * 0.1)) * clamp01((H * 0.95 - y) / (H * 0.1));
      ctx.globalAlpha = fade;
      if (parts.length === 2) {
        ctx.fillStyle = rgba(p.ink, 0.6);
        ctx.font = '400 ' + Math.round(size * 0.7) + 'px Inter';
        ctx.fillText(parts[0].toUpperCase(), W / 2, y - size * 0.9);
        ctx.fillStyle = p.ink;
        ctx.font = '500 ' + size + 'px "Source Serif 4"';
        ctx.fillText(parts[1], W / 2, y);
      } else {
        ctx.fillStyle = p.ink;
        ctx.font = 'italic 400 ' + size + 'px "Source Serif 4"';
        ctx.fillText(lines[i], W / 2, y);
      }
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
