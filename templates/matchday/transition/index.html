<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday chevron wipe</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOutQuart(x) { return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; }

  // The leading or trailing edge as a zig-zag of chevron teeth at horizontal position q.
  function toothEdge(q, rows, H, depth, up) {
    var step = H / rows;
    ctx.lineTo(q + (up ? depth : 0), 0);
    for (var i = 0; i < rows; i++) {
      var y0 = i * step, y1 = y0 + step / 2, y2 = y0 + step;
      ctx.lineTo(q + depth, y1);
      ctx.lineTo(q, y2);
    }
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    var rows = Math.max(2, Math.round(p.teeth));
    var depth = H / rows * 0.6;
    var span = W + 2 * depth;
    var pr = state.progress;
    var head = easeInOutQuart(clamp01(pr * 2)) * span - depth;
    var tail = easeInOutQuart(clamp01(pr * 2 - 1)) * span - depth;
    if (head <= tail) return;

    function toothShape(qTail, qHead) {
      ctx.beginPath();
      ctx.moveTo(qTail, 0);
      toothEdge(qHead, rows, H, depth, false);
      // Back along the bottom to the trailing edge, drawn as the same zig-zag reversed.
      ctx.lineTo(qTail, H);
      for (var i = rows - 1; i >= 0; i--) {
        var step = H / rows, y0 = i * step, y1 = y0 + step / 2;
        ctx.lineTo(qTail + depth, y1);
        ctx.lineTo(qTail, y0);
      }
      ctx.closePath();
    }

    toothShape(tail, head);
    ctx.fillStyle = p.panel;
    ctx.fill();

    // The volt teeth ride the moving edge.
    var band = 42 * (Math.min(W, H) / 1080);
    if (pr < 0.5) toothShape(head - band, head);
    else toothShape(tail, tail + band);
    ctx.fillStyle = p.accent;
    ctx.fill();
  };
</script>
</body>
</html>
