<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday title</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeInCubic(x) { return x * x * x; }

  function chevron(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.55, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.55, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w * 0.45, y + h / 2);
    ctx.closePath();
  }

  // Greedy word wrap with the current font; ok is false when a single word is wider than maxW.
  function wrapWords(text, maxW) {
    var words = text.split(/\s+/).filter(Boolean), lines = [], line = '', ok = true;
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (!line || ctx.measureText(test).width <= maxW) line = test;
      else { lines.push(line); line = words[i]; }
      if (ctx.measureText(line).width > maxW) ok = false;
    }
    if (line) lines.push(line);
    return { lines: lines, ok: ok };
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var show = easeOutQuart(clamp01(t / dur)) * (1 - easeInCubic(clamp01((t - (d - dur)) / dur)));
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame keeps its bottom 22% for captions, so the block sits a little above the middle
    // and the headline wraps onto up to three lines inside 86% of the width.
    var tall = H > W * 1.3;
    var cx = W / 2, cy = tall ? H * 0.44 : H / 2;
    var headSize = 132 * s, kickSize = 32 * s;
    var headText = (p.headline || '').toUpperCase();
    var wrapped;
    for (var k = 0; k < 12; k++) {
      ctx.font = '800 ' + headSize + 'px ' + FONT;
      wrapped = wrapWords(headText, 0.86 * W);
      if (wrapped.ok && wrapped.lines.length <= 3) break;
      headSize *= 0.92;
    }
    var lines = wrapped.lines, n = Math.max(1, lines.length), lineH = 140 * s;

    // The volt bar slams in horizontally behind the headline.
    var barH = 150 * s + (n - 1) * lineH;
    var barW = W * (tall ? 0.92 : 0.72) * easeOutQuart(clamp01(show * 1.2));
    ctx.fillStyle = p.accent;
    ctx.fillRect(cx - barW / 2, cy - barH / 2, barW, barH);

    var textA = clamp01((show - 0.3) / 0.7);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Headline knocked out dark on the volt bar.
    ctx.globalAlpha = textA;
    ctx.fillStyle = '#101010';
    ctx.font = '800 ' + headSize + 'px ' + FONT;
    for (var li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], cx, cy + 6 * s + (li - (n - 1) / 2) * lineH);
    }

    // The kicker above, flanked by chevrons.
    ctx.fillStyle = p.text;
    ctx.font = '700 ' + kickSize + 'px ' + FONT;
    var kick = (p.kicker || '').toUpperCase();
    var ky = cy - barH / 2 - 44 * s;
    ctx.fillText(kick, cx, ky);
    var kw = ctx.measureText(kick).width;
    ctx.fillStyle = p.accent;
    var ch = 22 * s, cw = 20 * s;
    chevron(cx - kw / 2 - cw - 22 * s, ky - ch / 2, cw, ch);
    ctx.fill();
    chevron(cx + kw / 2 + 22 * s, ky - ch / 2, cw, ch);
    ctx.fill();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
