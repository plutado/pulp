<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday clock</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInCubic(x) { return x * x * x; }
  function two(n) { return (n < 10 ? '0' : '') + n; }

  function chevron(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.55, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.55, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w * 0.45, y + h / 2);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = (t < dur ? easeOutBack(inT) : 1) * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    var margin = 64 * s, boxH = 72 * s;

    // The clock runs at real speed from the start time.
    var total = Math.floor(Math.max(0, p.minutes) * 60 + Math.max(0, p.seconds) + t);
    var clock = two(Math.floor(total / 60)) + ':' + two(total % 60);
    var period = String(p.period || '').toUpperCase();

    var clockSize = 44 * s, perSize = 28 * s;
    ctx.font = '800 ' + clockSize + 'px ' + FONT;
    var clockW = ctx.measureText('000:00').width + 40 * s;
    ctx.font = '800 ' + perSize + 'px ' + FONT;
    var perW = ctx.measureText(period).width + 44 * s + 24 * s;
    var boxW = clockW + perW;

    var x;
    if (p.position === 'top-left') x = margin;
    else if (p.position === 'top-right') x = W - margin - boxW;
    else x = (W - boxW) / 2;
    var y = margin;

    // The chip pops in with a snappy overshoot around its centre.
    ctx.save();
    ctx.translate(x + boxW / 2, y + boxH / 2);
    ctx.scale(show, show);
    ctx.translate(-(x + boxW / 2), -(y + boxH / 2));
    ctx.globalAlpha = clamp01(show * 2);

    // Volt clock chip with the period panel in black beside it.
    ctx.fillStyle = p.accent;
    ctx.fillRect(x, y, clockW, boxH);
    ctx.fillStyle = p.panel;
    ctx.fillRect(x + clockW, y, perW, boxH);

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#101010';
    ctx.font = '800 ' + clockSize + 'px ' + FONT;
    ctx.fillText(clock, x + clockW / 2, y + boxH / 2 + 2 * s);

    // The period label with a volt chevron leading it; the chevron pulses once a second.
    var ch = 22 * s, cw = 18 * s;
    var pulse = 0.6 + 0.4 * Math.max(0, Math.cos((t % 1) * Math.PI));
    ctx.globalAlpha = clamp01(show * 2) * pulse;
    ctx.fillStyle = p.accent;
    chevron(x + clockW + 20 * s, y + boxH / 2 - ch / 2, cw, ch);
    ctx.fill();
    ctx.globalAlpha = clamp01(show * 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = p.text;
    ctx.font = '800 ' + perSize + 'px ' + FONT;
    ctx.fillText(period, x + clockW + 20 * s + cw + 16 * s, y + boxH / 2 + 2 * s);

    // A thin seconds bar sweeps along the chip's foot.
    ctx.fillStyle = '#101010';
    ctx.fillRect(x, y + boxH - 5 * s, clockW * (t % 1), 5 * s);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
