<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday chevron band</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function easeInQuart(x) { return x * x * x * x; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutBack(clamp01(t / dur));
    var outT = easeInQuart(clamp01((t - (d - dur)) / dur));
    if (outT >= 1) return;
    // Punches in past its size and settles; snaps out by shrinking fast.
    var scale = inT * (1 - outT);
    if (scale <= 0) return;

    var s = Math.min(W, H) / 1080;
    var bandH = 44 * s, margin = 0;
    var vertical = p.edge === 'left' || p.edge === 'right';
    var length = vertical ? H : W;

    // Draw every edge as a bottom band in a rotated frame: along +x, the band's outer edge at y = 0.
    ctx.save();
    if (p.edge === 'bottom') { ctx.translate(0, H - margin); ctx.scale(1, -1); }
    else if (p.edge === 'top') { ctx.translate(0, margin); }
    else if (p.edge === 'left') { ctx.translate(margin, H); ctx.rotate(-Math.PI / 2); }
    else { ctx.translate(W - margin, 0); ctx.rotate(Math.PI / 2); }
    // The band grows out of the edge: scale its thickness only.
    ctx.scale(1, scale);

    ctx.fillStyle = p.panel;
    ctx.fillRect(0, 0, length, bandH);

    // Forward chevrons: each is a bent stripe leaning in the direction of travel, clipped to the band.
    var n = Math.max(2, Math.round(p.count));
    var pitch = length / n;
    var lean = bandH * 0.9;
    var thick = pitch * 0.42;
    var offset = (t * p.speed * pitch) % pitch;
    ctx.beginPath();
    ctx.rect(0, 0, length, bandH);
    ctx.clip();
    ctx.fillStyle = p.accent;
    ctx.beginPath();
    for (var i = -1; i <= n; i++) {
      var x = i * pitch + offset;
      ctx.moveTo(x, 0);
      ctx.lineTo(x + thick, 0);
      ctx.lineTo(x + thick + lean, bandH / 2);
      ctx.lineTo(x + thick, bandH);
      ctx.lineTo(x, bandH);
      ctx.lineTo(x + lean, bandH / 2);
      ctx.closePath();
    }
    ctx.fill();
    // A hairline in the accent along the inner edge of the band.
    ctx.fillRect(0, bandH - Math.max(1, 3 * s), length, Math.max(1, 3 * s));
    ctx.restore();
  };
</script>
</body>
</html>
