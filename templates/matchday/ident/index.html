<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday ident</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  function easeOutBack(x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInBack(x) { var c = 1.7; return (c + 1) * x * x * x - c * x * x; }

  function chevron(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.55, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.55, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w * 0.45, y + h / 2);
    ctx.closePath();
  }

  // Twelve chevrons fly outward from the centre and fade as they go; b runs 0 to 1.
  function burst(cx, cy, b, s, color) {
    if (b <= 0 || b >= 1) return;
    var e = easeOutQuart(b);
    var reach = 60 * s + Math.min(cx, cy) * 1.1 * e;
    ctx.fillStyle = color;
    ctx.globalAlpha = Math.pow(1 - b, 1.5);
    for (var i = 0; i < 12; i++) {
      var ang = i * TAU / 12 + 0.13;
      ctx.save();
      ctx.translate(cx + Math.cos(ang) * reach, cy + Math.sin(ang) * reach);
      ctx.rotate(ang);
      var cw = 70 * s * (1 - 0.5 * e), ch = 46 * s * (1 - 0.5 * e);
      chevron(-cw / 2, -ch / 2, cw, ch);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // Splits words into two balanced lines, measured in the current font.
  function twoLines(text) {
    var words = text.split(/\s+/).filter(Boolean);
    if (words.length < 2) return [text];
    var best = 1, bestDiff = Infinity;
    for (var i = 1; i < words.length; i++) {
      var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      var diff = Math.abs(ctx.measureText(a).width - ctx.measureText(b).width);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
  }

  // The fallback: the name in forward-leaning chunky capitals, centred in the logo's box and fitted
  // to it by measurement; two balanced lines when one line would shrink the type past half its size.
  function wordmark(text, box, color) {
    text = (text || '').trim().toUpperCase();
    if (!text) return;
    var prefix = 'italic 800 ';
    var maxW = box.width * 0.92;
    var size = box.height * 0.42;
    ctx.font = prefix + size + 'px ' + FONT;
    var w = ctx.measureText(text).width;
    var lines = [text];
    var fit = w > maxW ? size * maxW / w : size;
    if (fit < size * 0.5 && text.indexOf(' ') > 0) {
      lines = twoLines(text);
      size = box.height * 0.3;
      fit = size;
      ctx.font = prefix + size + 'px ' + FONT;
      for (var i = 0; i < lines.length; i++) {
        var lw = ctx.measureText(lines[i]).width;
        if (lw > maxW) fit = Math.min(fit, size * maxW / lw);
      }
    }
    size = Math.max(8, Math.floor(fit));
    ctx.font = prefix + size + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    var lineH = size * 1.02;
    var y0 = box.y + box.height / 2 - (lines.length - 1) * lineH / 2;
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], box.x + box.width / 2, y0 + j * lineH + size * 0.06);
  }

  // Image slot: the chosen logo in the box, or the name as a wordmark in the same box.
  function drawLogo(state, box, color) {
    var drawn = window.pulpDrawImage ? window.pulpDrawImage(ctx, state, 'logo', box) : false;
    if (drawn) return;
    var slot = state.images && state.images.logo;
    var words = window.pulpSlotText(state, 'logo', state.params.name);
    if (words) wordmark(words, box, color);
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time;
    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;

    // The ground is part of the ident: black with the set's vignette.
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.ground;
    ctx.fillRect(0, 0, W, H);
    var short = Math.min(W, H);
    var v = ctx.createRadialGradient(cx, cy, short * 0.35, cx, cy, short);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Where the logo rests: a box about the centre that reads the same tall, square and wide.
    var box = { width: Math.min(500 * s, W * 0.8), height: 324 * s };

    // Beats: a burst 0 to 0.6 s, the logo lands 0.1 to 0.55 s with overshoot, holds, then from
    // 1.5 s it winds up and punches out in 0.3 s while a second burst fires.
    var land = easeOutBack(clamp01((t - 0.1) / 0.45));
    var outT = clamp01((t - 1.5) / 0.3);
    var scale = Math.max(0, land * (1 - easeInBack(outT)));

    burst(cx, cy, clamp01(t / 0.6), s, p.accent);
    burst(cx, cy, clamp01((t - 1.55) / 0.45), s, p.accent);

    if (scale <= 0) return;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Two forward chevrons under the mark tick in turn through the hold; they ride the same scale.
    var chevW = 26 * s, chevH = 30 * s, chevY = box.height / 2 + 28 * s;
    var run = Math.floor(t * 6) % 2;
    ctx.fillStyle = p.accent;
    chevron(-chevW - 5 * s, chevY, chevW, chevH);
    ctx.globalAlpha = run === 0 ? 1 : 0.4;
    ctx.fill();
    chevron(5 * s, chevY, chevW, chevH);
    ctx.globalAlpha = run === 1 ? 1 : 0.4;
    ctx.fill();
    ctx.globalAlpha = 1;

    drawLogo(state, { x: -box.width / 2, y: -box.height / 2, width: box.width, height: box.height }, p.text);
    ctx.restore();
  };
</script>
</body>
</html>
