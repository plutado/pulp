<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday follow</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';
  var TAU = Math.PI * 2;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInBack(x) { var c = 1.7; return (c + 1) * x * x * x - c * x * x; }

  function chevron(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.55, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.55, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w * 0.45, y + h / 2);
    ctx.closePath();
  }

  // Sets ctx.font, shrinking the size until the text fits maxW; returns the size used.
  function fitFont(text, prefix, size, maxW) {
    ctx.font = prefix + size + 'px ' + FONT;
    var w = ctx.measureText(text).width;
    if (w > maxW && w > 0) {
      size = Math.max(8, Math.floor(size * maxW / w));
      ctx.font = prefix + size + 'px ' + FONT;
    }
    return size;
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = clamp01((t - (d - dur)) / dur);
    // Punch in with overshoot, hold, punch out with anticipation.
    var scale = t < dur ? easeOutBack(inT) : 1 - easeInBack(outT);
    if (scale <= 0) return;

    var s = Math.min(W, H) / 1080;
    var margin = 96 * s;
    var right = p.side === 'right';
    var chipH = 120 * s, pad = 34 * s;
    var chevW = 26 * s, chevH = 40 * s, chevGap = 6 * s;
    var chevBlock = chevW * 3 + chevGap * 2;
    var maxText = W - margin * 2 - pad * 3 - chevBlock;

    var handle = p.handle || '';
    var label = (p.label || '').toUpperCase().split('').join(' ');
    var handleSize = fitFont(handle, '800 ', 52 * s, maxText);
    var hw = ctx.measureText(handle).width;
    var labelSize = fitFont(label, '700 ', 22 * s, maxText);
    var lw = ctx.measureText(label).width;
    var chipW = pad * 3 + chevBlock + Math.max(hw, lw);

    var x = right ? W - margin - chipW : margin;
    var y = H - margin - chipH;

    // The chip scales about its outer bottom corner so it punches from the frame edge.
    var ox = right ? x + chipW : x, oy = y + chipH;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.translate(-ox, -oy);

    ctx.fillStyle = p.panel;
    ctx.fillRect(x, y, chipW, chipH);
    // A volt bar underlines the chip.
    ctx.fillStyle = p.accent;
    ctx.fillRect(x, y + chipH - 8 * s, chipW, 8 * s);

    // Three chevrons run forward on a deterministic step, the lit one moving along.
    var step = Math.floor(t * 8) % 3;
    var cxs = x + pad;
    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = i === step ? 1 : 0.35;
      chevron(cxs + i * (chevW + chevGap), y + chipH / 2 - chevH / 2 - 4 * s, chevW, chevH);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var textX = x + pad * 2 + chevBlock;
    ctx.fillStyle = p.accent;
    ctx.font = '700 ' + labelSize + 'px ' + FONT;
    ctx.fillText(label, textX, y + 38 * s);
    ctx.fillStyle = p.text;
    ctx.font = '800 ' + handleSize + 'px ' + FONT;
    ctx.fillText(handle, textX, y + 96 * s);
    ctx.restore();
  };
</script>
</body>
</html>
