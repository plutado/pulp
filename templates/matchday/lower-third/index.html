<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matchday lower third</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Matchday sample set for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var FONT = 'Helvetica Neue, Arial, sans-serif';

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutBack(x) { var c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeInCubic(x) { return x * x * x; }

  function chevron(x, y, w, h) {
    // A forward-leaning ">" built from two strokes of a parallelogram.
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.55, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.55, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w * 0.45, y + h / 2);
    ctx.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = (t < dur ? easeOutBack(inT) : 1) * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame keeps the bottom 22% for captions and the right 18% for controls, so the
    // unit sits with its baseline near 72% of the height and stays inside 82% of the width.
    var tall = H > W * 1.3;
    var margin = tall ? 0.06 * W : 96 * s, barH = 120 * s;
    var nameSize = 58 * s, roleSize = 28 * s;
    var y = tall ? 0.72 * H - barH : H - margin - barH;
    var chevW = 44 * s, padX = 40 * s;
    // Image slot: a square badge at the head of the panel when a logo is chosen; the type moves
    // over to make room. With no logo the slot falls back to the name, which the panel carries.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    var badge = hasLogo ? barH - 2 * 16 * s : 0;
    var badgeGap = hasLogo ? 24 * s : 0;

    var nameText = (p.name || '').toUpperCase(), roleText = (p.role || '').toUpperCase();
    ctx.font = '800 ' + nameSize + 'px ' + FONT;
    var nameW = ctx.measureText(nameText).width;
    ctx.font = '600 ' + roleSize + 'px ' + FONT;
    var roleW = ctx.measureText(roleText).width;
    // Shrink the type when it would run past the frame's safe width.
    var maxTextW = (tall ? 0.82 : 0.9) * W - (margin + chevW + 10 * s + padX * 2 + badge + badgeGap);
    var fit = maxTextW / Math.max(nameW, roleW);
    if (fit < 1) {
      nameSize *= fit; roleSize *= fit;
      ctx.font = '800 ' + nameSize + 'px ' + FONT;
      nameW = ctx.measureText(nameText).width;
      ctx.font = '600 ' + roleSize + 'px ' + FONT;
      roleW = ctx.measureText(roleText).width;
    }
    var barW = Math.max(nameW, roleW) + padX * 2 + badge + badgeGap;

    // The unit pops up from below with a slight overshoot.
    var rise = (1 - Math.min(show, 1)) * (barH + margin);
    var over = Math.max(0, show - 1) * 18 * s; // the back-ease overshoot lifts it a touch
    var by = y + rise - over;

    ctx.fillStyle = p.panel;
    ctx.fillRect(margin + chevW + 10 * s, by, barW, barH);

    // The volt chevron cap, doubled.
    ctx.fillStyle = p.accent;
    chevron(margin, by, chevW, barH);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    chevron(margin + 18 * s, by, chevW, barH);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (hasLogo) {
      // The badge rides the panel: same rise, same overshoot.
      window.pulpDrawImage(ctx, state, 'logo', { x: margin + chevW + 10 * s + padX, y: by + 16 * s, width: badge, height: badge });
    }
    var textX = margin + chevW + 10 * s + padX + badge + badgeGap;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = p.text;
    ctx.font = '800 ' + nameSize + 'px ' + FONT;
    ctx.fillText(nameText, textX, by + 54 * s);
    ctx.fillStyle = p.accent;
    ctx.font = '600 ' + roleSize + 'px ' + FONT;
    ctx.fillText((p.role || '').toUpperCase(), textX, by + 96 * s);
  };
</script>
</body>
</html>
