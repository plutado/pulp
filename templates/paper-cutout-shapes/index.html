<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paper Cutouts</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Paper Cutouts, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The last cutout settles by 1.45 s; the pile then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var tones = [p.a, p.b2, p.c, p.dd];
    ctx.globalAlpha = 1 - gone;
    for (var i = 0; i < 12; i++) {
      var land = overshoot(clamp01((t - i * 0.08) / 0.55));
      if (t < i * 0.08) continue;
      var x = W * (0.1 + at(i * 3) * 0.8), y = H * (0.12 + at(i * 3 + 1) * 0.76);
      var s2 = Math.min(W, H) * (0.07 + at(i * 3 + 2) * 0.1);
      ctx.save();
      ctx.translate(x, y + (1 - land) * -H * 0.3);
      ctx.rotate((at(i + 20) - 0.5) * 0.8 + (1 - land) * 0.6);
      ctx.scale(Math.max(0.0001, land), Math.max(0.0001, land));
      ctx.fillStyle = 'rgba(40,30,40,0.14)';
      ctx.translate(4 * u, 6 * u);
      shape(i, s2);
      ctx.fill();
      ctx.translate(-4 * u, -6 * u);
      ctx.fillStyle = rgba(tones[i % 4], 1);
      shape(i, s2);
      ctx.fill();
      ctx.restore();
    }
    function shape(i, s2) {
      ctx.beginPath();
      var kind = i % 3;
      if (kind === 0) ctx.arc(0, 0, s2, 0, Math.PI * 2);
      else if (kind === 1) { ctx.moveTo(0, -s2); ctx.lineTo(s2, s2 * 0.8); ctx.lineTo(-s2, s2 * 0.8); ctx.closePath(); }
      else { ctx.arc(0, 0, s2, Math.PI, Math.PI * 2); ctx.closePath(); }
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
