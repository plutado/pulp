<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caption Duo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Caption Duo, a caption style for Pulp made for vertical (milestone 65; docs/vertical-layouts.md). CC0-1.0: no rights reserved.
  //
  // Two rows at most on a dark card that sits just above the caption band, centered; the word being
  // said sits on a bright chip. A longer line pages along two rows at a time as it is spoken.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  document.fonts.load('900 64px Montserrat');
  document.fonts.load('800 64px Montserrat');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }

  // Drawn with no captions at all — a card's poster, the library preview, the visual references.
  var SPECIMEN = {
    time: 1.3, spoken: 3, box: null,
    line: { start: 0, end: 2.2, words: [
      { text: 'This', start: 0, end: 0.3 }, { text: 'is', start: 0.3, end: 0.45 }, { text: 'the', start: 0.45, end: 0.6 },
      { text: 'part', start: 1.2, end: 1.5 }, { text: 'that', start: 1.5, end: 1.7 }, { text: 'matters', start: 1.7, end: 2.2 }
    ] }
  };

  /** The words in rows no wider than maxWidth at the font already set; each keeps its index in the line. */
  function wrap(words, maxWidth, space, upper) {
    var rows = [[]], width = 0;
    for (var i = 0; i < words.length; i++) {
      var text = upper ? words[i].text.toUpperCase() : words[i].text;
      var w = ctx.measureText(text).width;
      var row = rows[rows.length - 1];
      if (row.length > 0 && width + space + w > maxWidth) { rows.push([]); row = rows[rows.length - 1]; width = 0; }
      row.push({ index: i, text: text, width: w, start: words[i].start });
      width += (row.length > 1 ? space : 0) + w;
    }
    return rows;
  }
  function rowWidth(row, space) { var w = 0; for (var i = 0; i < row.length; i++) w += row[i].width + (i > 0 ? space : 0); return w; }
  /** The rows shown now: `per` at a time, the page holding the word being said (the first page before any is). */
  function page(rows, spoken, per) {
    var at = 0;
    for (var r = 0; r < rows.length; r++) for (var k = 0; k < rows[r].length; k++) if (rows[r][k].index === spoken) at = r;
    var first = Math.floor(at / per) * per;
    return rows.slice(first, first + per);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fit(state) {
    if (canvas.width !== state.width || canvas.height !== state.height) { canvas.width = state.width; canvas.height = state.height; }
    ctx.clearRect(0, 0, state.width, state.height);
  }
  // Every style here keeps its words between 18% and 82% of the width — clear of the controls column
  // down the right, and centered — so the words sit in the middle of the picture, not beside it.
  var LEFT = 0.18, RIGHT = 0.82;

  window.pulpRender = function (state) {
    fit(state);
    var W = state.width, H = state.height, p = state.params, u = Math.min(W, H);
    var caps = state.captions || SPECIMEN;
    var line = caps.line;
    if (!line || !line.words || line.words.length === 0) return;
    var size = Math.round(p.size * u);
    // Room between words for the chip's own padding, so the spoken word never touches its neighbors.
    var space = size * 0.42, lead = size * 1.32, pad = size * 0.5;
    ctx.font = '800 ' + size + 'px Montserrat';
    var rows = page(wrap(line.words, (RIGHT - LEFT) * W - pad * 2, space, false), caps.spoken, 2);
    var widest = 0;
    for (var r = 0; r < rows.length; r++) widest = Math.max(widest, rowWidth(rows[r], space));
    var cardW = widest + pad * 2, cardH = rows.length * lead + pad * 1.1;
    // Just above the band the apps print their own caption in: the bottom of the box Pulp hands over.
    var band = caps.box || { y: 0.56 * H, height: 0.22 * H };
    var y = band.y + band.height - cardH - 0.012 * H;
    var x = (W - cardW) / 2;
    var inAt = easeOut(clamp01((caps.time - line.start) / 0.12));
    ctx.save();
    ctx.globalAlpha = inAt;
    roundRect(x, y + (1 - inAt) * 12, cardW, cardH, size * 0.42);
    ctx.fillStyle = rgba(p.panel, 0.84);
    ctx.fill();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var cx = x + (cardW - rowWidth(row, space)) / 2;
      var baseline = y + pad * 0.55 + i * lead + size * 0.98 + (1 - inAt) * 12;
      for (var k = 0; k < row.length; k++) {
        var spoken = row[k].index === caps.spoken;
        if (spoken) {
          roundRect(cx - size * 0.16, baseline - size * 0.86, row[k].width + size * 0.32, size * 1.12, size * 0.22);
          ctx.fillStyle = rgba(p.spoken, 1);
          ctx.fill();
        }
        ctx.fillStyle = spoken ? rgba(p.spokenInk, 1) : rgba(p.ink, 1);
        ctx.fillText(row[k].text, cx, baseline);
        cx += row[k].width + space;
      }
    }
    ctx.restore();
  };
</script>
</body>
</html>
