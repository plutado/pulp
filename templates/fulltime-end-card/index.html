<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Full Time</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Full Time, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The slab slides in from the left and out to the right; between those it is still, which is the hold declared.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 1.0)), gone = easeInOut(clamp01((t - 5.0) / 1.0));
    ctx.fillStyle = p.back;
    ctx.fillRect(0, 0, W, H);
    var slabW = W * 0.8, slabH = H * 0.26, sx = W * 0.1 + (1 - come) * -W + gone * W, sy = H * 0.4;
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(sx, sy, slabW / 2, slabH);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(sx + slabW / 2, sy, slabW / 2, slabH);
    ctx.fillStyle = p.accent;
    ctx.fillRect(sx, sy - 12 * u, slabW, 12 * u);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0b1020';
    ctx.font = '400 ' + Math.round(slabH * 0.55) + 'px "Bebas Neue"';
    ctx.textAlign = 'left';
    ctx.fillText(p.home, sx + 28 * u, sy + slabH / 2);
    ctx.textAlign = 'right';
    ctx.fillText(p.away, sx + slabW - 28 * u, sy + slabH / 2);
    ctx.textAlign = 'center';
    ctx.font = '400 ' + Math.round(slabH * 0.8) + 'px "Bebas Neue"';
    ctx.fillText(Math.round(p.homeScore) + '  –  ' + Math.round(p.awayScore), sx + slabW / 2, sy + slabH / 2 + 4 * u);
    var kick = easeOut(clamp01((t - 0.6) / 0.6)) * (1 - gone);
    ctx.globalAlpha = kick;
    ctx.fillStyle = p.accent;
    ctx.font = '400 ' + Math.round(44 * u) + 'px "Bebas Neue"';
    ctx.fillText(String(p.kicker).toUpperCase(), W / 2, sy - 50 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
