<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sparkle Dust</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sparkle Dust, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Every sparkle winks a whole number of times per clip, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var cycle = t / d;
    var n = Math.floor(44 * p.density);
    for (var i = 0; i < n; i++) {
      var life = 0.5 + 0.5 * Math.sin((cycle * (1 + Math.floor(at(i + 5) * 2)) + at(i)) * Math.PI * 2);
      var a = Math.pow(life, 3);
      if (a < 0.03) continue;
      var x = W * at(i * 3 + 1), y = H * at(i * 3 + 2);
      var r = Math.min(W, H) * (0.01 + at(i + 9) * 0.02) * life;
      ctx.fillStyle = rgba(p.spark, a);
      ctx.beginPath();
      for (var pnt = 0; pnt < 8; pnt++) {
        var ang = (pnt / 8) * Math.PI * 2;
        var rr2 = pnt % 2 ? r * 0.25 : r;
        ctx.lineTo(x + Math.cos(ang) * rr2, y + Math.sin(ang) * rr2);
      }
      ctx.closePath(); ctx.fill();
      var g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
      g.addColorStop(0, rgba(p.spark, a * 0.4)); g.addColorStop(1, rgba(p.spark, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, Math.PI * 2); ctx.fill();
    }
  };
</script>
</body>
</html>
