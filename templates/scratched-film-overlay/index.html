<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scratched Film</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Scratched Film, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Scratch lives and blotch steps are functions of the loop cycle, so the last frame meets the first.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var cycle = t / d;
    for (var i = 0; i < 7; i++) {
      // Each scratch lives for a slice of the loop and drifts while it lives.
      var start = at(i * 9), span = 0.25 + at(i * 9 + 1) * 0.3;
      var local = ((cycle - start) % 1 + 1) % 1;
      if (local > span) continue;
      var f = local / span;
      var x = W * (at(i * 9 + 2) + Math.sin(f * 7 + i) * 0.01);
      ctx.strokeStyle = rgba(p.mark, 0.25 + at(i * 9 + 3) * 0.3);
      ctx.lineWidth = Math.max(1, (0.8 + at(i * 9 + 4)) * u * 1.6);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (at(i * 9 + 5) - 0.5) * 8 * u, H); ctx.stroke();
    }
    var step = Math.floor(t * 12) % Math.floor(d * 12);
    for (var b = 0; b < 4; b++) {
      var seed = b * 31 + step * 7;
      if (at(seed) > 0.3) continue;
      ctx.fillStyle = rgba(p.mark, 0.18);
      ctx.beginPath();
      ctx.ellipse(at(seed + 1) * W, at(seed + 2) * H, (4 + at(seed + 3) * 10) * u, (3 + at(seed + 4) * 7) * u, at(seed + 5) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  };
</script>
</body>
</html>
