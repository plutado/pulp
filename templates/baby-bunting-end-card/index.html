<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hello Little One</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hello Little One, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The bunting hangs by 1.4 s and the words settle by 1.9 s; everything then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    for (var dot = 0; dot < 24; dot++) {
      ctx.fillStyle = 'rgba(180,160,150,0.12)';
      ctx.beginPath(); ctx.arc(at(dot * 3) * W, at(dot * 3 + 1) * H, (6 + at(dot) * 10) * u, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1 - gone;
    // The bunting: a rope that droops into place, little flags hanging from it.
    var hang = easeOut(clamp01(t / 1.2));
    var y0 = H * 0.1, droop = H * 0.12 * hang;
    ctx.strokeStyle = 'rgba(120,100,90,0.7)'; ctx.lineWidth = 3 * u;
    ctx.beginPath();
    for (var x = 0; x <= W; x += W / 60) {
      var f = x / W;
      var y = y0 + Math.sin(f * Math.PI) * droop;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    var tones = [p.flag, '#fcd34d', '#f9a8d4', '#86efac'];
    for (var i = 0; i < 9; i++) {
      var f2 = (i + 0.5) / 9;
      var fx = f2 * W, fy = y0 + Math.sin(f2 * Math.PI) * droop;
      var sway = Math.sin(t * 1.3 + i) * 0.04 * hang;
      ctx.save(); ctx.translate(fx, fy); ctx.rotate(sway);
      ctx.fillStyle = rgba(tones[i % 4].indexOf('#') === 0 ? tones[i % 4] : p.flag, 0.95 * hang);
      ctx.beginPath(); ctx.moveTo(-26 * u, 0); ctx.lineTo(26 * u, 0); ctx.lineTo(0, 54 * u); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    var wordsIn = easeOut(clamp01((t - 0.9) / 0.8));
    ctx.globalAlpha = (1 - gone) * wordsIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7c5a4e';
    ctx.font = '700 ' + Math.round(110 * u) + 'px "Caveat"';
    ctx.fillText(p.name2, W / 2, H * 0.52 + (1 - wordsIn) * 14 * u);
    ctx.fillStyle = '#a98f80';
    ctx.font = '500 ' + Math.round(34 * u) + 'px Inter';
    ctx.fillText(p.details, W / 2, H * 0.61);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
