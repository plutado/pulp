<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instant Frame</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Instant Frame, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The frame settles by 0.7 s and holds; the caption is still.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = overshoot(clamp01(t / 0.7)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var inset = Math.min(W, H) * 0.06, bottom = Math.min(W, H) * 0.16;
    ctx.save();
    ctx.globalAlpha = 1 - gone;
    ctx.translate(W / 2, H / 2 + (1 - Math.min(1, come)) * H * 0.4);
    ctx.rotate(-0.02 * come);
    ctx.translate(-W / 2, -H / 2);
    // The paper around the picture: the frame is everything outside the window.
    ctx.fillStyle = rgba(p.paper, 1);
    ctx.beginPath();
    ctx.rect(-W * 0.1, -H * 0.1, W * 1.2, H * 1.2);
    ctx.rect(inset, inset, W - inset * 2, H - inset - bottom);
    ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2 * u;
    ctx.strokeRect(inset, inset, W - inset * 2, H - inset - bottom);
    ctx.fillStyle = '#4a4036';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 ' + Math.round(bottom * 0.34) + 'px Caveat';
    ctx.fillText(String(p.caption), W / 2, H - bottom / 2);
    ctx.restore();
  };
</script>
</body>
</html>
