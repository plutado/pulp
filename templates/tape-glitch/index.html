<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tape Glitch</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Tape Glitch, a sample template for Pulp. CC0-1.0: no rights reserved.
  // Band offsets are a fixed function of the frame number, so a render is repeatable
  // while still jumping every frame the way tape damage does.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var mid = d / 2;
    var strength = easeInOut(1 - clamp01(Math.abs(t - mid) / mid));
    if (strength <= 0.01) return;
    var frame = Math.floor(t * 30);
    var n = Math.round(p.bands);
    for (var i = 0; i < n; i++) {
      var y = at(i * 7 + frame * 3) * H;
      var bh = (6 + at(i + frame) * 46) * u * strength;
      var dx = (at(i * 13 + frame * 5) - 0.5) * W * 0.3 * strength;
      ctx.fillStyle = 'rgba(16, 20, 18, ' + (0.5 + 0.5 * strength).toFixed(3) + ')';
      ctx.fillRect(0, y, W, bh);
      ctx.fillStyle = p.tint + '66';
      ctx.fillRect(dx, y, W * 0.6, bh * 0.5);
      ctx.fillStyle = 'rgba(255, 120, 160, 0.3)';
      ctx.fillRect(-dx, y + bh * 0.5, W * 0.5, bh * 0.4);
    }
    // The sync line rolls through once, top to bottom, over the glitch's life.
    var roll = (t / d) * H * 1.4 - H * 0.2;
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.25 * strength).toFixed(3) + ')';
    ctx.fillRect(0, roll, W, 5 * u);
    // Full cover at the very midpoint, so the cut never shows through.
    var wash = 1 - Math.abs(t - mid) / (d * 0.12);
    if (wash > 0) {
      ctx.fillStyle = '#0c0f0e';
      ctx.globalAlpha = easeInOut(clamp01(wash));
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
