<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shatter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Shatter, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Stretching the length only slows the crack and the throw, which is what scale means.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var f = t / d;
    var crack = easeOut(clamp01(f * 2));
    var fly = easeInOut(clamp01(f * 2 - 1));
    var cx = W * 0.5, cy = H * 0.46;
    var wedges = 12;
    for (var i = 0; i < wedges; i++) {
      var a0 = (i / wedges) * Math.PI * 2 + at(i) * 0.3;
      var a1 = ((i + 1) / wedges) * Math.PI * 2 + at(i + 1) * 0.3;
      var reach = Math.sqrt(W * W + H * H) * 0.7;
      // Flying out: each shard leaves along its own wedge's heading, turning as it goes.
      var throwX = Math.cos((a0 + a1) / 2) * fly * W * 1.1;
      var throwY = Math.sin((a0 + a1) / 2) * fly * H * 1.1;
      ctx.save();
      ctx.translate(cx + throwX, cy + throwY);
      ctx.rotate(fly * (at(i + 5) - 0.5) * 2);
      ctx.globalAlpha = Math.min(1, crack * 1.4) * (1 - fly);
      ctx.fillStyle = rgba(p.shard, 0.96);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a0) * reach, Math.sin(a0) * reach);
      ctx.lineTo(Math.cos(a1) * reach, Math.sin(a1) * reach);
      ctx.closePath(); ctx.fill();
      if (fly < 0.2) {
        ctx.strokeStyle = rgba(p.crack, crack * (1 - fly * 5));
        ctx.lineWidth = Math.max(1, 2.5 * u * crack);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a0) * reach * crack, Math.sin(a0) * reach * crack);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
