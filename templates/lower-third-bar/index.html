<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower Third Bar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sample template for Pulp. CC0-1.0: no rights reserved.
  //
  // The name and title are a block of layers (docs/template-format.md, "Blocks and layers"): the
  // host measures and stacks them, and this template sizes its panel to the stack and says how the
  // words move, so a line added to the block grows the panel and rides the same wipe and fade.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = easeOutCubic(clamp01(t / dur));
    var outT = easeInCubic(clamp01((t - (d - dur)) / dur));
    var show = inT * (1 - outT);
    if (show <= 0) return;

    var s = Math.min(W, H) / 1080;
    // A tall frame (9:16) re-lays the panel: above the caption band (bottom 22%),
    // clear of the controls column (right 18%), always on the left with a 0.06 W margin.
    var tall = H > W * 1.4;
    var margin = tall ? 0.06 * W : 96 * s;
    var padX = 36 * s, barW = 10 * s;
    // The text must fit the panel's room: 0.76 W on a tall frame, 0.9 W elsewhere (a no-op at 16:9).
    var maxTextW = (tall ? 0.82 * W : 0.9 * W) - margin - barW - padX * 2;
    var right = !tall && p.side === 'right';
    // The words fade in once the panel has wiped out; the first line leads, the rest sit back a little.
    var fade = clamp01((show - 0.5) / 0.5);
    var each = function (layer, position) { return { alpha: fade * (position === 0 ? 1 : 0.8) }; };

    // Measure the stack first: its widest line sets the panel's width, its height the panel's height.
    var probe = window.pulpLayoutBlock(ctx, state, 'strap', { box: { x: 0, y: 0, width: maxTextW, height: H }, each: each });
    var textW = 0, top = null, bottom = 0;
    probe.layers.forEach(function (l) {
      if (l.box.width <= 0 && l.box.height <= 0) return;
      if (l.lines) l.lines.forEach(function (ln) { textW = Math.max(textW, ln.width); });
      else textW = Math.max(textW, l.box.width);
      if (top === null) top = l.box.y;
      bottom = Math.max(bottom, l.box.y + l.box.height);
    });
    var stackH = top === null ? 0 : bottom - top;
    // 28.8 above the first line and 26 below the last: with the template's own two lines, a 150 panel.
    var panelH = 28.8 * s + stackH + 26 * s;
    // Image slot (milestone 22): a square badge at the head of the panel when a logo is chosen; the
    // text moves over to make room. With no logo the slot falls back to the name, which the panel
    // already carries, so nothing changes.
    var hasLogo = !!(state.images && state.images.logo && state.images.logo.bitmap);
    var badge = hasLogo ? panelH - 2 * 18 * s : 0;
    var badgeGap = hasLogo ? padX : 0;
    var panelW = textW + padX * 2 + badge + badgeGap;
    var y = tall ? H * 0.72 - panelH : H - margin - panelH;
    var x = right ? W - margin - panelW - barW : margin;

    // Accent bar grows first, panel wipes out from it.
    var barH = panelH * clamp01(show * 1.6);
    var barX = right ? x + panelW : x;
    ctx.fillStyle = p.accent;
    ctx.fillRect(barX, y + (panelH - barH) / 2, barW, barH);

    var reveal = clamp01((show - 0.25) / 0.75);
    var visibleW = panelW * reveal;
    if (visibleW <= 0) return;
    var panelX = right ? x + panelW - visibleW : x + barW;

    ctx.save();
    ctx.beginPath();
    ctx.rect(panelX, y, visibleW, panelH);
    ctx.clip();
    ctx.fillStyle = p.panel;
    ctx.fillRect(panelX, y, visibleW, panelH);

    var textX = right ? x + panelW - padX - badge - badgeGap : x + barW + padX + badge + badgeGap;
    if (hasLogo) {
      // The badge rides the panel: it is clipped by the same wipe and fades with the text.
      var badgeX = right ? x + panelW - padX - badge : x + barW + padX;
      ctx.globalAlpha = fade;
      window.pulpDrawImage(ctx, state, 'logo', { x: badgeX, y: y + 18 * s, width: badge, height: badge });
    }
    // The words, in place: the same stack laid out where the panel is, aligned to the side it sits on.
    ctx.globalAlpha = 1;
    var strap = window.pulpLayoutBlock(ctx, state, 'strap', {
      box: { x: right ? textX - maxTextW : textX, y: y + 28.8 * s, width: maxTextW, height: panelH },
      align: right ? 'right' : 'left',
      each: each
    });
    window.pulpDrawBlock(ctx, strap);
    ctx.restore();
  };
</script>
</body>
</html>
