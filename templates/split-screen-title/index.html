<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Split Screen</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Split Screen, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The panels part by 1.0 s and the title stands by 1.1 s; the seam holds open until the close.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var part = easeInOut(clamp01(t / 1.0));
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    // Exit: the panels close back over the title.
    var open = part * (1 - easeInOut(gone));
    var gapHalf = W * 0.5 * open;
    ctx.fillStyle = rgba(p.left, 1);
    ctx.fillRect(0, 0, Math.max(0, W / 2 - gapHalf), H);
    ctx.fillStyle = rgba(p.right, 1);
    ctx.fillRect(Math.min(W, W / 2 + gapHalf), 0, W, H);
    // The seam's edges, so the parting reads as two cards and not a fade.
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(Math.max(0, W / 2 - gapHalf) - 3 * u, 0, 3 * u, H);
    ctx.fillRect(Math.min(W, W / 2 + gapHalf), 0, 3 * u, H);
    var titleIn = easeOut(clamp01((t - 0.5) / 0.6)) * (1 - gone);
    if (titleIn > 0) {
      ctx.globalAlpha = titleIn;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(p.ink, 1);
      ctx.font = '700 ' + Math.round(110 * u) + 'px Montserrat';
      ctx.fillText(p.title, W / 2, H / 2 + (1 - titleIn) * 20 * u);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
