<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Playful icons</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Playful icons sample for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInBack(x) { var c = 1.7; return (c + 1) * x * x * x - c * x * x; }
  function easeOutElastic(x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    return Math.pow(2, -9 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
  }
  function hash(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

  // Each icon draws itself in a unit box (-1..1) around the origin.
  function star() {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 === 0 ? 1 : 0.46;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
  }
  function heart() {
    ctx.beginPath();
    ctx.moveTo(0, 0.9);
    ctx.bezierCurveTo(-1.3, 0.05, -0.75, -0.95, 0, -0.4);
    ctx.bezierCurveTo(0.75, -0.95, 1.3, 0.05, 0, 0.9);
    ctx.closePath();
    ctx.fill();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function thumbsup(detail) {
    // Cuff
    roundRect(-0.95, -0.1, 0.42, 0.95, 0.12); ctx.fill();
    // Palm and thumb
    ctx.beginPath();
    ctx.moveTo(-0.45, -0.1);
    ctx.lineTo(-0.45, 0.72);
    ctx.quadraticCurveTo(-0.45, 0.85, -0.3, 0.85);
    ctx.lineTo(0.5, 0.85);
    ctx.quadraticCurveTo(0.95, 0.85, 0.95, 0.1);
    ctx.quadraticCurveTo(0.95, -0.12, 0.72, -0.12);
    ctx.lineTo(0.22, -0.12);
    ctx.lineTo(0.3, -0.6);
    ctx.quadraticCurveTo(0.3, -0.95, 0.0, -0.95);
    ctx.quadraticCurveTo(-0.15, -0.95, -0.18, -0.75);
    ctx.quadraticCurveTo(-0.3, -0.3, -0.45, -0.1);
    ctx.closePath();
    ctx.fill();
    // Finger lines in the detail colour
    ctx.strokeStyle = detail;
    ctx.lineWidth = 0.07;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.95, 0.2); ctx.lineTo(0.55, 0.2);
    ctx.moveTo(0.95, 0.45); ctx.lineTo(0.55, 0.45);
    ctx.stroke();
  }
  function smiley(detail) {
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = detail;
    ctx.beginPath(); ctx.arc(-0.36, -0.28, 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.36, -0.28, 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = detail;
    ctx.lineWidth = 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0.1, 0.55, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }
  function balloon(detail) {
    ctx.beginPath();
    ctx.ellipse(0, -0.2, 0.68, 0.78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.12, 0.62); ctx.lineTo(0.12, 0.62); ctx.lineTo(0, 0.5); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    ctx.moveTo(0, 0.64);
    ctx.bezierCurveTo(0.2, 0.8, -0.2, 0.9, 0.05, 1.0);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = detail;
    ctx.globalAlpha = ctx.globalAlpha * 0.7;
    ctx.beginPath();
    ctx.ellipse(-0.28, -0.5, 0.1, 0.2, Math.PI / 5, 0, Math.PI * 2);
    ctx.fill();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = clamp01((t - (d - dur)) / dur);
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.5 * (p.size / 100) * 0.8;

    // Pop in with an elastic overshoot; shrink away with a little anticipation on the way out.
    var pop = easeOutElastic(inT);
    var shrink = 1 - easeInBack(outT);
    var scale = pop * Math.max(0, shrink);
    // A gentle wobble while it holds.
    var wig = Math.sin(t * 3) * 0.04 * clamp01(inT * 2) * (1 - outT);

    // Dots burst outward from the centre as the icon lands and fade as they slow.
    var nd = 12;
    var burst = easeOutCubic(clamp01((t - dur * 0.05) / (dur * 1.6)));
    for (var i = 0; i < nd; i++) {
      var a = i / nd * Math.PI * 2 + hash(i + 1) * 0.5;
      var dist = R * (1.5 + hash(i + 20) * 0.9) * burst;
      var dr = R * (0.07 + hash(i + 40) * 0.08) * (1 - burst * 0.4);
      var alpha = (1 - Math.pow(burst, 5)) * (1 - outT);
      if (alpha <= 0) continue;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = i % 3 === 0 ? p.fill : p.dots;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * dist, cy + Math.sin(a) * dist + burst * burst * R * 0.3, dr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (scale <= 0) return;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(wig);
    ctx.scale(R * scale, R * scale);
    ctx.fillStyle = p.fill;
    ctx.lineJoin = 'round';
    switch (p.icon) {
      case 'star': star(); break;
      case 'thumbsup': thumbsup(p.detail); break;
      case 'smiley': smiley(p.detail); break;
      case 'balloon': balloon(p.detail); break;
      default: heart();
    }
    ctx.restore();
  };
</script>
</body>
</html>
