<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Outline Fill</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Outline Fill, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The word slams in and floods full by 1.1 s, then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = 1 - gone;
    if (t > 0.05 && show <= 0.001) return;
    var slam = overshoot(clamp01(t / 0.5));
    var flood = easeInOut(clamp01((t - 0.4) / 0.7));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var size = Math.min(W * 1.6 / Math.max(4, String(p.word).length), H * 0.3);
    ctx.font = '700 ' + Math.round(size) + 'px "Bebas Neue"';
    ctx.save();
    ctx.globalAlpha = show;
    ctx.translate(W / 2, H / 2);
    ctx.scale(Math.max(0.0001, 0.6 + 0.4 * slam), Math.max(0.0001, 0.6 + 0.4 * slam));
    ctx.lineWidth = Math.max(2, size * 0.02);
    ctx.strokeStyle = rgba(p.line, 0.95);
    ctx.strokeText(p.word, 0, 0);
    // The flood: the filled word, clipped to the wave front sweeping left to right.
    if (flood > 0) {
      ctx.save();
      var front = -W * 0.55 + flood * W * 1.1;
      ctx.beginPath();
      ctx.moveTo(-W * 0.6, -H * 0.4);
      ctx.lineTo(front, -H * 0.4);
      for (var yy = -H * 0.4; yy <= H * 0.4; yy += H * 0.05) ctx.lineTo(front + Math.sin(yy / H * 9 + flood * 6) * 14 * u, yy);
      ctx.lineTo(-W * 0.6, H * 0.4);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = rgba(p.fill, 1);
      ctx.fillText(p.word, 0, 0);
      ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
