<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ring Countdown</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Ring Countdown, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The ring runs down across the clip, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.4)), gone = easeOut(clamp01((t - (d - 0.6)) / 0.6));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var from = Math.round(p.from);
    var run = d - 1;
    var remaining = Math.max(0, from - from * clamp01(t / run));
    var current = Math.ceil(remaining - 0.0001);
    var beat = Math.pow(1 - clamp01(((t / run) * from) % 1), 3);
    var cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.26;
    ctx.globalAlpha = show;
    ctx.lineWidth = r * 0.12; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(p.ring, 0.2);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = rgba(p.ring, 1);
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (remaining / from)); ctx.stroke();
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.4);
    g.addColorStop(0, rgba(p.ring, 0.25 * beat)); g.addColorStop(1, rgba(p.ring, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = rgba(p.ink, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(r * (1.1 + beat * 0.1)) + 'px Montserrat';
    ctx.fillText(String(current), cx, cy + r * 0.06);
  };
</script>
</body>
</html>
