<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Odometer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Odometer, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The drums lock at 2.2 s and the figure holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var roll = easeOut(clamp01(t / 2.2));
    var target = Math.max(0, Math.round(p.target));
    var now = target * roll;
    var digits = String(target).length;
    var dh = Math.min(W, H) * 0.2, dw = dh * 0.62, gap = dw * 0.12;
    var total = digits * (dw + gap) - gap;
    var x0 = W / 2 - total / 2, y0 = H * 0.46 - dh / 2;
    ctx.globalAlpha = 1 - gone;
    for (var i = 0; i < digits; i++) {
      var place = Math.pow(10, digits - 1 - i);
      // Each drum shows a fractional position, so the lower drums spin faster and all settle together.
      var value = (now / place) % 10;
      var x = x0 + i * (dw + gap);
      rr(x, y0, dw, dh, dw * 0.12);
      ctx.fillStyle = rgba(p.drum, 1); ctx.fill();
      ctx.save();
      rr(x, y0, dw, dh, dw * 0.12); ctx.clip();
      ctx.fillStyle = rgba(p.digit, 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(dh * 0.62) + 'px "JetBrains Mono"';
      var base = Math.floor(value), frac = value - base;
      for (var k = -1; k <= 1; k++) {
        var digit = ((base + k) % 10 + 10) % 10;
        ctx.fillText(String(digit), x + dw / 2, y0 + dh / 2 + (k - frac) * dh);
      }
      var shade = ctx.createLinearGradient(0, y0, 0, y0 + dh);
      shade.addColorStop(0, 'rgba(0,0,0,0.45)'); shade.addColorStop(0.3, 'rgba(0,0,0,0)'); shade.addColorStop(0.7, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = shade; ctx.fillRect(x, y0, dw, dh);
      ctx.restore();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (p.prefix) {
      ctx.fillStyle = rgba(p.digit, 0.9);
      ctx.font = '700 ' + Math.round(dh * 0.4) + 'px "JetBrains Mono"';
      ctx.textAlign = 'right';
      ctx.fillText(String(p.prefix), x0 - gap * 2, y0 + dh * 0.68);
      ctx.textAlign = 'center';
    }
    ctx.fillStyle = 'rgba(214,211,209,0.95)';
    ctx.font = '600 ' + Math.round(34 * u) + 'px Inter';
    ctx.fillText(String(p.label), W / 2, y0 + dh + 64 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
