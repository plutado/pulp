<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Full Recipe</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Full Recipe, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The card rises and the cutlery crosses by 1.6 s; everything then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.9)), gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    var cw = Math.min(W * 0.72, 1100 * u), ch = Math.min(H * 0.62, 620 * u);
    var cx = W / 2, sx = cx - cw / 2, sy = H / 2 - ch / 2 + (1 - come) * H * 0.12;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    rr(sx + 8 * u, sy + 12 * u, cw, ch, 14 * u); ctx.fill();
    ctx.fillStyle = rgba(p.card, 1);
    rr(sx, sy, cw, ch, 14 * u); ctx.fill();
    ctx.strokeStyle = 'rgba(120,100,70,0.35)'; ctx.lineWidth = 2 * u;
    rr(sx + 14 * u, sy + 14 * u, cw - 28 * u, ch - 28 * u, 10 * u); ctx.stroke();
    // Crossed cutlery: a fork and a spoon swinging in to cross above the dish.
    var crossed = easeInOut(clamp01((t - 0.6) / 0.9));
    var icy = sy + ch * 0.3;
    function handle(sign) {
      ctx.save();
      ctx.translate(cx, icy);
      ctx.rotate(sign * (0.5 - 0.28 * crossed));
      ctx.strokeStyle = '#6b5a3e'; ctx.lineWidth = 7 * u; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 60 * u); ctx.lineTo(0, -40 * u); ctx.stroke();
      if (sign < 0) {
        for (var tine = -1; tine <= 1; tine++) {
          ctx.beginPath(); ctx.moveTo(tine * 8 * u, -40 * u); ctx.lineTo(tine * 8 * u, -66 * u); ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#6b5a3e';
        ctx.beginPath(); ctx.ellipse(0, -56 * u, 14 * u, 20 * u, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    handle(-1); handle(1);
    var wordsIn = easeOut(clamp01((t - 1.0) / 0.7));
    ctx.globalAlpha = (1 - gone) * wordsIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#3d3326';
    ctx.font = '700 ' + Math.round(64 * u) + 'px Playfair';
    ctx.fillText(p.dish, cx, sy + ch * 0.62);
    ctx.strokeStyle = 'rgba(120,100,70,0.5)'; ctx.lineWidth = 1.5 * u;
    ctx.beginPath(); ctx.moveTo(cx - cw * 0.22, sy + ch * 0.7); ctx.lineTo(cx + cw * 0.22, sy + ch * 0.7); ctx.stroke();
    ctx.fillStyle = '#7a6a4e';
    ctx.font = '500 ' + Math.round(30 * u) + 'px Inter';
    ctx.fillText(p.where, cx, sy + ch * 0.8);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
