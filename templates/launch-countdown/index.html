<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Launch Countdown</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Launch Countdown, a sample template for Pulp. CC0-1.0: no rights reserved.
  // One real second per count. The ring closes over each second and the digit stamps
  // in at its start; the final word holds for the last second and fades.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var from = Math.round(p.from);
    var total = from + 1; // the counts, then the word
    var per = d / total;
    var step = Math.min(total - 1, Math.floor(t / per));
    var within = (t - step * per) / per;
    var current = from - step;
    var isWord = current <= 0;

    var gone = easeInOut(clamp01((t - (d - 0.6)) / 0.6));
    ctx.globalAlpha = 1 - gone;

    ctx.fillStyle = 'rgba(6, 10, 18, 0.9)';
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.27;
    // The track, then the closing arc for this second.
    ctx.lineWidth = 6 * u;
    ctx.strokeStyle = 'rgba(120, 150, 200, 0.25)';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    if (!isWord) {
      ctx.strokeStyle = p.accent;
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + within * Math.PI * 2);
      ctx.stroke();
    }

    var stamp = easeOut(clamp01(within / 0.25));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eaf2ff';
    if (isWord) {
      ctx.font = '700 ' + Math.round(110 * u) + 'px Montserrat';
      ctx.globalAlpha = (1 - gone) * stamp;
      ctx.fillText(p.word, cx, cy);
    } else {
      ctx.font = '600 ' + Math.round(230 * u * (1.15 - 0.15 * stamp)) + 'px JetBrains Mono';
      ctx.globalAlpha = (1 - gone) * stamp;
      ctx.fillText('T-' + String(current).padStart(2, '0'), cx, cy);
    }
    ctx.globalAlpha = 1 - gone;
    ctx.font = '400 ' + Math.round(24 * u) + 'px JetBrains Mono';
    ctx.fillStyle = 'rgba(140, 170, 220, 0.8)';
    ctx.fillText('MISSION CLOCK ' + (isWord ? 'T-00' : 'HOLDING NONE'), cx, cy + r + 56 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
