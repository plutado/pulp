<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Season Stats</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Season Stats, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The counters land at 1.8 s and lock; the card then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 6.0) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    var headIn = easeOut(clamp01(t / 0.6));
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f1f5f9';
    ctx.font = '700 ' + Math.round(76 * u) + 'px "Bebas Neue"';
    ctx.globalAlpha = (1 - gone) * headIn;
    ctx.fillText(p.title.toUpperCase(), W / 2, H * 0.26 + (1 - headIn) * -20 * u);
    var stats = [p.s1, p.s2, p.s3];
    var tw = Math.min(W * 0.26, 360 * u), th2 = tw * 0.72, gap = tw * 0.12;
    var total = tw * 3 + gap * 2, left = W / 2 - total / 2;
    for (var i = 0; i < 3; i++) {
      var parts = String(stats[i]).split('|');
      var target = parseInt(parts[0], 10) || 0;
      var label = parts[1] || '';
      var tileIn = easeOut(clamp01((t - 0.3 - i * 0.2) / 0.5));
      var count = easeOut(clamp01((t - 0.5 - i * 0.2) / 1.1));
      var x = left + i * (tw + gap), y = H * 0.36 + (1 - tileIn) * 30 * u;
      ctx.globalAlpha = (1 - gone) * tileIn;
      rr(x, y, tw, th2, 10 * u);
      ctx.fillStyle = rgba(p.tile, 1); ctx.fill();
      ctx.fillStyle = rgba(p.accent, 1);
      ctx.fillRect(x, y + th2 - 6 * u, tw * count, 6 * u);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 ' + Math.round(92 * u) + 'px "Bebas Neue"';
      ctx.fillText(String(Math.round(target * count)), x + tw / 2, y + th2 * 0.52);
      ctx.fillStyle = 'rgba(203,213,225,0.9)';
      ctx.font = '600 ' + Math.round(24 * u) + 'px Oswald';
      ctx.fillText(label.toUpperCase(), x + tw / 2, y + th2 * 0.78);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
