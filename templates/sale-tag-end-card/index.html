<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sale Tag</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Sale Tag, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The tag swings the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.8)), gone = easeOut(clamp01((t - (d - 0.9)) / 0.9));
    ctx.fillStyle = p.back; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = come * (1 - gone);
    // The tag hangs from a point above the frame and swings on a gentle pendulum.
    var px2 = W * 0.3, py2 = -H * 0.05;
    var swing = Math.sin(t * 1.7) * 0.1;
    ctx.save();
    ctx.translate(px2, py2); ctx.rotate(swing);
    ctx.strokeStyle = 'rgba(90,70,60,0.8)'; ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, H * 0.3); ctx.stroke();
    var tw = 320 * u, th2 = 170 * u;
    ctx.translate(0, H * 0.3 + th2 * 0.1);
    ctx.rotate(swing * 0.6);
    ctx.fillStyle = rgba(p.tag, 1);
    ctx.beginPath();
    ctx.moveTo(0, -th2 * 0.1);
    ctx.lineTo(tw * 0.22, -th2 / 2); ctx.lineTo(tw, -th2 / 2);
    ctx.lineTo(tw, th2 / 2); ctx.lineTo(tw * 0.22, th2 / 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = p.back;
    ctx.beginPath(); ctx.arc(tw * 0.16, 0, 12 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7ed';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(64 * u) + 'px "Bebas Neue"';
    ctx.fillText('SALE', tw * 0.58, 2 * u);
    ctx.restore();
    var wordsIn = easeOut(clamp01((t - 0.5) / 0.7));
    ctx.globalAlpha = come * (1 - gone) * wordsIn;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#5b3a2e';
    ctx.font = '700 ' + Math.round(80 * u) + 'px Montserrat';
    ctx.fillText(p.offer, W * 0.62, H * 0.42);
    // The voucher: a dashed box the code sits in.
    var vw = Math.min(W * 0.4, 560 * u), vh = 110 * u, vx = W * 0.62 - vw / 2, vy = H * 0.5;
    ctx.setLineDash([12 * u, 9 * u]);
    ctx.strokeStyle = 'rgba(91,58,46,0.8)'; ctx.lineWidth = 3 * u;
    rr(vx, vy, vw, vh, 10 * u); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#7c4a38';
    ctx.font = '600 ' + Math.round(40 * u) + 'px "JetBrains Mono"';
    ctx.fillText(p.code, W * 0.62, vy + vh * 0.62);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
