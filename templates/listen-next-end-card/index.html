<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Listen Next</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Listen Next, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Bars rise and fall on seeded phases for the whole card; the words fade in and out around them.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeInOut(clamp01(t / 1.2)), gone = easeInOut(clamp01((t - (d - 1)) / 1));
    var show = come * (1 - gone);
    ctx.fillStyle = p.back;
    ctx.fillRect(0, 0, W, H);
    if (show <= 0.001) return;
    var n = 28, gap = W * 0.6 / n, x0 = W * 0.2;
    for (var i = 0; i < n; i++) {
      var h = (0.25 + 0.75 * Math.abs(Math.sin(t * (1.5 + at(i) * 1.5) + i * 0.7))) * H * 0.12 * show;
      ctx.fillStyle = rgba(p.bars, 0.4 + at(i + 40) * 0.5);
      rr(x0 + i * gap, H * 0.62 - h / 2, gap * 0.55, h, gap * 0.27);
      ctx.fill();
    }
    ctx.globalAlpha = show;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f9fafb';
    ctx.font = '800 ' + Math.round(72 * u) + 'px Montserrat';
    ctx.fillText(p.show, W / 2, H * 0.4);
    ctx.fillStyle = rgba(p.bars, 1);
    ctx.font = '600 ' + Math.round(22 * u) + 'px Inter';
    ctx.fillText('LISTEN NEXT', W / 2, H * 0.47);
    ctx.fillStyle = '#d1d5db';
    ctx.font = '400 ' + Math.round(28 * u) + 'px Inter';
    ctx.fillText(p.next, W / 2, H * 0.8);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
