<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Corrupt Blocks</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Corrupt Blocks, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Stretching the length only slows the corruption, which is what scale means.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var f = t / d;
    var chaos = Math.sin(Math.min(1, f) * Math.PI);
    var beat = Math.floor(t * 18);
    var blocks = Math.floor(26 * chaos);
    for (var i = 0; i < blocks; i++) {
      var seed = i * 29 + beat * 613;
      var bw = W * (0.04 + at(seed) * 0.22);
      var bh = H * (0.02 + at(seed + 1) * 0.1);
      var x = at(seed + 2) * (W - bw), y = at(seed + 3) * (H - bh);
      var kind = at(seed + 4);
      if (kind < 0.4) {
        ctx.fillStyle = rgba(p.block, 0.5 + at(seed + 5) * 0.5);
        ctx.fillRect(x, y, bw, bh);
      } else if (kind < 0.7) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + at(seed + 5) * 0.4).toFixed(3) + ')';
        ctx.fillRect(x, y, bw, bh);
      } else {
        for (var s2 = 0; s2 < 5; s2++) {
          ctx.fillStyle = s2 % 2 ? 'rgba(10,12,16,0.8)' : rgba(p.block, 0.7);
          ctx.fillRect(x, y + (s2 / 5) * bh, bw, bh / 5 + 1);
        }
      }
    }
    ctx.fillStyle = 'rgba(8,10,14,' + (Math.pow(chaos, 3) * 0.55).toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);
  };
</script>
</body>
</html>
