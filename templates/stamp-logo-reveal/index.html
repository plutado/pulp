<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stamp Ident</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Stamp Ident, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The stamp lands at 0.35 s and the dust settles by 1.05 s; the mark then holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 4.2) / 0.8));
    ctx.fillStyle = rgba(p.paper, 1); ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - gone;
    var slam = clamp01(t / 0.35);
    var scale = 2.2 - 1.2 * easeOut(slam);
    var cx = W / 2, cy = H * 0.46;
    // The dust: one ring of puffs at the moment of landing, gone by 1.1 s.
    var dust = clamp01((t - 0.35) / 0.7);
    if (dust > 0 && dust < 1) {
      for (var i = 0; i < 10; i++) {
        var a = (i / 10) * Math.PI * 2;
        var dr = Math.min(W, H) * (0.3 + dust * 0.14);
        ctx.fillStyle = 'rgba(150,130,100,' + ((1 - dust) * 0.3).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * dr, cy + Math.sin(a) * dr * 0.6, Math.min(W, H) * 0.02 * (1 - dust * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.06);
    ctx.scale(Math.max(0.0001, scale), Math.max(0.0001, scale));
    ctx.globalAlpha = (1 - gone) * Math.min(1, slam * 1.4);
    // The ring: hand-rough, double, with the name across it.
    var r = Math.min(W, H) * 0.21;
    ctx.strokeStyle = rgba(p.ink, 0.92);
    for (var ringI = 0; ringI < 2; ringI++) {
      ctx.lineWidth = (ringI === 0 ? 6 : 2.5) * u;
      ctx.beginPath();
      for (var k = 0; k <= 48; k++) {
        var a2 = (k / 48) * Math.PI * 2;
        var rr2 = r * (ringI === 0 ? 1 : 0.86) * (1 + (at(k + ringI * 60) - 0.5) * 0.04);
        var x = Math.cos(a2) * rr2, y = Math.sin(a2) * rr2;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.fillStyle = rgba(p.ink, 0.92);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(r * 0.28) + 'px Oswald';
    ctx.fillText(String(p.name), 0, -r * 0.08);
    ctx.font = '500 ' + Math.round(r * 0.12) + 'px Inter';
    ctx.fillText(String(p.tagline), 0, r * 0.22);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
