<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Editorial Title</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Editorial Title, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The kicker, the rule and the title settle by 1.15 s and the spread holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeInOut(clamp01(t / 1.1)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = 1 - gone;
    if (t > 0.05 && show <= 0.001) return;
    ctx.globalAlpha = show;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    var kickIn = easeOut(clamp01(t / 0.6));
    ctx.globalAlpha = show * kickIn;
    ctx.fillStyle = rgba(p.rule, 0.95);
    ctx.font = '600 ' + Math.round(30 * u) + 'px Inter';
    var spaced = String(p.kicker).toUpperCase().split('').join(String.fromCharCode(8202));
    ctx.fillText(spaced, W / 2, H * 0.4 + (1 - kickIn) * -12 * u);
    // The rule draws out from the centre both ways.
    ctx.strokeStyle = rgba(p.rule, 0.8); ctx.lineWidth = 1.5 * u;
    ctx.beginPath();
    ctx.moveTo(W / 2 - W * 0.14 * come, H * 0.445);
    ctx.lineTo(W / 2 + W * 0.14 * come, H * 0.445);
    ctx.stroke();
    var titleIn = easeOut(clamp01((t - 0.35) / 0.8));
    ctx.globalAlpha = show * titleIn;
    ctx.fillStyle = rgba(p.ink, 1);
    ctx.font = '700 ' + Math.round(104 * u) + 'px "Source Serif 4"';
    ctx.fillText(p.title, W / 2, H * 0.56 + (1 - titleIn) * 16 * u);
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
