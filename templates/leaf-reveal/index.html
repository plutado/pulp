<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Leaf Reveal</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Leaf Reveal, a sample template for Pulp. CC0-1.0: no rights reserved.
  // Every leaf's path, size and spin come from the seeded hash. A full-frame wash backs
  // the densest moment so the cut can never peek through the gaps.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var mid = d / 2;
    var n = Math.round(p.dense);
    for (var i = 0; i < n; i++) {
      // Each leaf crosses once, timed so the swarm is densest at the midpoint.
      var span = 0.5 + at(i) * 0.4;
      var start = mid - span * (0.3 + at(i + 11) * 0.7);
      var f = (t - start) / span;
      if (f <= 0 || f >= 1) continue;
      var x = W * (1.15 - f * 1.3);
      var y = H * at(i + 23) + Math.sin(f * 5 + i) * 60 * u;
      var r = (14 + at(i + 37) * 30) * u;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f * 7 + i);
      ctx.fillStyle = p.leaf;
      ctx.globalAlpha = 0.75 + at(i + 51) * 0.25;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.85, 0, 0, r);
      ctx.quadraticCurveTo(-r * 0.85, 0, 0, -r);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    var wash = 1 - Math.abs(t - mid) / (d * 0.14);
    if (wash > 0) {
      ctx.fillStyle = p.leaf;
      ctx.globalAlpha = easeInOut(clamp01(wash));
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  };
</script>
</body>
</html>
