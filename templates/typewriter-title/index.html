<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Typewriter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Typewriter, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The cursor blinks the whole way through, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.3)), gone = easeOut(clamp01((t - (d - 0.8)) / 0.8));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var line = String(p.line);
    var typed = Math.min(line.length, Math.floor(Math.max(0, t - 0.3) * 14));
    var out = line.slice(0, typed);
    ctx.globalAlpha = show;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var size = Math.min(W * 1.7 / Math.max(10, line.length), H * 0.09);
    ctx.font = '500 ' + Math.round(size) + 'px "JetBrains Mono"';
    var full = ctx.measureText(line).width;
    var x = W / 2 - full / 2;
    ctx.fillStyle = rgba(p.ink, 0.96);
    ctx.fillText(out, x, H / 2);
    // The cursor blinks on the typewriter's own clock, after every keystroke.
    var blink = Math.floor(t * 2.4) % 2 === 0;
    if (blink) {
      var cx = x + ctx.measureText(out).width + size * 0.1;
      ctx.fillRect(cx, H / 2 - size * 0.45, size * 0.5, size * 0.9);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
