<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Notification Stack</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Notification Stack, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The third toast lands at 1.2 s and the stack holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (t > 0.05 && (1 - gone) <= 0.001) return;
    var rows = [p.n1, p.n2, p.n3];
    var tw = Math.min(W * 0.42, 620 * u), th2 = 92 * u, gap = 18 * u;
    var x = W - tw - Math.min(W, H) * 0.06;
    for (var i = 0; i < rows.length; i++) {
      var come = overshoot(clamp01((t - i * 0.35) / 0.5));
      if (t < i * 0.35) continue;
      // The stack grows upward: earlier toasts step down as later ones arrive.
      var later = Math.min(2, Math.floor(Math.max(0, t - i * 0.35 - 0.35) / 0.35));
      var stepped = Math.min(rows.length - 1 - i, later);
      var y = H * 0.2 + (i + 0) * (th2 + gap);
      var slide = (1 - Math.min(1, come)) * (tw + W * 0.08);
      ctx.globalAlpha = (1 - gone) * Math.min(1, come);
      ctx.fillStyle = rgba(p.toast, 0.95);
      rr(x + slide, y, tw, th2, 18 * u); ctx.fill();
      ctx.fillStyle = rgba(p.accent, 1);
      rr(x + slide, y, 8 * u, th2, 4 * u); ctx.fill();
      ctx.beginPath(); ctx.arc(x + slide + 46 * u, y + th2 / 2, 17 * u, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(p.accent, 0.9); ctx.lineWidth = 3.5 * u; ctx.stroke();
      ctx.beginPath(); ctx.arc(x + slide + 46 * u, y + th2 / 2, 6 * u, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.accent, 0.9); ctx.fill();
      ctx.fillStyle = '#e5e7eb';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '600 ' + Math.round(28 * u) + 'px Inter';
      ctx.fillText(String(rows[i]), x + slide + 80 * u, y + th2 / 2 + 1 * u);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
