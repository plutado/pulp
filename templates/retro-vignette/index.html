<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Retro vignette</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Retro vignette, a sample overlay for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  // The feathered shape is built small and scaled up: a blur at a quarter of the size is cheap and smooth.
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');
  var SCALE = 4;

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  function rounded(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    c.lineTo(x + w, y + h - r);
    c.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    c.lineTo(x + r, y + h);
    c.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    c.lineTo(x, y + r);
    c.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    c.closePath();
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var fade = easeInOut(clamp01(t / dur)) * (1 - easeInOut(clamp01((t - (d - dur)) / dur)));
    if (fade <= 0) return;

    var short = Math.min(W, H);
    var r0 = p.radius * short;
    var feather = short * 0.3;              // how far the darkening reaches in from the edge

    // The sepia tint across the whole frame.
    if (p.tint > 0) {
      ctx.globalAlpha = fade * p.tint;
      ctx.fillStyle = p.tintColor;
      ctx.fillRect(0, 0, W, H);
    }

    if (p.strength > 0) {
      var ow = Math.max(2, Math.round(W / SCALE)), oh = Math.max(2, Math.round(H / SCALE));
      if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
      // Fill dark, then knock out a blurred rounded rectangle: the fill clears the middle and the blur
      // feathers the edge, leaving dark that builds smoothly toward the rounded corners.
      octx.globalCompositeOperation = 'source-over';
      octx.shadowBlur = 0;
      octx.clearRect(0, 0, ow, oh);
      octx.fillStyle = '#1a1208';
      octx.fillRect(0, 0, ow, oh);
      octx.globalCompositeOperation = 'destination-out';
      // Only the shadow lands on the canvas: the shape itself is drawn far off to the side, so the knockout
      // is a pure blur of the rounded rectangle, ramping smoothly on both sides of its edge.
      octx.shadowColor = 'rgba(0, 0, 0, 1)';
      octx.shadowBlur = feather * 0.9 / SCALE;
      octx.shadowOffsetX = ow * 3;
      octx.fillStyle = '#000000';
      var inset = feather * 0.3 / SCALE;
      octx.beginPath();
      rounded(octx, inset - ow * 3, inset, ow - inset * 2, oh - inset * 2, Math.max(0, r0 / SCALE));
      octx.fill();
      octx.fill();   // twice, so the middle is fully clear while the edge still ramps gently
      octx.shadowOffsetX = 0;
      octx.globalCompositeOperation = 'source-over';
      octx.shadowBlur = 0;

      ctx.globalAlpha = fade * p.strength;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, 0, 0, ow, oh, 0, 0, W, H);

      // Solid rounded corners: outside the outermost rounded rectangle is fully dark, like a print's edge.
      ctx.globalAlpha = fade * p.strength * 0.95;
      ctx.fillStyle = '#1a1208';
      ctx.beginPath();
      ctx.rect(-1, -1, W + 2, H + 2);
      rounded(ctx, 0, 0, W, H, r0);
      ctx.fill('evenodd');
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
