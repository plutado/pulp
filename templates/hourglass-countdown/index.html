<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hourglass</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hourglass, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The sand drains across the clip, so the length is fixed rather than declared as a hold.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 0.4)), gone = easeOut(clamp01((t - (d - 0.6)) / 0.6));
    var show = come * (1 - gone);
    if (show <= 0.001) return;
    var from = Math.round(p.from);
    var f = clamp01(t / (d - 1));
    var current = Math.ceil(from - from * f - 0.0001);
    var cx = W / 2, cy = H / 2, gh = Math.min(W, H) * 0.56, gw = gh * 0.5;
    ctx.globalAlpha = show;
    function bulb(top) {
      ctx.beginPath();
      if (top) {
        ctx.moveTo(cx - gw / 2, cy - gh / 2); ctx.lineTo(cx + gw / 2, cy - gh / 2);
        ctx.quadraticCurveTo(cx + gw / 2, cy - gh * 0.1, cx, cy);
        ctx.quadraticCurveTo(cx - gw / 2, cy - gh * 0.1, cx - gw / 2, cy - gh / 2);
      } else {
        ctx.moveTo(cx - gw / 2, cy + gh / 2); ctx.lineTo(cx + gw / 2, cy + gh / 2);
        ctx.quadraticCurveTo(cx + gw / 2, cy + gh * 0.1, cx, cy);
        ctx.quadraticCurveTo(cx - gw / 2, cy + gh * 0.1, cx - gw / 2, cy + gh / 2);
      }
      ctx.closePath();
    }
    ctx.save(); bulb(true); ctx.clip();
    ctx.fillStyle = rgba(p.sand, 1);
    var topLevel = cy - gh / 2 + gh * 0.5 * f;
    ctx.fillRect(cx - gw, topLevel, gw * 2, gh);
    ctx.restore();
    ctx.save(); bulb(false); ctx.clip();
    var pileTop = cy + gh / 2 - gh * 0.5 * f;
    ctx.beginPath(); ctx.moveTo(cx - gw, cy + gh); ctx.lineTo(cx - gw, pileTop + gh * 0.08);
    ctx.quadraticCurveTo(cx, pileTop - gh * 0.08, cx + gw, pileTop + gh * 0.08); ctx.lineTo(cx + gw, cy + gh); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (f < 1) { ctx.fillStyle = rgba(p.sand, 0.9); ctx.fillRect(cx - 2 * u, cy, 4 * u, Math.max(0, pileTop - cy)); }
    ctx.strokeStyle = rgba(p.glass, 0.85); ctx.lineWidth = 4 * u;
    bulb(true); ctx.stroke(); bulb(false); ctx.stroke();
    ctx.fillStyle = rgba(p.glass, 0.9);
    ctx.fillRect(cx - gw * 0.62, cy - gh / 2 - 14 * u, gw * 1.24, 14 * u);
    ctx.fillRect(cx - gw * 0.62, cy + gh / 2, gw * 1.24, 14 * u);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(gh * 0.3) + 'px Playfair';
    ctx.fillText(String(current), cx + gw * 0.8, cy);
  };
</script>
</body>
</html>
