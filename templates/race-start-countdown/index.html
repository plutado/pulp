<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Race Start Countdown</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Race Start Countdown, a sample template for Pulp. CC0-1.0: no rights reserved.
  // One second per lamp, five lamps, a one-second hold with every lamp lit, then
  // lights out and the word punches in. Gone by the last frame.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var lamps = 5;
    var per = 1;
    var holdAll = 1;
    var lit = Math.min(lamps, Math.floor(t / per) + (t % per > 0.12 ? 1 : 0));
    var allAt = lamps * per;
    var outAt = allAt + holdAll;
    var isOut = t >= outAt;
    var gone = easeInOut(clamp01((t - (d - 0.6)) / 0.6));
    if (gone >= 1) return;
    ctx.globalAlpha = 1 - gone;

    // The gantry: a dark bar with five housings.
    var gw = Math.min(W * 0.72, 860 * u), gh = 150 * u;
    var gx = W / 2 - gw / 2, gy = H * 0.3;
    ctx.fillStyle = 'rgba(12, 14, 18, 0.92)';
    ctx.beginPath();
    ctx.roundRect(gx, gy, gw, gh, 14 * u);
    ctx.fill();

    for (var i = 0; i < lamps; i++) {
      var cx = gx + gw * ((i + 0.5) / lamps), cy = gy + gh / 2, r = gh * 0.3;
      var on = !isOut && i < lit;
      if (on) {
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.4);
        g.addColorStop(0, p.lamp);
        g.addColorStop(1, p.lamp + '00');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = on ? p.lamp : 'rgba(255, 255, 255, 0.1)';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (isOut) {
      var punch = easeOut(clamp01((t - outAt) / 0.25));
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 ' + Math.round(170 * u * (0.7 + 0.3 * punch)) + 'px Montserrat';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = (1 - gone) * punch;
      ctx.fillText(p.word, W / 2, H * 0.62);
    }
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
