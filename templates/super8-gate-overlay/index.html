<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Super 8 Gate</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Super 8 Gate, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The gate jitter cycles over the clip and the rim breath is periodic in it, so the loop is seamless.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var frames = Math.floor(d * 30);
    var step = Math.floor(t * 30) % frames;
    var jx = (at(step * 3) - 0.5) * 5 * u, jy = (at(step * 3 + 1) - 0.5) * 4 * u;
    var inset = Math.min(W, H) * 0.045;
    // Everything outside the gate goes dark; the gate corners are deeply rounded.
    ctx.fillStyle = 'rgba(8,6,4,0.96)';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    var gx = inset + jx, gy = inset + jy, gw = W - inset * 2, gh = H - inset * 2, r = Math.min(W, H) * 0.07;
    ctx.moveTo(gx + r, gy);
    ctx.arcTo(gx + gw, gy, gx + gw, gy + gh, r); ctx.arcTo(gx + gw, gy + gh, gx, gy + gh, r);
    ctx.arcTo(gx, gy + gh, gx, gy, r); ctx.arcTo(gx, gy, gx + gw, gy, r);
    ctx.closePath();
    ctx.fill('evenodd');
    // The warm edge: light caught at the gate's rim, breathing with the loop.
    var breathe = 0.5 + 0.5 * Math.sin((t / d) * Math.PI * 2 * 2);
    rr(gx, gy, gw, gh, r);
    ctx.lineWidth = 10 * u; ctx.strokeStyle = rgba(p.edge, 0.18 + breathe * 0.14); ctx.stroke();
    ctx.lineWidth = 3 * u; ctx.strokeStyle = rgba(p.edge, 0.5 + breathe * 0.2); ctx.stroke();
  };
</script>
</body>
</html>
