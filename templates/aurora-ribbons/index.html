<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aurora Ribbons</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Aurora Ribbons, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Each ribbon is a sine band whose phase advances a whole number of turns per loop, so the last frame meets the first.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var loop = (t / d) % 1;

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p.sky);
    g.addColorStop(1, '#000000');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var colors = [p.a, p.b2, p.a, p.b2];
    for (var r = 0; r < 4; r++) {
      var baseY = H * (0.25 + r * 0.15);
      var turns = 1 + (r % 2);
      var phase = loop * Math.PI * 2 * turns + r * 1.3;
      ctx.beginPath();
      for (var i = 0; i <= 60; i++) {
        var f = i / 60, x = f * W;
        var y = baseY + Math.sin(f * 4 + phase) * H * 0.06 + Math.sin(f * 9 - phase * 0.5) * H * 0.02;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (var j = 60; j >= 0; j--) {
        var f2 = j / 60, x2 = f2 * W;
        var y2 = baseY + Math.sin(f2 * 4 + phase) * H * 0.06 + Math.sin(f2 * 9 - phase * 0.5) * H * 0.02 + H * 0.12;
        ctx.lineTo(x2, y2);
      }
      ctx.closePath();
      var rg = ctx.createLinearGradient(0, baseY, 0, baseY + H * 0.12);
      rg.addColorStop(0, rgba(colors[r], 0.0));
      rg.addColorStop(0.4, rgba(colors[r], 0.28));
      rg.addColorStop(1, rgba(colors[r], 0.0));
      ctx.fillStyle = rg;
      ctx.fill();
    }
  };
</script>
</body>
</html>
