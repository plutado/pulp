<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hand-drawn arrow</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hand-drawn arrow sample for Pulp. CC0-1.0: no rights reserved.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeInCubic(x) { return x * x * x; }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hash(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

  // Build the arrow as polylines in a local frame: the shaft runs from (-1, 0) to (1, 0), pointing +x.
  function buildStrokes(curved) {
    var shaft = [];
    var n = 40;
    for (var i = 0; i <= n; i++) {
      var u = -1 + 2 * i / n;
      // A gentle bow for the curved arrow; a straight run otherwise.
      var y = curved ? -0.42 * (1 - u * u) : 0;
      shaft.push([u, y]);
    }
    // The head is two strokes leaving the tip, angled back along the shaft's end direction.
    var tip = shaft[n], prev = shaft[n - 1];
    var ang = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
    var L = 0.34, spread = 0.62;
    var h1 = [[tip[0] - Math.cos(ang - spread) * L, tip[1] - Math.sin(ang - spread) * L], tip];
    var h2 = [[tip[0] - Math.cos(ang + spread) * L, tip[1] - Math.sin(ang + spread) * L], tip];
    return [shaft, resample(h1, 0.05), resample(h2, 0.05)];
  }
  function resample(pl, step) {
    var out = [pl[0]];
    for (var i = 1; i < pl.length; i++) {
      var dx = pl[i][0] - pl[i - 1][0], dy = pl[i][1] - pl[i - 1][1];
      var k = Math.max(1, Math.ceil(Math.hypot(dx, dy) / step));
      for (var j = 1; j <= k; j++) out.push([pl[i - 1][0] + dx * j / k, pl[i - 1][1] + dy * j / k]);
    }
    return out;
  }
  var STRAIGHT = buildStrokes(false), CURVED = buildStrokes(true);

  function polyLength(pl) {
    var L = 0;
    for (var i = 1; i < pl.length; i++) L += Math.hypot(pl[i][0] - pl[i - 1][0], pl[i][1] - pl[i - 1][1]);
    return L;
  }
  function wob(pt, idx, seed, amt) {
    var h1 = hash(idx * 7.13 + seed * 101.7 + 1) - 0.5;
    var h2 = hash(idx * 3.71 + seed * 57.3 + 2) - 0.5;
    return [pt[0] + h1 * amt, pt[1] + h2 * amt];
  }

  // Draw strokes in order up to a share of their total length, in the current transform, wobbling each point.
  function drawStrokes(strokes, share, seed, amt) {
    var total = 0, i;
    for (i = 0; i < strokes.length; i++) total += polyLength(strokes[i]);
    var budget = total * share;
    var idx = 0;
    for (i = 0; i < strokes.length && budget > 0; i++) {
      var pl = strokes[i];
      var q = wob(pl[0], idx++, seed, amt);
      ctx.beginPath();
      ctx.moveTo(q[0], q[1]);
      for (var j = 1; j < pl.length; j++) {
        var seg = Math.hypot(pl[j][0] - pl[j - 1][0], pl[j][1] - pl[j - 1][1]);
        var pt = pl[j];
        if (seg > budget) {
          var f = budget / seg;
          pt = [pl[j - 1][0] + (pl[j][0] - pl[j - 1][0]) * f, pl[j - 1][1] + (pl[j][1] - pl[j - 1][1]) * f];
        }
        q = wob(pt, idx++, seed, amt);
        ctx.lineTo(q[0], q[1]);
        budget -= seg;
        if (budget <= 0) break;
      }
      ctx.stroke();
    }
  }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    ctx.clearRect(0, 0, W, H);

    var dur = Math.min(p.inOut, d / 2);
    var inT = clamp01(t / dur);
    var outT = clamp01((t - (d - dur)) / dur);
    if (outT >= 1) return;

    var s = Math.min(W, H) / 1080;
    var cx = W / 2, cy = H / 2;
    // Half-length of the shaft along its own axis, as a share of the frame extent in that direction.
    var vertical = p.direction === 'up' || p.direction === 'down';
    var extent = vertical ? H : W;
    var half = extent * (p.length / 100) / 2;
    // Keep the bow and the head inside the short side.
    half = Math.min(half, Math.min(W, H) * 0.45);
    var rot = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[p.direction] || 0;

    var seed = Math.floor(state.time * 8);
    var amt = 0.03 * (p.wobble / 100);
    var share = easeInOut(inT);
    var lw = p.weight * s / half;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    // A curved arrow bows upward in its own frame; shift so the bow stays centred.
    if (p.curved) ctx.translate(0, half * 0.2);
    ctx.scale(half, half);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = p.color;
    ctx.lineWidth = lw;
    ctx.globalAlpha = 1 - easeInCubic(outT);
    drawStrokes(p.curved ? CURVED : STRAIGHT, share, seed, amt);
    // A second, lighter pass a frame of boil apart gives the marker its doubled, scribbly edge.
    ctx.globalAlpha = ctx.globalAlpha * 0.45;
    ctx.lineWidth = lw * 0.6;
    drawStrokes(p.curved ? CURVED : STRAIGHT, share, seed + 37, amt * 1.4);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
