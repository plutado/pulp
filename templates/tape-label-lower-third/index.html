<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tape Label</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Tape Label, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The tape presses down (a scale that settles with a small overshoot) and holds; the ends are torn by a jagged edge.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = overshoot(clamp01(t / 0.6)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = (1 - gone);
    if (t > 0 && show <= 0.001) return;
    var b = state.blocks.words.box, pad = 24 * u;
    var sx = b.x - pad, sy = b.y - pad, sw = b.width + pad * 2, sh = b.height + pad * 2;
    ctx.save();
    ctx.globalAlpha = show * clamp01(t / 0.12);
    ctx.translate(sx + sw / 2, sy + sh / 2);
    ctx.rotate(-0.035);
    ctx.scale(0.8 + 0.2 * come, 0.8 + 0.2 * come);
    ctx.translate(-(sx + sw / 2), -(sy + sh / 2));
    ctx.fillStyle = rgba(p.tape, 0.92);
    ctx.beginPath();
    ctx.moveTo(sx, sy + 4 * u);
    for (var i = 0; i <= 6; i++) ctx.lineTo(sx + (at(i) - 0.5) * 10 * u, sy + (i / 6) * sh);
    ctx.lineTo(sx + sw + 2 * u, sy + sh - 2 * u);
    for (var k = 6; k >= 0; k--) ctx.lineTo(sx + sw + (at(k + 9) - 0.5) * 10 * u, sy + (k / 6) * sh);
    ctx.closePath(); ctx.fill();
    // The tape's sheen: a lighter band across it, and a soft shadow beneath.
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(sx + 6 * u, sy + 6 * u, sw - 12 * u, sh * 0.22);
    ctx.fillStyle = 'rgba(40,30,20,0.12)';
    ctx.fillRect(sx + 4 * u, sy + sh, sw - 8 * u, 6 * u);
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.35 - position * 0.2) / 0.45));
        return { alpha: lineIn, dy: (1 - lineIn) * 5 * u };
      }
    });
    window.pulpDrawBlock(ctx, laid);
    ctx.restore();
  };
</script>
</body>
</html>
