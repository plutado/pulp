<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dot and Line</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Dot and Line, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Dot at 0.3 s, rule drawn by 0.9 s, words out by 1.2 s; then it holds.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var gone = easeOut(clamp01((t - 5.2) / 0.8));
    var show = 1 - gone;
    if (t > 0 && show <= 0.001) return;
    var b = state.blocks.words.box;
    var drop = overshoot(clamp01(t / 0.45));
    var line = easeInOut(clamp01((t - 0.35) / 0.55));
    var lx = b.x - 22 * u, ly = b.y + b.height + 10 * u;
    ctx.globalAlpha = show;
    ctx.fillStyle = rgba(p.accent, 1);
    ctx.beginPath(); ctx.arc(lx, ly, 7 * u * Math.max(0.0001, drop), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rgba(p.accent, 0.9); ctx.lineWidth = 2.5 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx + 10 * u, ly); ctx.lineTo(lx + 10 * u + (b.width - 10 * u) * line, ly); ctx.stroke();
    // The words slide up from behind the rule, clipped at it.
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x - 4 * u, b.y - 30 * u, b.width + 8 * u, b.height + 38 * u); ctx.clip();
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.55 - position * 0.25) / 0.55));
        return { alpha: Math.min(1, lineIn * 1.6), dy: (1 - lineIn) * b.height * 0.6 };
      }
    });
    window.pulpDrawBlock(ctx, laid);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
</script>
</body>
</html>
