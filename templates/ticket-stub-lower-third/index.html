<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ticket Stub</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Ticket Stub, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // The stub rises, tilts into place and holds; the tear line is drawn, not torn.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var come = easeOut(clamp01(t / 1.0)), gone = easeOut(clamp01((t - 5.2) / 0.8));
    if (come * (1 - gone) <= 0.001) return;
    var b = state.blocks.words.box, pad = 26 * u, stubW = 54 * u;
    var sx = b.x - pad - stubW, sy = b.y - pad, sw = b.width + pad * 2 + stubW, sh = b.height + pad * 2;
    ctx.save();
    ctx.translate(sx + sw / 2, sy + sh / 2 + (1 - come) * sh * 1.6 + gone * sh * 1.6);
    ctx.rotate(-0.03 * come + 0.02 * gone);
    ctx.translate(-(sx + sw / 2), -(sy + sh / 2));
    ctx.fillStyle = rgba(p.paper, 0.97);
    var notch = 14 * u;
    ctx.beginPath();
    ctx.moveTo(sx + notch, sy);
    ctx.lineTo(sx + sw - notch, sy); ctx.arcTo(sx + sw, sy, sx + sw, sy + notch, notch);
    ctx.lineTo(sx + sw, sy + sh - notch); ctx.arcTo(sx + sw, sy + sh, sx + sw - notch, sy + sh, notch);
    ctx.lineTo(sx + notch, sy + sh); ctx.arcTo(sx, sy + sh, sx, sy + sh - notch, notch);
    ctx.lineTo(sx, sy + notch); ctx.arcTo(sx, sy, sx + notch, sy, notch);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(p.edge, 0.9); ctx.lineWidth = 3 * u; ctx.stroke();
    // The tear line: a dashed perforation with punched half-circles at its ends.
    var tearX = sx + stubW;
    ctx.setLineDash([6 * u, 7 * u]);
    ctx.strokeStyle = rgba(p.edge, 0.65); ctx.lineWidth = 2.5 * u;
    ctx.beginPath(); ctx.moveTo(tearX, sy + 6 * u); ctx.lineTo(tearX, sy + sh - 6 * u); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(tearX, sy, 8 * u, 0, Math.PI * 2); ctx.arc(tearX, sy + sh, 8 * u, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // The stub's star, stamped on the short side.
    ctx.fillStyle = rgba(p.edge, 0.8);
    ctx.save(); ctx.translate(sx + stubW / 2, sy + sh / 2); ctx.rotate(-0.35);
    ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = (i / 10) * Math.PI * 2 - Math.PI / 2, r = (i % 2 ? 7 : 15) * u; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.restore();
    var laid = window.pulpLayoutBlock(ctx, state, 'words', {
      each: function (layer, position) {
        var lineIn = easeOut(clamp01((t - 0.3 - position * 0.2) / 0.5));
        return { alpha: lineIn * (1 - gone), dy: (1 - lineIn) * 8 * u };
      }
    });
    window.pulpDrawBlock(ctx, laid);
    ctx.restore();
  };
</script>
</body>
</html>
