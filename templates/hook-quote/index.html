<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hook Quote</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Hook Quote, a hook title for Pulp made for vertical (milestone 65; docs/vertical-layouts.md). CC0-1.0: no rights reserved.
  //
  // An oversized quotation mark lands at the quote's corner, the words rise in under it, and a short
  // rule draws in before who said it. The mark and the rule are the design's; the words are layers.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }

  // One clock for every hook: a line arrives over half a second, a step after the line above it —
  // three steps at most, so a line added in the tab is in by 1.04 s and the hold from 1.2 s holds
  // with it. Everything leaves together from 4.4 s.
  var STEP = 0.18, ARRIVE = 0.5, OUT_AT = 4.4, OUT_FOR = 0.5;
  function arrival(t, position) { return easeOut(clamp01((t - Math.min(position, 3) * STEP) / ARRIVE)); }
  function leaving(t) { return easeInOut(clamp01((t - OUT_AT) / OUT_FOR)); }
  function fit(state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    ctx.clearRect(0, 0, state.width, state.height);
  }
  /** The extent of a laid block's drawn words: left, top, right and bottom over every layer that has room. */
  function extentOf(laid) {
    var e = null;
    laid.layers.forEach(function (l) {
      if (l.box.width <= 0 && l.box.height <= 0) return;
      var left = l.box.x, right = l.box.x + l.box.width;
      if (l.lines && l.lines.length) {
        left = Infinity; right = -Infinity;
        l.lines.forEach(function (ln) { if (ln.width > 0) { left = Math.min(left, ln.x); right = Math.max(right, ln.x + ln.width); } });
        if (!isFinite(left)) return;
      }
      if (!e) e = { left: left, top: l.box.y, right: right, bottom: l.box.y + l.box.height };
      else { e.left = Math.min(e.left, left); e.top = Math.min(e.top, l.box.y); e.right = Math.max(e.right, right); e.bottom = Math.max(e.bottom, l.box.y + l.box.height); }
    });
    return e;
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  document.fonts.load('italic 600 64px Playfair');
  window.pulpRender = function (state) {
    fit(state);
    var W = state.width, H = state.height, t = state.time, p = state.params;
    var u = Math.min(W, H) / 1080;
    var gone = leaving(t);
    if (gone >= 1) return;
    var block = state.blocks.quote.box;
    var quote = window.pulpLayoutBlock(ctx, state, 'quote', {
      each: function (layer, position) {
        var a = arrival(t, position + 1);
        return { alpha: a * (1 - gone), dy: (1 - a) * 24 * u - gone * 24 * u };
      }
    });
    var markIn = arrival(t, 0);
    ctx.save();
    ctx.globalAlpha = Math.min(1, markIn * 1.6) * (1 - gone);
    ctx.fillStyle = p.mark;
    // Oversized on purpose: the mark is the design, set into the room above the quote's first line.
    var markSize = Math.round(520 * u);
    ctx.font = 'italic 600 ' + markSize + 'px Playfair';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    // The mark's foot is above its baseline (its descent is negative): the baseline goes that far below
    // where the foot should end.
    var lift = -ctx.measureText('\u201C').actualBoundingBoxDescent;
    ctx.fillText('\u201C', block.x - 14 * u, block.y - 12 * u + lift - (1 - markIn) * 20 * u - gone * 24 * u);
    ctx.restore();
    // The rule sits in the gap above who said it — above, not beside, so a long name keeps the whole width.
    var last = quote.layers[quote.layers.length - 1];
    if (quote.layers.length > 1 && last && last.lines && last.lines.length) {
      var grow = easeOut(clamp01((t - 0.55) / 0.5)) * (1 - gone);
      ctx.fillStyle = p.mark;
      ctx.fillRect(last.lines[0].x, last.box.y - 14 * u - gone * 24 * u, 64 * u * grow, Math.max(2, 4 * u));
    }
    window.pulpDrawBlock(ctx, quote);
  };
</script>
</body>
</html>
