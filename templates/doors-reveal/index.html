<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Doors</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Doors, a sample for Pulp (milestone 36). CC0-1.0: no rights reserved.
  // Stretching the length only slows the swing, which is what scale means.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function overshoot(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function at(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function hex(c, i) { return parseInt(c.substr(i, 2), 16); }
  function rgba(c, a) { return 'rgba(' + hex(c, 1) + ',' + hex(c, 3) + ',' + hex(c, 5) + ',' + a.toFixed(4) + ')'; }
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  window.pulpRender = function (state) {
    var p = state.params;
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, t = state.time, d = state.duration;
    var u = Math.min(W, H) / 1080;
    ctx.clearRect(0, 0, W, H);
    var f = t / d;
    var shut = easeInOut(clamp01(f * 2));
    var open = easeInOut(clamp01(f * 2 - 1));
    var swing = shut * (1 - open);
    // Each door is a panel foreshortened by its swing, hinged at the frame's edge.
    for (var side = 0; side < 2; side++) {
      var wPanel = W / 2 * swing;
      var x = side ? W - wPanel : 0;
      var g = ctx.createLinearGradient(side ? W : 0, 0, side ? W - W / 2 : W / 2, 0);
      g.addColorStop(0, rgba(p.door, 1));
      g.addColorStop(1, rgba(p.door, 0.88));
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, wPanel, H);
      // Panel mouldings, so the doors read as doors.
      if (swing > 0.3) {
        ctx.strokeStyle = 'rgba(255,240,210,0.14)'; ctx.lineWidth = 3 * u;
        var inset = wPanel * 0.18;
        ctx.strokeRect(x + inset, H * 0.08, Math.max(1, wPanel - inset * 2), H * 0.36);
        ctx.strokeRect(x + inset, H * 0.52, Math.max(1, wPanel - inset * 2), H * 0.4);
      }
    }
    // The seam of light where they meet.
    if (swing > 0.9) {
      var a = (swing - 0.9) * 10;
      ctx.fillStyle = rgba(p.seam, a * 0.9);
      ctx.fillRect(W / 2 - 2 * u, 0, 4 * u, H);
    }
  };
</script>
</body>
</html>
