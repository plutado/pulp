# How Pulp is packaged (milestone 17). Builds are unsigned for now; signing
# and notarization are milestone 7, and this file is where the identity will
# go when there is one.
#
#   npm run package:mac     a universal .app, a .dmg and a .zip, unsigned
#   npm run package:win     an NSIS installer, unsigned (run on Windows)
#   npm run package:linux   an AppImage with a .desktop entry (run on Linux)
#
# Each platform's build is made on that platform, which is what the release
# workflow does (.github/workflows/release.yml): a Windows installer wants
# Windows to sign and stamp it later, and an AppImage wants a Linux
# tool chain. Nothing here is cross-built.
#
# What goes in, and what stays out: the built app is `out/` (electron-vite's
# output) and nothing else of the repository — no sources, no tests, no
# `templates/` — because everything Pulp reads at run time is copied into
# `Resources/` by `extraResources` below, and `src/main/resources.ts` is the
# one place that knows where each lands.
appId: com.davidfugate.pulp
productName: Pulp
copyright: Copyright © 2026 David Fugate. MIT licensed; see THIRD_PARTY_NOTICES.md.

directories:
  # The icons this reads are drawn by `npx electron scripts/make-icon.mjs` and committed.
  buildResources: build
  output: release

# One shape of name for every artifact, since they all land on one release page together:
# "Pulp-0.1.0-macos-universal.dmg", "Pulp-0.1.0-linux-x64.AppImage". The installer adds
# "Setup" to its own, below, because an `.exe` that installs and an `.exe` that runs look
# the same in a downloads folder otherwise.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# The two files Pulp opens as a project (milestone 27), so a double-click opens them in Pulp
# (milestone 17): macOS writes these into the bundle's Info.plist, the installer registers them
# for the user on Windows, and the AppImage's .desktop entry carries their MIME types. The main
# process reads the path the system hands over (src/core/open-file.ts) and the window opens it
# through the same opener as File → Open.
fileAssociations:
  - ext: pulp
    name: Pulp Project
    description: Pulp project
    mimeType: application/x-pulp-project
    role: Editor
  - ext: pulpcollection
    name: Pulp Collection
    description: Pulp collection
    mimeType: application/x-pulp-collection
    role: Editor

# Only the built app and the manifest that points at it. electron-vite bundles everything the
# main, preload and renderer code imports into `out/` — the built main process requires nothing
# but `electron` and Node's own modules — so **no `node_modules` ships**. That has to be said
# outright: electron-builder copies the production dependency tree unless told not to, which
# here would mean pdf.js's native canvas (a binary per architecture, tens of megabytes) that
# Pulp never calls, and which stopped the universal build outright for differing between the
# two architectures. The two libraries Pulp reads as *files* at run time are extraResources.
files:
  - out/**
  - package.json
  - '!node_modules/**'

extraResources:
  # The bundled library: templates the app shows as "Built-in templates", the ten OFL fonts
  # every template page is given, and the example projects the start screen opens as copies.
  - from: templates
    to: templates
  - from: fonts
    to: fonts
  - from: examples
    to: examples
  # pdf.js, read as text into the sandboxed rasterizer (milestone 33), and lottie-web's player,
  # served to a Lottie's own page (milestone 35). Both are read from disk at run time rather
  # than bundled into the main process, so both have to be files in the app.
  - from: node_modules/pdfjs-dist/build
    to: pdfjs
    filter:
      - pdf.min.mjs
      - pdf.worker.min.mjs
  - from: node_modules/lottie-web/build/player
    to: lottie
    filter:
      - lottie_light.min.js
  # What Pulp is built on, beside the app, as the licenses ask.
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE

# macOS: one build for both architectures, with the hardened runtime on.
#
# `identity: "-"` is an **ad-hoc** signature: no Developer ID, no team, nothing Apple has
# issued — which is what "unsigned" means here — but a real signature over the bundle, which
# is the least Apple Silicon will launch, and which is what lets the hardened runtime be
# applied at all. (The runtime is a signing option: with signing skipped outright it would be
# written here and do nothing.) Signing proper is milestone 7, and from here it is the
# identity changing rather than any behavior.
#
# An ad-hoc build is still quarantined when it is downloaded: Gatekeeper refuses it until it
# is opened through the Finder's context menu once, or `xattr -dr com.apple.quarantine` is
# run on it. The entitlements are what Electron needs under the hardened runtime — a JIT for
# V8 and the unsigned executable memory Chromium's renderers use — and library validation
# off, which ad-hoc signing requires and which also lets ffmpeg and whisper.cpp run as
# children of the app.
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Pulp reads media the person points it at; macOS asks for a reason before it may.
    NSDocumentsFolderUsageDescription: Pulp reads the template and media folders you add to its library.
    NSDesktopFolderUsageDescription: Pulp reads the template and media folders you add to its library.
    NSDownloadsFolderUsageDescription: Pulp reads the template and media folders you add to its library.
    # Recording a voice (milestone 63): what Pulp records, and why — this is the sentence the
    # system's own microphone prompt shows the first time the Record button is pressed.
    NSMicrophoneUsageDescription: Pulp records from the microphone only while its Record button is pressed, and saves the take into your library on this computer.

dmg:
  # The window a .dmg opens: the app, and the Applications folder to drag it into.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

# Windows: an NSIS installer, unsigned. x64 only: Windows on ARM runs x64 apps under its own
# emulation, and a second installer to choose wrongly from is worse than the emulation.
#
# Unsigned here means unsigned — Windows has no ad-hoc signature the way macOS does. SmartScreen
# shows "Windows protected your PC" on a downloaded installer until the certificate of milestone 7
# is behind it, and "More info" → "Run anyway" is the way past it; docs/packaging.md says so.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # The executable is Pulp.exe, so the task bar, the task manager and the Start menu all
  # name the app rather than the project folder.
  executableName: Pulp

nsis:
  # Not a one-click installer: it asks where to go and what shortcuts to make, which is what
  # a tool people keep beside an editing app should do.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user by default, so no administrator prompt: Pulp writes nothing outside its own folders.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pulp
  uninstallDisplayName: Pulp ${version}
  # What a person made stays: the library index, the settings and the render cache live in
  # the user's app data, and uninstalling a renderer should not throw away their work.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-${os}-${arch}-Setup.${ext}

# Linux: an AppImage, which runs on any desktop distribution without being installed. x64 only
# for the same reason as Windows; a Linux person on another architecture builds from source.
linux:
  target:
    - target: AppImage
      arch: [x64]
  # The PNG sizes in build/icons, which is what a Linux desktop reads for its menus.
  icon: build/icons
  category: AudioVideo
  synopsis: Browse, preview, customize and render motion-graphics templates
  description: >-
    Pulp browses, previews, customizes and renders open-format motion-graphics templates —
    lower thirds, titles, transitions and overlays — and hands the result to an editing app.
  # The entry is named after `desktopName` in package.json, which is also what Electron
  # reports as the window's own class: without the two agreeing, a dock shows the AppImage's
  # generic icon beside the running app instead of grouping them under this entry.
  syncDesktopName: true
  desktop:
    entry:
      # The categories a video tool belongs in, and the words a person searches a launcher
      # with. `StartupWMClass` is left to electron-builder, which writes the name above.
      Categories: AudioVideo;Video;AudioVideoEditing;Graphics;
      Keywords: video;motion graphics;template;title;lower third;render;ffmpeg;
