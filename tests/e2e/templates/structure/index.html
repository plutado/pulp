<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Structure fixture (milestone 30). The frame is filled with the template's own time in
  // milliseconds, split across two channels so it reads back exactly: red is the high byte,
  // green the low one, which covers any time up to 65 seconds. Blue is the progress, for a
  // second opinion. Nothing here knows what length was asked for — that is the point.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  window.pulpRender = function (state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var ms = Math.round(state.time * 1000);
    ctx.fillStyle = 'rgb(' + Math.floor(ms / 256) + ',' + (ms % 256) + ',' + Math.round(state.progress * 255) + ')';
    ctx.fillRect(0, 0, state.width, state.height);
  };
</script>
</body>
</html>
