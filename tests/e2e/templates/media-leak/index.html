<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100%;height:100%}</style></head>
<body>
<canvas id="c" width="64" height="36"></canvas>
<script>
  // Tries to load a library media URL from inside a template page. Red means the request was
  // refused (the expected outcome under the template security rules); green means it got through.
  'use strict';
  var ctx = document.getElementById('c').getContext('2d');
  window.pulpRender = function (state) {
    var url = state.params.url;
    var tries = [
      fetch(url).then(function () { return true; }, function () { return false; }),
      new Promise(function (resolve) {
        var a = new Audio();
        a.onloadedmetadata = function () { resolve(true); };
        a.onerror = function () { resolve(false); };
        a.src = url;
        setTimeout(function () { resolve(false); }, 1500);
      }),
    ];
    return Promise.all(tries).then(function (results) {
      ctx.fillStyle = results.some(Boolean) ? '#00ff00' : '#ff0000';
      ctx.fillRect(0, 0, 64, 36);
    });
  };
</script>
</body>
</html>
