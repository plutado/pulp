<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Twin Canvas</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // The hand-written twin (milestone 55's test): what the editor composes —
  // a 30%-tall amber rectangle 2.5 times as wide as tall over a 20%-tall blue
  // square, both still, stacked in a column with a 2% gap, centered in the
  // canvas block's box — drawn here with raw canvas calls from the same
  // fractions. The built template must render these very frames.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  window.pulpRender = function (state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height, short = Math.min(W, H);
    ctx.clearRect(0, 0, W, H);
    // The canvas block's box, and the stack inside it.
    var box = { x: 0.06 * W, y: 0.06 * H, width: 0.88 * W, height: 0.88 * H };
    var gap = 0.02 * short;
    var h1 = 0.3 * short, w1 = Math.min(box.width, h1 * 2.5);
    var h2 = 0.2 * short, w2 = Math.min(box.width, h2 * 1);
    var total = h1 + gap + h2;
    var y1 = box.y + (box.height - total) / 2;
    var y2 = y1 + h1 + gap;
    ctx.fillStyle = '#e8a33d';
    ctx.fillRect(box.x + (box.width - w1) / 2, y1, w1, h1);
    ctx.fillStyle = '#2266ff';
    ctx.fillRect(box.x + (box.width - w2) / 2, y2, w2, h2);
  };
</script>
</body>
</html>
