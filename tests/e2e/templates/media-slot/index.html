<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Media-slot fixture (milestone 22). The template says where the clip goes and nothing about
  // which frame: the host decides the frame for this moment and the bridge draws it. A marker in
  // the top-left corner is painted every frame so a blank render can be told from an absent slot,
  // and nothing is drawn in the box while the slot plays nothing, so a delay and a once-through's
  // end read as transparency there.
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  window.pulpRender = function (state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    ctx.clearRect(0, 0, state.width, state.height);
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(0, 0, 8, 8);
    window.pulpDrawMedia(ctx, state, 'plate');
  };
</script>
</body>
</html>
