<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Aspect probe: the size-portrait fixture without a declared size. The manifest names four
  // shapes and nothing else; whatever canvas the host hands over is drawn edge to edge. It is
  // a transparent frame with opaque 16x16 corner markers and a 1px checkerboard patch, all
  // placed from state.width/height. The e2e test
  // reads single pixels back to verify resolution, orientation and that the
  // frame was captured at full size (any rescale blurs the checkerboard).
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  window.pulpRender = function (state) {
    if (canvas.width !== state.width || canvas.height !== state.height) {
      canvas.width = state.width;
      canvas.height = state.height;
    }
    var W = state.width, H = state.height;
    ctx.clearRect(0, 0, W, H);

    // Templates that size canvases by devicePixelRatio must see 1; mark the center otherwise.
    if (window.devicePixelRatio !== 1) {
      ctx.fillStyle = '#ff00ff';
      ctx.fillRect(W / 2 - 8, H / 2 - 8, 16, 16);
    }

    ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#00ff00'; ctx.fillRect(W - 16, 0, 16, 16);
    ctx.fillStyle = '#0000ff'; ctx.fillRect(0, H - 16, 16, 16);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(W - 16, H - 16, 16, 16);

    // 64x64 checkerboard at (32, 32): white where (x + y) is even, else black.
    var img = ctx.createImageData(64, 64);
    for (var y = 0; y < 64; y++) {
      for (var x = 0; x < 64; x++) {
        var i = (y * 64 + x) * 4;
        var v = (x + y) % 2 === 0 ? 255 : 0;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 32, 32);
  };
</script>
</body>
</html>
